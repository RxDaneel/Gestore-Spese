<style>
/* Stessa base di YTG: barra in alto, contenuto che scorre, tab bar al fondo. Stessi temi, stesso font. */
:root{
  --bg:#f3f1ea; --surface:#e9e6dc; --raised:#dfdbcf; --line:#d6d1c4;
  --fg:#141413; --muted:#65635c; --accent:#3b3b38; --on-accent:#f5f4ef; --danger:#c43c3c; --good:#2f7d32;
  --font:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --nav-h:58px;
  /* colori delle categorie (palette verificata per daltonismo, nell'ordine fisso) */
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--cx:#9c9a92;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1a19; --surface:#242422; --raised:#2e2e2b; --line:#353532;
  --fg:#f5f4ef; --muted:#9c9a92; --accent:#d9d7d1; --on-accent:#1a1a19; --danger:#e06060; --good:#5cb860;
  color-scheme:dark;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--cx:#6f6d66;
}}
:root[data-theme="carta"]{--bg:#f3f1ea;--surface:#e9e6dc;--raised:#dfdbcf;--line:#d6d1c4;--fg:#141413;--muted:#65635c;--accent:#3b3b38;--on-accent:#f5f4ef;--danger:#c43c3c;--good:#2f7d32;color-scheme:light;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--cx:#9c9a92}
:root[data-theme="oled"]{--bg:#000000;--surface:#0e0e0e;--raised:#1a1a1a;--line:#232323;--fg:#f2f2f2;--muted:#8c8c8c;--accent:#e6e6e6;--on-accent:#000000;--danger:#e06060;--good:#5cb860;color-scheme:dark}
/* ===== tema VERDE: vetro scuro e verde lime luminoso (font Inter, tutto a pillola) ===== */
:root[data-theme="verde"]{--bg:#050906;--surface:#0c140d;--raised:#152017;--line:rgba(150,255,150,.10);--fg:#f1f8f0;--muted:#8da291;--accent:#8ef58a;--on-accent:#06230a;
  --danger:#ff7a7a;--good:#8ef58a;--hl:#f2d45c;--sel:#8ef58a;--on-sel:#06230a;
  --grad:linear-gradient(140deg,#d2fcbf 0%,#9df796 38%,#5ad66d 100%);
  --glass:linear-gradient(180deg,rgba(170,255,170,.075),rgba(170,255,170,.012));
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark;
  --c1:#8ef58a;--c2:#f5a35c;--c3:#4fd1c5;--c4:#f2d45c;--c5:#f47ea8;--c6:#5aa9f5;--c7:#b18cf5;--c8:#ff7a7a;--cx:#5d6e60}
:root:is([data-theme="verde"],[data-theme="aurora"]) body,:root:is([data-theme="verde"],[data-theme="aurora"]) .sheet{background:radial-gradient(120% 50% at 50% -6%,#1e4a21 0%,#0a170b 46%,#050906 74%) no-repeat,#050906}
:root:is([data-theme="verde"],[data-theme="aurora"]) body{letter-spacing:-.01em}
:root:is([data-theme="verde"],[data-theme="aurora"]) header,:root:is([data-theme="verde"],[data-theme="aurora"]) main{background:transparent}
:root:is([data-theme="verde"],[data-theme="aurora"]) header{border-color:transparent}
:root:is([data-theme="verde"],[data-theme="aurora"]) #hMonth{font-weight:800;letter-spacing:-.035em;font-size:23px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .icon-btn{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);margin-left:6px;width:38px;height:38px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .icon-btn svg{width:19px;height:19px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .pbar{background:rgba(5,9,6,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .pbar .icon-btn{margin-left:0}
:root:is([data-theme="verde"],[data-theme="aurora"]) :is(.panel,.tile,.card2,.ccard,.items,.sumbudget,.cd:not(.blank):not(.none)){background:var(--glass),#0a120b;box-shadow:inset 0 0 0 1px var(--line)}
:root:is([data-theme="verde"],[data-theme="aurora"]) :is(.panel,.card2,.ccard,.items){border-radius:24px}
:root:is([data-theme="verde"],[data-theme="aurora"]) :is(.tile,.sumbudget){border-radius:20px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .cd{border-radius:14px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .ccard:active,:root:is([data-theme="verde"],[data-theme="aurora"]) .tx:active{background:#152017}
:root:is([data-theme="verde"],[data-theme="aurora"]) .panel .tx{background:transparent}
:root:is([data-theme="verde"],[data-theme="aurora"]) .tx{background:transparent}
:root:is([data-theme="verde"],[data-theme="aurora"]) .swipe .tx{background:#070d08}
:root:is([data-theme="verde"],[data-theme="aurora"]) .panel .swipe .tx{background:#0b130c}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero{margin:12px 16px 4px;padding:18px 18px 16px;border-radius:28px;background:var(--grad);color:#06230a;position:relative;overflow:hidden;
  box-shadow:0 22px 50px -18px rgba(120,240,110,.6),inset 0 1px 0 rgba(255,255,255,.6)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);pointer-events:none}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero small{color:rgba(6,35,10,.72);font-weight:600}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero>b{font-weight:800;letter-spacing:-.045em;font-size:42px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero .sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;position:relative;z-index:1}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero .sub span{display:flex;flex-direction:column;gap:1px;background:#08160b;color:#9fbca3;border-radius:16px;padding:9px 12px;font-size:11.5px;font-weight:500}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero .sub span b{color:#f1f8f0;font-size:15px;font-weight:700}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero .delta{color:rgba(6,35,10,.8);font-weight:600}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero .delta i{color:#06230a}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero .pill-status{background:rgba(6,35,10,.14);color:#06230a}
:root:is([data-theme="verde"],[data-theme="aurora"]) .shead button{color:var(--accent)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .shead button:not([data-act="newCat"])::after{content:" →"}
:root:is([data-theme="verde"],[data-theme="aurora"]) .chip{background:#0c150d;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
:root:is([data-theme="verde"],[data-theme="aurora"]) :is(.chip,.seg button,.chips.sub .chip,.catgrid.subs .chip)[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 0 18px -2px rgba(142,245,138,.55)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .seg button{background:#0c150d;box-shadow:inset 0 0 0 1px var(--line)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .btn{border-radius:999px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .btn:not(.ghost):not(.danger){background:var(--accent);color:var(--on-accent);box-shadow:0 10px 26px -8px rgba(142,245,138,.7)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .btn.ghost{background:#0e180f;box-shadow:inset 0 0 0 1px var(--line)}
:root:is([data-theme="verde"],[data-theme="aurora"]) :is(.field input[type=text],.field input[type=date],.field input[inputmode],.searchbar input,.field textarea,.ghform input){border-radius:18px;background:var(--glass),#0a120b;border-color:var(--line)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .amount{margin:12px 16px 4px;width:calc(100% - 32px);border-radius:26px;background:var(--glass),#0a120b;box-shadow:inset 0 0 0 1px var(--line);padding:26px 16px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .amount #amt{font-weight:800;letter-spacing:-.04em}
:root:is([data-theme="verde"],[data-theme="aurora"]) .amount .caret{background:var(--accent)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .kp{background:rgba(8,14,9,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:0;border-radius:26px 26px 0 0;box-shadow:inset 0 1px 0 var(--line),0 -16px 40px rgba(0,0,0,.55)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .kp button{background:#111c13;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .kp .ok{background:var(--accent);color:var(--on-accent);box-shadow:0 0 24px -4px rgba(142,245,138,.7)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .cd.today .n,:root:is([data-theme="verde"],[data-theme="aurora"]) .dpill.on{background:var(--accent);color:var(--on-accent)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .cd[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .dpill{background:#0c150d;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .bar{background:#16221a;border-radius:4px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .bar i{border-radius:4px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .bar.budget i{background:var(--accent)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .banner{border-radius:22px;background:var(--glass),#0d170e;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .banner svg{stroke:var(--accent)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .banner.warn{background:var(--danger);color:#fff}
:root:is([data-theme="verde"],[data-theme="aurora"]) .banner.warn svg{stroke:#fff}
:root:is([data-theme="verde"],[data-theme="aurora"]) .cb{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 16px -4px currentColor}
:root:is([data-theme="verde"],[data-theme="aurora"]) .toast{border-radius:20px;background:var(--accent);color:var(--on-accent);font-weight:600}
:root:is([data-theme="verde"],[data-theme="aurora"]) .toast button{color:var(--on-accent)}
/* barra in basso: una pillola di vetro che galleggia, solo icone */
:root:is([data-theme="verde"],[data-theme="aurora"]) nav{margin:0 14px calc(var(--bot) + 6px);padding:0 4px;border:0;border-radius:32px;background:rgba(14,24,15,.84);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:inset 0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.55)}
:root:is([data-theme="verde"],[data-theme="aurora"]) nav button{font-size:0;gap:0}
:root:is([data-theme="verde"],[data-theme="aurora"]) nav button svg{padding:9px;box-sizing:content-box;border-radius:50%;margin:-9px}
:root:is([data-theme="verde"],[data-theme="aurora"]) nav button[aria-current="true"] svg{stroke:var(--accent);background:rgba(142,245,138,.16);box-shadow:inset 0 0 0 1px rgba(142,245,138,.3)}
:root:is([data-theme="verde"],[data-theme="aurora"]) nav .plus svg{width:28px;height:28px;padding:12px;margin:0;background:var(--accent);stroke:var(--on-accent);box-shadow:0 0 26px -2px rgba(142,245,138,.75)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .pcpick{background:#0d170e;box-shadow:inset 0 0 0 1px var(--line),0 12px 50px rgba(0,0,0,.6)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .askbar{background:rgba(142,245,138,.10);box-shadow:inset 0 0 0 1px rgba(142,245,138,.25)}
@media (min-width:900px){:root:is([data-theme="verde"],[data-theme="aurora"]) nav{margin:0;border-radius:0}}


/* ===== tema OLED A COLORI: lo stesso stile del Verde (Inter, vetro, pillole) su nero puro, con una sfumatura multicolore ===== */
:root[data-theme="aurora"]{--bg:#000000;--surface:#0b0b0e;--raised:#16161b;--line:rgba(255,255,255,.09);--fg:#f4f4f7;--muted:#8e8e99;--accent:#8fb4ff;--on-accent:#0b0b14;
  --danger:#ff6b7a;--good:#5ee6b0;--hl:#ffd25a;--sel:#f4f4f7;--on-sel:#0b0b14;
  --grad:linear-gradient(130deg,#7cf5c8 0%,#6fb6ff 34%,#a98bff 66%,#ff8ac0 100%);
  --glass:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.012));
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark;
  --c1:#6fb6ff;--c2:#ff9f5a;--c3:#5ee6b0;--c4:#ffd25a;--c5:#ff7eb6;--c6:#a98bff;--c7:#4fd8e8;--c8:#ff6b7a;--cx:#5f5f6b}
:root[data-theme="aurora"] body,:root[data-theme="aurora"] .sheet{background:#000}
:root[data-theme="aurora"] .pbar{background:rgba(0,0,0,.74)}
:root[data-theme="aurora"] :is(.panel,.tile,.card2,.ccard,.items,.sumbudget,.cd:not(.blank):not(.none)){background:var(--glass),#070709}
:root[data-theme="aurora"] .ccard:active,:root[data-theme="aurora"] .tx:active{background:#14141a}
:root[data-theme="aurora"] .swipe .tx{background:#000}
:root[data-theme="aurora"] .panel .swipe .tx{background:#08080a}
:root[data-theme="aurora"] .hero{color:#0b0b14;box-shadow:0 22px 50px -18px rgba(150,140,255,.55),inset 0 1px 0 rgba(255,255,255,.6)}
:root[data-theme="aurora"] .hero small{color:rgba(11,11,20,.7)}
:root[data-theme="aurora"] .hero .sub span{background:rgba(0,0,0,.84);color:#a3a3b2}
:root[data-theme="aurora"] .hero .sub span b{color:#f4f4f7}
:root[data-theme="aurora"] .hero .delta{color:rgba(11,11,20,.8)}
:root[data-theme="aurora"] .hero .delta i{color:#0b0b14}
:root[data-theme="aurora"] .hero .pill-status{background:rgba(11,11,20,.14);color:#0b0b14}
:root[data-theme="aurora"] :is(.chip,.seg button,.dpill){background:#0b0b0e}
:root[data-theme="aurora"] :is(.chip,.seg button,.chips.sub .chip,.catgrid.subs .chip)[aria-pressed="true"]{background:var(--grad);color:#0b0b14;box-shadow:0 0 18px -4px rgba(169,139,255,.65)}
:root[data-theme="aurora"] .chartseg button[aria-pressed="true"]{background:var(--grad);color:#0b0b14}
:root[data-theme="aurora"] .btn:not(.ghost):not(.danger){background:var(--grad);color:#0b0b14;box-shadow:0 10px 26px -10px rgba(169,139,255,.85)}
:root[data-theme="aurora"] .btn.ghost{background:#0d0d11}
:root[data-theme="aurora"] :is(.field input[type=text],.field input[type=date],.field input[inputmode],.searchbar input,.field textarea,.ghform input),:root[data-theme="aurora"] .amount{background:var(--glass),#070709}
:root[data-theme="aurora"] .kp{background:rgba(6,6,8,.95)}
:root[data-theme="aurora"] .kp button{background:#111116}
:root[data-theme="aurora"] .kp .ok{background:var(--grad);color:#0b0b14;box-shadow:0 0 24px -6px rgba(169,139,255,.8)}
:root[data-theme="aurora"] .cd.today .n,:root[data-theme="aurora"] .dpill.on{background:var(--grad);color:#0b0b14}
:root[data-theme="aurora"] .bar{background:#1a1a20}
:root[data-theme="aurora"] .banner{background:var(--glass),#0b0b0e}
:root[data-theme="aurora"] .banner.warn{background:var(--danger)}
:root[data-theme="aurora"] .toast{background:var(--grad);color:#0b0b14}
:root[data-theme="aurora"] .toast button{color:#0b0b14}
:root[data-theme="aurora"] nav{background:rgba(12,12,16,.86)}
:root[data-theme="aurora"] nav button[aria-current="true"] svg{stroke:#fff;background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
:root[data-theme="aurora"] nav .plus svg{background:var(--grad);stroke:#0b0b14;box-shadow:0 0 26px -2px rgba(150,140,255,.7)}
:root[data-theme="aurora"] .pcpick{background:#0b0b0e}
:root[data-theme="aurora"] .askbar{background:rgba(143,180,255,.10);box-shadow:inset 0 0 0 1px rgba(143,180,255,.28)}
:root[data-theme="aurora"] .askprog i{background:var(--grad)}
/* nessun bagliore nel tema nero: tutto piatto */
:root[data-theme="aurora"] .cb{box-shadow:none}
:root[data-theme="aurora"] .hero{box-shadow:none}
:root[data-theme="aurora"] .hero::after{display:none}
:root[data-theme="aurora"] :is(.chip,.seg button,.chips.sub .chip,.catgrid.subs .chip)[aria-pressed="true"]{box-shadow:none}
:root[data-theme="aurora"] .btn:not(.ghost):not(.danger),:root[data-theme="aurora"] .kp .ok{box-shadow:none}
:root[data-theme="aurora"] nav{box-shadow:inset 0 0 0 1px var(--line)}
:root[data-theme="aurora"] nav .plus svg{box-shadow:none}
:root[data-theme="aurora"] .kp{box-shadow:inset 0 1px 0 var(--line)}

/* card del totale anche nei temi Nero OLED e Carta (stessa forma del Verde, nei loro colori) */
:root[data-theme="oled"]{--hero-bg:linear-gradient(140deg,#f4f4f4 0%,#d6d6d6 55%,#b4b4b4 100%);--hero-ink:#000;--hero-ink2:rgba(0,0,0,.62);--hero-chip:#000;--hero-chip-ink:#f2f2f2;--hero-chip-mut:#9a9a9a}
:root[data-theme="carta"]{--hero-bg:linear-gradient(140deg,#4a4a46 0%,#2c2c29 60%,#1c1c1a 100%);--hero-ink:#f5f4ef;--hero-ink2:rgba(245,244,239,.7);--hero-chip:#f3f1ea;--hero-chip-ink:#141413;--hero-chip-mut:#65635c}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero{margin:12px 16px 4px;padding:18px 18px 16px;border-radius:28px;background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);pointer-events:none}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero small{color:var(--hero-ink2);font-weight:500}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero>b{font-size:40px;letter-spacing:-.03em}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero .sub{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:12px;position:relative;z-index:1}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero .sub span{display:flex;flex-direction:column;gap:1px;background:var(--hero-chip);color:var(--hero-chip-mut);border-radius:16px;padding:9px 12px;font-size:11.5px;font-weight:500}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero .sub span b{color:var(--hero-chip-ink);font-size:15px;font-weight:700}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero .delta{color:var(--hero-ink2);font-weight:500}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero .delta i{color:var(--hero-ink)}
:root:is([data-theme="oled"],[data-theme="carta"]) .hero .pill-status{background:color-mix(in srgb,var(--hero-ink) 14%,transparent);color:var(--hero-ink)}
:root[data-theme="carta"] .hero::after{opacity:.35}
/* titoli delle sezioni nei due temi nuovi: frase normale e più grandi, non maiuscoletto */
:root:is([data-theme="verde"],[data-theme="aurora"]) :is(.section>h2,.group,.shead h2){text-transform:none;letter-spacing:-.015em;font-size:18px;font-weight:700;color:var(--fg)}
:root:is([data-theme="verde"],[data-theme="aurora"]) .field>label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
:root:is([data-theme="verde"],[data-theme="aurora"]) .pbar h3{letter-spacing:-.02em}
:root:is([data-theme="verde"],[data-theme="aurora"]) .card2 .shead{margin:2px 16px 12px}
/* nel tema OLED i grafici usano i colori per lo sfondo scuro */
:root[data-theme="oled"]{
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--cx:#6f6d66}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font)}
body{display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;height:auto}
/* iOS 26: nelle web app sulla schermata Home l'altezza "100%" si ferma prima del fondo; 100dvh invece copre tutto lo schermo */
@supports (height:100dvh){html{height:100dvh}body{bottom:auto;height:100dvh}}
button,input,select,textarea{font:inherit;color:inherit}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{position:relative;flex:none;z-index:20;background:var(--bg);padding:calc(var(--top) + 6px) 8px 6px 16px;
  display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
header h1{font:700 22px/1.2 var(--font);margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.logo{border:0;background:none;padding:4px 6px 4px 0;color:var(--muted);flex:none;display:flex;align-items:center}
.logo svg{width:42px;height:26px;display:block}
.logo:active{opacity:.6}
#hMonth{border:0;background:none;padding:6px 0;font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-transform:capitalize}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);flex:none}
.icon-btn:active{background:var(--raised)}
.icon-btn:disabled{opacity:.3}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 0 24px}
.view{max-width:760px;margin:0 auto}

nav{position:relative;flex:none;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--bot)}
nav button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--fg);font-weight:600}
nav button[aria-current="true"] svg{stroke:var(--fg);stroke-width:2.3}
/* tasto + grande, rotondo e pieno, che sporge un po' sopra la barra */
nav .plus{overflow:visible}
nav .plus svg{width:34px;height:34px;padding:11px;box-sizing:content-box;border-radius:50%;background:var(--fg);stroke:var(--bg);stroke-width:2.4;
  margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 5px var(--bg)}
nav .plus svg circle{stroke:none}
nav .plus:active svg{transform:scale(.94)}
@media (min-width:900px){nav .plus svg{margin-top:0;box-shadow:0 6px 18px rgba(0,0,0,.35)}}

.section{padding:8px 16px}
.section>h2,.group{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;font-weight:600}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 10px}
.shead h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.shead button{border:0;background:none;color:var(--fg);font-size:13px;font-weight:600;padding:2px 0}
.panel{background:var(--surface);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.help{color:var(--muted);font-size:13px;line-height:1.55}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font:700 21px/1.25 var(--font);margin:0 0 8px}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--accent);color:var(--on-accent);font-weight:600;display:inline-block;text-align:center}
.btn.ghost{background:var(--raised);color:var(--fg)}
.btn.wide{display:block;width:100%}
.btn.danger{background:none;color:var(--danger)}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}

/* cifra principale del mese */
.hero{padding:18px 16px 4px}
.hero small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.hero b{display:block;font:700 38px/1.15 var(--font);letter-spacing:-.01em;margin:2px 0 6px}
.hero .sub{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.hero .sub span b,.sub b{display:inline;font:600 13px var(--font);color:var(--fg);margin:0;letter-spacing:0}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--muted);margin-top:8px}
.delta i{font-style:normal;font-size:11px}
.delta.up i{color:var(--danger)} .delta.down i{color:var(--good)}

.banner{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 14px;border-radius:14px;background:var(--fg);color:var(--bg);border:0;width:calc(100% - 32px);text-align:left}
.banner svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner div{flex:1;min-width:0}
.banner small{display:block;opacity:.75;font-size:12.5px}

/* ciambella + elenco categorie */
.donut{display:flex;justify-content:center;padding:16px 0 4px}
.donut svg{width:210px;height:210px;overflow:visible}
.donut .dseg{cursor:pointer;transition:opacity .2s}
.donut.focus .dseg{opacity:.3}.donut.focus .dseg.on{opacity:1}
.crow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.crow:first-child{border-top:0}
.crow:active{background:var(--raised)}
.dot{width:12px;height:12px;border-radius:50%;flex:none!important}
/* cerchio colorato con l'icona della categoria */
.cb{width:34px;height:34px;border-radius:50%;flex:none!important;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;line-height:1}
.cb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cb.lg{width:36px;height:36px}.cb.lg svg{width:20px;height:20px}
.cb.sm{width:28px;height:28px;font-size:12px}.cb.sm svg{width:16px;height:16px}
.chip .ci{width:16px;height:16px;flex:none;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"] .ci{stroke:currentColor!important}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.icons button{aspect-ratio:1;border:0;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;padding:0}
.icons button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icons button[aria-pressed="true"]{color:#fff}
.catprev{display:flex;align-items:center;gap:12px;padding:4px 16px 14px}
.catprev b{font-size:17px;font-weight:600}
.crow .mid{flex:1;min-width:0}
.crow .nm{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:500}
.crow .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:6px;border-radius:0 4px 4px 0;background:var(--raised);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.bar.budget i{background:var(--fg)}
.bar.budget.over i{background:var(--danger)}
.warn{color:var(--danger);font-weight:600}
.crow .subs{color:var(--muted);font-size:12px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .subs b{color:var(--fg);font-weight:500}
.nest{padding:0 14px 6px 38px}
.srow{padding:9px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.nest .srow{padding:6px 0;border-top:0}
.srow>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.nest .srow>div:first-child{font-size:13.5px;font-weight:400}
.srow small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.srow .bar{height:4px;margin-top:6px}
.leaf{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.leaf:first-child{border-top:0}
.leaf .mid{flex:1;min-width:0}
.chev{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* movimenti */
.searchbar{display:flex;gap:8px;padding:12px 16px 4px}
.searchbar input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.searchbar input:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--raised);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .dot{width:9px;height:9px}
.chips.sub{padding-top:0}
.chips.sub .chip{background:none;box-shadow:inset 0 0 0 1px var(--line);padding:5px 11px;font-size:12.5px}
.chips.sub .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.catgrid.subs .chip{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.catgrid.subs .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
/* calendario */
.viewseg{padding:12px 16px 0}
.cal{padding:8px 12px 0}
.cal .wd,.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:2px 0 4px}
.cd{border:0;background:var(--surface);border-radius:10px;min-height:66px;padding:5px 1px 5px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);min-width:0}
.cd.blank{background:none;pointer-events:none}
.cd.none{background:none}
.cd.future{opacity:.35}
.cd .n{font-size:13px;font-weight:500;line-height:20px;min-width:22px;padding:0 4px;border-radius:999px;font-variant-numeric:tabular-nums}
.cd.today .n{background:var(--fg);color:var(--bg);font-weight:700}
.cd[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.cd .dots{display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:3px;width:27px;height:15px}
.cd .dots i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.cd .dots b{font-size:9px;line-height:6px;width:6px;text-align:center;color:var(--muted);font-weight:700}
.cd .amt{margin-top:auto;font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden}
.cd .amt.hi{color:var(--fg);font-weight:700}
.cd .amt.in{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 16px 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:18px 16px 6px}
.dayhead b{font-size:16px;font-weight:600;display:block}
.dayhead b::first-letter{text-transform:uppercase}
.dayhead span{color:var(--muted);font-size:13px}
.day{display:flex;justify-content:space-between;padding:16px 16px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tx{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;border:0;background:var(--bg);text-align:left;touch-action:pan-y;transition:transform .22s ease}
.tx:active{background:var(--surface)}
/* scorrendo un movimento verso sinistra compare "Elimina" */
.swipe{position:relative;overflow:hidden;transition:height .2s ease,opacity .2s ease}
.swipe:not(.sw) .sdel{visibility:hidden}
.sdel{position:absolute;inset:0;border:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 22px;font-weight:600;font-size:14px}
.sdel svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tx .ic{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;font-size:14.5px;white-space:nowrap}
.tx .a.in{color:var(--good)}
.panel .tx{padding:10px 14px;background:var(--surface)}
.panel .tx:active{background:var(--raised)}
.panel .swipe+.swipe{border-top:1px solid var(--line)}

/* grafici a barre */
.chart{position:relative;padding:14px 10px 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--font);fill:var(--muted)}
.chart .lbl{font-weight:600;fill:var(--fg)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .b{transition:opacity .15s}
.chart.focus .b{opacity:.35}.chart.focus .b.on{opacity:1}
.tip{position:fixed;z-index:9001;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;font-size:13px}

/* report */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.tile b{display:block;font:700 20px/1.25 var(--font);margin-top:2px}
.tile span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.story{font-size:15px;line-height:1.6}
.story p{margin:0 0 10px}.story p:last-child{margin:0}
.story b{font-weight:600}
.pill-status{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--raised);color:var(--fg)}
.wk{display:grid;grid-template-columns:34px 1fr 64px;gap:10px;align-items:center;padding:6px 14px;font-size:13px}
.wk .bar{margin:0;height:8px}
.wk .bar i{background:var(--accent)}
.wk em{text-align:right;font-style:normal;color:var(--muted);font-size:12px}

/* fogli a tutto schermo (come il player di YTG) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding-top:var(--top);padding-bottom:calc(var(--bot) + 24px);transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg)}
.pbar h3{flex:1;margin:0;font:700 19px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .btn{padding:8px 16px}
.seg{display:flex;gap:6px;padding:6px 16px 0}
.seg button{flex:1;border:0;border-radius:999px;padding:9px 12px;background:var(--raised);font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.amount{display:flex;align-items:center;justify-content:center;gap:6px;padding:22px 16px 16px;width:100%;border:0;background:none;color:var(--fg)}
.amount #amt{font:700 44px/1.1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.amount #amt.ph{color:var(--muted)}
.amount #amt.long{font-size:34px}
.amount .cur{font:700 32px var(--font);color:var(--muted)}
.amount .caret{width:2px;height:36px;background:var(--fg);margin:0 2px 0 -4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* tastierino dell'app: l'importo resta sempre visibile e c'è il tasto OK */
.kp{position:fixed;left:0;right:0;bottom:0;z-index:45;max-width:760px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 8px calc(var(--bot) + 8px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.kp button{height:52px;border:0;border-radius:12px;background:var(--raised);font:500 24px var(--font);color:var(--fg);display:grid;place-items:center;-webkit-user-select:none;user-select:none}
.kp button:active{background:var(--line)}
.kp .ok{grid-row:span 2;height:auto;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:20px}
.kp .ok:active{opacity:.8;background:var(--accent)}
.kp .zero{grid-column:span 3}
.kp svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet.kpon{padding-bottom:calc(var(--bot) + 290px)}
.field{padding:0 16px 14px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.field input[type=text],.field input[type=date],.field input[inputmode]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
.field input:focus{border-color:var(--accent)}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.catgrid .chip{padding:9px 13px}
.field .subed{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 14px;border-top:1px solid var(--line)}
.field .subed:first-child{border-top:0}
.field .subed input[type=text]{flex:1;min-width:0;width:auto;border:0;background:none;padding:10px 0;min-height:0;border-radius:0}
.field .subed .icon-btn{color:var(--muted)}
.field .subed .icon-btn svg{width:18px;height:18px}
.subadd{display:flex;gap:8px;margin-top:10px}
.field .subadd input[type=text]{flex:1;min-width:0;width:auto}
.subadd .btn{flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatches button{width:33px;height:33px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px transparent;padding:0}
.swatches button[aria-pressed="true"],.swatches label[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.swatches label{position:relative;width:33px;height:33px;border-radius:50%;border:3px solid var(--bg);display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:conic-gradient(#e34948,#eda100,#d4d000,#1baf7a,#2a78d6,#6250d6,#e87ba4,#e34948)}
.swatches label.set{background:var(--sw)}
.swatches label svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.6))}
.swatches label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.swlab{display:block;font-size:12px;color:var(--muted);margin:12px 0 8px}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;font-size:15px}
.list-item:first-child{border-top:0}
.list-item:active{background:var(--raised)}
.list-item span{flex:1;min-width:0}
.list-item small.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:1px 0 2px}
.list-item small{display:block;color:var(--muted);font-size:12px}
.list-item.danger{color:var(--danger)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.tprev{width:100%;height:74px;border-radius:12px;padding:9px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.3)}
.tprev b{flex:1 0 100%;padding:8px 9px;font-size:15px;font-weight:700;letter-spacing:-.02em;text-align:left}
.tprev i{height:10px;width:30%;border-radius:6px;display:block}
.themes button{border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px;background:var(--surface);color:var(--fg);font:500 12.5px var(--font);display:flex;flex-direction:column;align-items:center;gap:7px}
.themes button[aria-pressed="true"]{border-color:var(--fg)}
.themes .sw{width:44px;height:44px;border-radius:50%;border:1px solid rgba(128,128,128,.35);position:relative;overflow:hidden}
.themes .sw i{position:absolute;right:0;bottom:0;width:50%;height:50%}

.ghform{padding:12px 14px 14px;display:grid;gap:10px}
.ghform input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;min-height:46px}
.ghform input:focus{border-color:var(--accent)}
.ghstat{display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:14px}
.ghstat i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--good)}
.ghstat.err i{background:var(--danger)}
.ghstat.off i{background:var(--muted)}
.ghstat small{display:block;color:var(--muted);font-size:12px}
.ghstat.err small{color:var(--danger)}
.help ol{padding-left:20px;margin:6px 0 0}
.help li{margin:3px 0}
.help a{color:var(--fg);font-weight:600}
.banner.warn{background:var(--danger);color:#fff}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:8px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:1px;display:block}
.spark i.z{background:var(--line)!important;height:1px!important}
.mtab{width:100%;border-collapse:collapse;font-size:13.5px}
.mtab th{text-align:right;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 6px}
.mtab th:first-child,.mtab td:first-child{text-align:left}
.mtab td{text-align:right;padding:9px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mtab tr[data-mrep]{cursor:pointer}
.mtab tr[data-mrep]:active td{background:var(--raised)}
.mtab td:first-child{text-transform:capitalize;font-weight:500}
.mtab td.pos{color:var(--good)}
.mtab td.neg{color:var(--danger)}
.mtab tr.off td{color:var(--muted)}
.mtab tfoot td{font-weight:700;border-top:2px solid var(--line)}
/* card "Statistiche": striscia dei giorni + grafico ad area */
.card2{background:var(--surface);border-radius:14px;padding:14px 0 6px}
.card2 .shead{margin:0 14px 10px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.dstrip::-webkit-scrollbar{display:none}
.dpill{flex:none;width:44px;border:0;border-radius:14px;background:var(--raised);color:var(--fg);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:center}
.dpill b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.dpill small{font-size:10.5px;color:var(--muted);text-transform:capitalize}
.dpill i{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px;opacity:0}
.dpill.has i{opacity:1}
.dpill.on{background:var(--sel,var(--fg));color:var(--on-sel,var(--bg))}
.dpill.on small{color:inherit;opacity:.7}
.dpill.future{opacity:.4}
.area .guide{stroke:var(--muted);stroke-width:1;opacity:0}
.area .gdot{fill:var(--accent);stroke:var(--surface);stroke-width:2;opacity:0}
.area.focus .guide,.area.focus .gdot{opacity:1}
.alegend{display:flex;gap:16px;padding:2px 14px 6px;font-size:12px;color:var(--muted)}
.alegend span{display:inline-flex;align-items:center;gap:6px}
.alegend i{display:block;width:14px;height:8px;border-radius:3px;background:var(--accent)}
.alegend i.dot{height:0;border-radius:0;background:none;border-top:2px dotted var(--hl,var(--muted))}
.tip small{display:block;opacity:.75;font-size:11.5px}
/* barra proporzionale delle categorie + card con i pallini */
.stack{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;margin:0 0 12px}
.stack i{display:block;min-width:3px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ccard{border:0;background:var(--surface);color:var(--fg);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:9px;min-width:0}
.ccard:active{background:var(--raised)}
.ccard .top{display:flex;align-items:center;gap:9px;min-width:0}
.ccard .top div{min-width:0}
.ccard .top b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .top small{display:block;font-size:11.5px;color:var(--muted)}
.ccard .amt{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.ccard .amt b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ccard .amt span{font-size:12px;color:var(--muted);font-weight:600}
.dots20{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dots20 i{display:block;aspect-ratio:1;border-radius:50%;background:var(--raised)}
.ccard .foot{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .foot.warn{color:var(--danger);font-weight:600}
.hgrid{display:flex;flex-direction:column}
.hgrid .hside{display:contents}
.hgrid .hside>.hero{order:0}.hgrid .hmain{order:1}.hgrid .hside>.section{order:2}
/* PC: barra laterale come una dashboard, contenuto su due colonne */
@media (min-width:900px){
  nav{position:fixed;left:0;top:0;bottom:0;width:88px;flex-direction:column;justify-content:center;gap:6px;border-top:0;border-right:1px solid var(--line);padding:0}
  nav button{flex:none;height:64px}
  header{padding-left:104px}
  main{padding-left:88px}
  #vReport{max-width:1180px}
  .toast{bottom:24px}
  .kp{left:88px}
  .hgrid .hside{display:block}
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:8px 20px;align-items:start;padding:0 8px}
  .hgrid .hside{grid-column:2;grid-row:1/span 2}
  .hgrid .hmain{grid-column:1;grid-row:1}
  .hgrid .hside .hero{margin:16px 0 4px}
  .cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{left:auto;width:min(520px,100%);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
}
/* riepilogo di una categoria (solo lettura) */
.sumhead{display:flex;align-items:center;gap:14px;padding:6px 16px 4px}
.sumhead .cb{width:52px;height:52px}.sumhead .cb svg{width:26px;height:26px}
.sumhead small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.sumhead b{display:block;font:700 30px/1.15 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sumfacts{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px 0;color:var(--muted);font-size:13px}
.sumfacts b{color:var(--fg);font-weight:600}
.sumbudget{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--surface)}
.sumbudget .bar{margin-top:8px}
/* scontrino: pulsanti, elenco articoli, scelta categoria prodotto */
.rcbtns{display:flex;gap:8px;flex-wrap:wrap}
.rcbtns .btn{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.field .rcbtns label.btn{display:flex;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg);margin:0}
.rcbtns input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.rcwait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 2px}
.rcwait i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.field textarea{width:100%;min-height:150px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;resize:vertical;font-size:16px!important}
.items{background:var(--surface);border-radius:14px;overflow:hidden;margin-top:10px}
.item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .pc{width:38px;height:38px;border-radius:11px;border:0;background:var(--raised);font-size:19px;flex:none;display:grid;place-items:center;padding:0}
.field .item input[type=text]{flex:1;min-width:0;width:auto;border:0;background:none;padding:8px 4px;min-height:0;border-radius:8px}
.field .item input.ip{flex:none;width:78px;text-align:right;font-variant-numeric:tabular-nums}
.field .item input:focus{background:var(--raised)}
.item .x{flex:none;width:30px;height:34px;border:0;background:none;color:var(--muted);font-size:20px;padding:0}
.itemfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.itemfoot b{color:var(--fg)}
.itemfoot button{border:0;background:none;color:var(--fg);font-weight:600;font-size:13px;padding:4px 0}
.itemfoot .warn{color:var(--danger)}
.item .nm2{flex:1;min-width:0;display:flex;flex-direction:column}
.item .raw{font:500 10.5px/1.2 ui-monospace,Menlo,monospace;color:var(--muted);padding:0 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.ask{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.item.ask .raw{color:var(--fg)}
.item.ask .in::placeholder{color:var(--accent)}
.askbar{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));font-size:13.5px;line-height:1.4}
.askbar b{font-weight:700}
.rczone{position:relative;min-height:120px;border:2px dashed var(--line);border-radius:16px;padding:16px;display:block;color:var(--fg);font-size:14px;line-height:1.45;outline:none;background:var(--surface);-webkit-user-select:text;user-select:text;overflow:hidden;max-height:160px;caret-color:transparent}
.rczone:focus{border-color:var(--accent)}
/* il testo d'aiuto è solo disegnato: il riquadro resta vuoto, non c'è niente da cancellare prima di incollare */
.rczone:empty::before{content:"📋  Tieni premuto qui e scegli «Incolla»";position:absolute;inset:0;display:grid;place-items:center;padding:0 16px;text-align:center;color:var(--muted);font-weight:600;pointer-events:none}
/* procedura guidata per i prodotti non chiari */
.askprog{height:4px;border-radius:4px;background:var(--raised);margin:2px 16px 0;overflow:hidden}
.askprog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.askcard{margin:16px 16px 18px;padding:18px 16px;border-radius:20px;background:var(--surface);text-align:center}
.askcard small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.askraw{display:block;margin:8px 0 6px;font:700 22px/1.25 ui-monospace,Menlo,"SF Mono",monospace;letter-spacing:.02em;word-break:break-word}
.askcard .askp{color:var(--muted);font-size:13px}
.askcard .askp b{color:var(--fg)}
.asksug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.asksug button{border:0;border-radius:999px;padding:8px 13px;background:var(--raised);color:var(--fg);font-size:13.5px;font-weight:500}
.asksug button.g{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.askpcs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.askpcs button{border:0;border-radius:12px;background:var(--surface);color:var(--fg);padding:9px 4px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
.askpcs button span{font-size:21px}
.askpcs button[aria-pressed="true"]{background:var(--sel,var(--fg));color:var(--on-sel,var(--bg))}
.asknav{display:flex;gap:8px;padding:6px 16px 0}
.asknav .btn{flex:1}
.askdone{text-align:center;padding:40px 24px 10px}
.askdone div{font-size:52px}
.askdone h2{margin:8px 0 6px;font:700 22px/1.25 var(--font)}
/* report: righe "in breve", scelta del grafico */
.ins{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.ins:first-child{border-top:0}
.ins .ie{width:34px;height:34px;border-radius:11px;background:var(--raised);display:grid;place-items:center;font-size:17px;flex:none}
.ins p{margin:0;font-size:14px;line-height:1.4;flex:1;min-width:0}
.ins b{font-weight:700}
.chartseg{display:flex;gap:6px;padding:12px 12px 0}
.chartseg.top{padding:12px 16px 0}
.chartseg button{flex:1;border:0;border-radius:999px;padding:7px 8px;background:var(--raised);color:var(--muted);font-size:13px;font-weight:600}
.chartseg button[aria-pressed="true"]{background:var(--sel,var(--fg));color:var(--on-sel,var(--bg))}
.chcap{margin:0;padding:0 14px 12px;text-align:center}
.chcap b{color:var(--fg)}
.crow .chev,.prow .chev{margin-left:-4px}
.hero .sub{row-gap:4px}
:root:is([data-theme="verde"],[data-theme="aurora"]) .hero .sub{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.field>label .opt{text-transform:none;letter-spacing:0;font-weight:400;opacity:.8;margin-left:4px}
/* tre modi per lo scontrino, affiancati */
.rcbtns .btn{flex:1;min-width:0;flex-direction:column;gap:3px;padding:10px 4px;font-size:13px}
.rcbtns .btn span{font-size:20px;line-height:1}
.field .rcbtns label.btn{font-size:13px}
.manform label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.manform label:first-child{margin-top:0}
.manform input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;min-height:46px;-webkit-appearance:none;appearance:none}
.manform input:focus{border-color:var(--accent)}
.manform .asksug:empty{display:none}
.prow .x{flex:none;width:30px;height:34px;border:0;background:none;color:var(--muted);font-size:20px;padding:0}
/* risparmio con gli sconti */
.savebar{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;margin:12px 0 6px}
.savebar i{display:block}
.savelg{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.savelg span{display:inline-flex;align-items:center;gap:6px}
.savelg i{width:9px;height:9px;border-radius:3px;display:block}
.tile b.good{color:var(--good)}
.prow .rawc{display:block;font:500 10.5px ui-monospace,Menlo,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pcbtn{border:0;background:var(--raised);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.namerow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.namerow:first-child{border-top:0}
.namerow .mid{flex:1;min-width:0}
.namerow code{display:block;font:500 11px ui-monospace,Menlo,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namerow input{width:100%;border:0;background:none;padding:4px 0;font-size:15px!important;color:var(--fg);outline:none}
.namerow .pc{width:34px;height:34px;border-radius:10px;border:0;background:var(--raised);font-size:17px;flex:none}
.namerow .x{border:0;background:none;color:var(--muted);font-size:20px;width:30px}
.pcpick{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 8px);z-index:9500;background:var(--surface);border-radius:20px;padding:12px;box-shadow:0 12px 50px rgba(0,0,0,.5);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:520px;margin:0 auto}
.pcpick button{border:0;border-radius:12px;background:var(--raised);color:var(--fg);padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.pcpick button span{font-size:22px}
.pcpick button[aria-pressed="true"]{background:var(--sel,var(--fg));color:var(--on-sel,var(--bg))}
.pcscrim{position:fixed;inset:0;z-index:9499;background:rgba(0,0,0,.4)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;color:var(--fg)}
.prow:first-child{border-top:0}
.prow:active{background:var(--raised)}
.prow .em{width:36px;height:36px;border-radius:11px;background:var(--raised);display:grid;place-items:center;font-size:19px;flex:none}
.prow .mid{flex:1;min-width:0}
.prow .t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .s{font-size:12px;color:var(--muted)}
.prow .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.prow .a small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.prow .bar{height:4px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--nav-h) + 14px);background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;z-index:9000;font-size:14px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;padding:2px 4px;text-decoration:underline}
/* ===== STILE "MORBIDO": testo più grande e contrastato, carattere Nunito, forme tonde ===== */
/* tutto un po' più grande e più contrastato */

:root[data-look] body{font-size:16px}
:root[data-look] #hMonth{font-size:25px}

:root[data-look] .field>label{text-transform:none;letter-spacing:0;font-weight:700}
:root[data-look] .shead .help,:root[data-look] .shead button{font-size:14px}
:root[data-look] .help{font-size:14px}
:root[data-look] .hero small{font-size:14.5px}
:root[data-look] .hero>b{font-size:46px!important}
:root[data-look] .hero .sub span{font-size:13px!important;padding:10px 13px!important}
:root[data-look] .hero .sub span b{font-size:17px!important}
:root[data-look] .hero .delta{font-size:14px}
:root[data-look] .tx{padding:12px 16px;gap:14px}
:root[data-look] .tx .t{font-size:16.5px;font-weight:600}
:root[data-look] .tx .s{font-size:13.5px;margin-top:1px}
:root[data-look] .tx .a{font-size:16.5px}
:root[data-look] .cb.lg{width:42px;height:42px}:root[data-look] .cb.lg svg{width:22px;height:22px}
:root[data-look] .day{font-size:13px;padding-top:20px}
:root[data-look] .chip{font-size:14.5px;padding:9px 15px}
:root[data-look] .seg button{font-size:15.5px;padding:10px 12px}
:root[data-look] .chartseg button{font-size:14px;padding:8px}
:root[data-look] .searchbar input{padding:13px 16px}
:root[data-look] .crow{padding:13px 14px}
:root[data-look] .crow .nm{font-size:16.5px;font-weight:600}
:root[data-look] .crow .meta{font-size:13.5px}
:root[data-look] .prow .t{font-size:16px;font-weight:600}
:root[data-look] .prow .s{font-size:13.5px}
:root[data-look] .prow .a{font-size:16px}
:root[data-look] .ins p{font-size:15.5px}
:root[data-look] .ins .ie{width:38px;height:38px;font-size:19px}
:root[data-look] .tile small,:root[data-look] .tile span{font-size:13.5px}
:root[data-look] .tile b{font-size:24px}
:root[data-look] .list-item{font-size:16.5px}
:root[data-look] .list-item small{font-size:13.5px}
:root[data-look] .field>label{font-size:14.5px!important}
:root[data-look] .cd .n{font-size:14.5px}
:root[data-look] .cd .amt{font-size:11.5px}
:root[data-look] .dpill b{font-size:17px}
:root[data-look] .dpill small{font-size:11.5px}

/* stampa / PDF del report: solo il contenuto */
@media print{
  html,body{height:auto;overflow:visible;position:static;background:#fff;color:#000}
  body{display:block}
  header,nav,.sheet,.toast,.noprint{display:none!important}

}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  altro: '<circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/>'

const DEF_ICON = { casa: "casa", cibo: "posate", bollette: "fulmine", trasporti: "auto", svago: "gioco", shopping: "borsa", salute: "cuore", altro: "altro", stip: "banca", entrate: "entrata" };
/* cerchio colorato con icona (o iniziale, se la categoria non ha icona) */
const cbadge = (c, size = "") => `<span class="cb ${size}" style="background:${cvar(c.color)};color:${ink(c.color)}" aria-hidden="true">${ICONS[c.icon] ? `<svg viewBox="0 0 24 24">${ICONS[c.icon]}</svg>` : esc((c.name || "?").charAt(0).toUpperCase())}</span>`;
/* segno piccolo dentro i bottoni: icona colorata, o pallino */
const cmark = c => ICONS[c.icon] ? `<svg class="ci" viewBox="0 0 24 24" style="stroke:${cvar(c.color)}">${ICONS[c.icon]}</svg>` : `<span class="dot" style="background:${cvar(c.color)}"></span>`;
const ICON_CHEV = `<svg class="chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>`;
const ICON_X = `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>`;

/* ---------- dati ---------- */
/* macrocategorie con le loro sottocategorie: tutte rinominabili, eliminabili e ampliabili dall'app */
const DEF_OUT = [
  ["casa", "Casa", 0, ["Affitto o mutuo", "Condominio", "Manutenzione", "Arredamento"]],
  ["cibo", "Cibo", 2, ["Spesa settimanale", "Cena fuori", "Pranzo fuori", "Bar e caffè", "Pasti extra", "Cibo a domicilio"]],
  ["bollette", "Bollette", 3, ["Luce", "Gas", "Acqua", "Internet e telefono"]],
  ["trasporti", "Trasporti", 6, ["Carburante", "Mezzi pubblici", "Parcheggi e pedaggi", "Manutenzione auto", "Assicurazione e bollo"]],
  ["svago", "Svago", 4, ["Uscite", "Abbonamenti", "Giochi", "Viaggi", "Hobby"]],
  ["shopping", "Shopping", 7, ["Vestiti e scarpe", "Elettronica", "Regali", "Cura personale"]],
  ["salute", "Salute", 5, ["Farmacia", "Visite mediche", "Sport e palestra"]],
  ["altro", "Altro", -1, [], true]
];
const DEF_IN = [["stip", "Stipendio", 5, []], ["entrate", "Altre entrate", -1, ["Rimborsi", "Regali ricevuti", "Vendite"], true]];
const mkCat = type => ([id, name, color, subs, fb]) => ({ id, name, color, icon: DEF_ICON[id] || null, type, budget: null, fallback: !!fb, subs: subs.map((n, i) => ({ id: `${id}.${i}`, name: n })) });
const DEFAULT_CATS = DEF_OUT.map(mkCat("out")).concat(DEF_IN.map(mkCat("in")));

function fresh(){ return { v: 2, cats: structuredClone(DEFAULT_CATS), tx: [], opt: {} }; }
/* dalla prima versione (categorie senza sottocategorie): i movimenti passano nelle nuove macrocategorie */
function migrate(d){
  if (d.v >= 2){ d.cats.forEach(c => { if (!Array.isArray(c.subs)) c.subs = []; if (c.icon === undefined) c.icon = DEF_ICON[c.id] || null; }); return d; }
  const old = { c0: ["Casa", "casa"], c1: ["Spesa", "cibo", "cibo.0"], c2: ["Ristoranti e bar", "cibo"], c3: ["Trasporti", "trasporti"],
    c4: ["Bollette", "bollette"], c5: ["Svago", "svago"], c6: ["Shopping", "shopping"], c7: ["Salute", "salute"], c8: ["Altro", "altro"],
    i0: ["Stipendio", "stip"], i1: ["Altre entrate", "entrate"] };
  const cats = structuredClone(DEFAULT_CATS), map = {};
  for (const c of d.cats){
    const o = old[c.id];
    if (o && o[0] === c.name){
      const n = cats.find(x => x.id === o[1]); map[c.id] = [n.id, o[2] || null];
      if (c.budget) n.budget = (n.budget || 0) + c.budget;
    } else {
      const fb = cats.findIndex(x => x.fallback && x.type === c.type);
      cats.splice(fb < 0 ? cats.length : fb, 0, { ...c, fallback: false, subs: [], icon: null }); map[c.id] = [c.id, null];
    }
  }
  for (const t of d.tx){ const m = map[t.cat]; if (m){ t.cat = m[0]; t.sub = m[1]; } }
  return { ...d, v: 2, cats };
}
let D;
try { D = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { D = fresh(); }
if (!D.cats || !D.tx) D = fresh();
D.opt ||= {};
const wasV1 = !(D.v >= 2);
D = migrate(D);
function save(){ D.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(D)); } catch { toast("Spazio pieno: esporta un backup"); } if (typeof scheduleBackup === "function") scheduleBackup(); }
if (wasV1) save();
/* scontrini già salvati con gli sconti come righe a parte: li unisco all'articolo */
if (D.tx.some(t => t.items?.some(x => x.p < 0))){ D.tx.forEach(t => { if (t.items?.some(x => x.p < 0)) t.items = mergeDiscounts(t.items); }); try { localStorage.setItem(KEY, JSON.stringify(D)); } catch {} }
try { navigator.storage?.persist?.(); } catch {}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cat = id => D.cats.find(c => c.id === id) || D.cats.find(c => c.fallback) || { name: "?", color: -1 };
const sub = t => t.sub ? (cat(t.cat).subs || []).find(x => x.id === t.sub) || null : null;
const catLabel = t => { const s = sub(t); return cat(t.cat).name + (s ? " › " + s.name : ""); };
const cvar = c => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c) ? c : c >= 0 && c < 8 ? `var(--c${c + 1})` : "var(--cx)";
/* colori in più tra cui scegliere, oltre a quelli del tema */
const MORE_COLORS = ["#0ea5e9", "#06b6d4", "#14b8a6", "#22c55e", "#84cc16", "#facc15", "#f59e0b", "#f97316", "#ef4444", "#be123c",
  "#ec4899", "#d946ef", "#a855f7", "#6366f1", "#1e40af", "#0f766e", "#166534", "#92400e", "#a16207", "#64748b", "#334155", "#a8a29e"];
/* inchiostro dell'icona: scuro sui colori chiari scelti a mano, bianco altrimenti */
const ink = c => { if (typeof c !== "string") return "var(--on-c,#fff)"; const n = parseInt(c.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.68 ? "#1a1a19" : "#fff"; };

/* ---------- date e numeri ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0, 7);
const pdate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
const addMonth = (m, k) => { const d = pdate(m + "-01"); d.setMonth(d.getMonth() + k); return ymd(d).slice(0, 7); };
const daysIn = m => { const d = pdate(m + "-01"); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const mName = m => MESI[+m.slice(5) - 1];
const mLabel = m => mName(m) + " " + m.slice(0, 4);
const mShort = m => mName(m).slice(0, 3);
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const dLabel = s => { const d = pdate(s); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`; };
const dShort = s => { const d = pdate(s); return `${d.getDate()} ${MESI[d.getMonth()].slice(0, 3)}`; };
const nf = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
const nf0 = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const eur = c => nf.format(c / 100);
const eur0 = c => nf0.format(Math.round(c / 100));
const movs = n => `${n} moviment${n === 1 ? "o" : "i"}`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const parseAmt = s => { s = String(s).trim().replace(/\s|€/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const v = parseFloat(s); return isFinite(v) ? Math.round(v * 100) : NaN; };
const fmtInput = c => (c / 100).toFixed(2).replace(".", ",");

/* ---------- calcoli ---------- */
const txIn = (m, type) => D.tx.filter(t => t.date.startsWith(m) && (!type || t.type === type));
const sum = a => a.reduce((s, t) => s + t.amt, 0);
function byCat(list){
  const map = new Map();
  for (const t of list){ const c = cat(t.cat); const o = map.get(c.id) || { cat: c, amt: 0, n: 0, tx: [] }; o.amt += t.amt; o.n++; o.tx.push(t); map.set(c.id, o); }
  return [...map.values()].map(o => (o.subs = bySub(o.tx), o)).sort((a, b) => b.amt - a.amt);
}
/* movimenti di una macrocategoria, raggruppati per sottocategoria */
function bySub(list){
  const map = new Map();
  for (const t of list){ const s = sub(t), k = s ? s.id : "-"; const o = map.get(k) || { sub: s, key: k, name: s ? s.name : "Senza sottocategoria", amt: 0, n: 0 }; o.amt += t.amt; o.n++; map.set(k, o); }
  return [...map.values()].sort((a, b) => b.amt - a.amt);
}
const hasSubs = c => c.subs.some(s => s.sub);
/* tutte le sottocategorie del mese, in ordine di spesa */
const leaves = st => st.cats.flatMap(c => c.subs.filter(s => s.sub).map(s => ({ c: c.cat, s }))).sort((a, b) => b.s.amt - a.s.amt);
function monthStats(m){
  const out = txIn(m, "out"), inc = txIn(m, "in");
  return { m, out, inc, tot: sum(out), income: sum(inc), cats: byCat(out) };
}

const S = { rview: "month", tab: "vTx", month: thisMonth(), filter: "all", sf: null, q: "", edit: null, view: D.opt.txView === "cal" ? "cal" : "list", day: null };

/* ---------- grafici ---------- */
function donut(rows, total){
  // rows: [{label,color,amt,id}] già piegate a max 8 fette
  const R = 80, C = 2 * Math.PI * R, gap = rows.length > 1 ? 3 : 0;
  let off = 0;
  const segs = rows.map(r => {
    const len = total ? r.amt / total * C : 0;
    const vis = Math.max(len - gap, 1.5);
    const s = `<circle class="dseg" data-seg="${esc(r.id)}" cx="100" cy="100" r="${R}" fill="none" stroke="${r.color}" stroke-width="24"
      stroke-dasharray="${vis} ${C - vis}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(r.label)}: ${eur(r.amt)}</title></circle>`;
    off += len; return s;
  }).join("");
  return `<div class="donut" id="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Ripartizione delle spese per categoria">
    <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--raised)" stroke-width="24"/>${segs}
    <text x="100" y="94" text-anchor="middle" style="font:500 12px var(--font);fill:var(--muted)" id="dLbl">Totale spese</text>
    <text x="100" y="118" text-anchor="middle" class="num" style="font:700 21px var(--font);fill:var(--fg)" id="dVal">${eur0(total)}</text></svg></div>`;
}
function foldRows(cats, total){
  let rows = cats.map(c => ({ id: c.cat.id, label: c.cat.name, color: cvar(c.cat.color), amt: c.amt }));
  if (rows.length > 8){ const rest = rows.slice(7); rows = rows.slice(0, 7).concat({ id: "_rest", label: "Altre categorie", color: "var(--cx)", amt: rest.reduce((s, r) => s + r.amt, 0) }); }
  return rows;
}
/* barre verticali con estremità arrotondate (4px) appoggiate alla base, tocco = etichetta */
function bars(id, vals, opts = {}){
  const W = 340, H = opts.h || 130, top = 18, bottom = 20, n = vals.length;
  const max = Math.max(1, ...vals.map(v => v.v), opts.ref?.v || 0);
  const step = W / n, bw = Math.max(3, Math.min(opts.maxW || 26, step - 2));
  const ph = H - top - bottom;
  const path = (x, y, w, h) => { const r = Math.min(4, w / 2, h); return h <= 0 ? "" : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
  let g = `<line x1="0" x2="${W}" y1="${top + ph + .5}" y2="${top + ph + .5}" stroke="var(--line)"/>`;
  vals.forEach((v, i) => {
    const h = v.v / max * ph, x = i * step + (step - bw) / 2, y = top + ph - h;
    v._y = y; v._H = H;
    g += `<path class="b" data-i="${i}" d="${path(x, y, bw, h)}" fill="${v.color || "var(--accent)"}"/>`;
    if (v.lab) g += `<text x="${i * step + step / 2}" y="${H - 5}" text-anchor="middle">${esc(v.lab)}</text>`;
    if (v.top) g += `<text class="lbl num" x="${i * step + step / 2}" y="${y - 5}" text-anchor="middle">${esc(v.top)}</text>`;
  });
  if (opts.ref && opts.ref.v > 0){
    const y = Math.max(top, top + ph - opts.ref.v / max * ph);
    g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--danger)" stroke-dasharray="3 4" stroke-width="1"/>
      <text x="0" y="${y - 4}">${esc(opts.ref.label)}</text>`;
  }
  if (opts.avg){
    const y = top + ph - opts.avg / max * ph;
    g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
      <text x="${W}" y="${y - 4}" text-anchor="end">media ${eur0(opts.avg)}</text>`;
  }
  vals.forEach((v, i) => g += `<rect class="hit" data-i="${i}" x="${i * step}" y="0" width="${step}" height="${H}"/>`);
  CHARTS[id] = vals;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Grafico")}">${g}</svg></div>`;
}
const CHARTS = {};
/* grafico ad area morbido (mese corrente) con linea a puntini (mese prima) */
function area(id, cur, prev, labels, opts = {}){
  const W = innerWidth >= 900 ? 640 : 340, H = (opts.h || 150) * (innerWidth >= 900 ? 1.3 : 1), top = 12, bottom = 22, n = Math.max(cur.length, prev.length), ph = H - top - bottom;
  const max = Math.max(1, ...cur, ...prev);
  const X = i => n === 1 ? W / 2 : 6 + i * (W - 12) / (n - 1), Y = v => top + ph - v / max * ph;
  const smooth = pts => { if (!pts.length) return ""; let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++){ const [x0, y0] = pts[i - 1] || pts[i], [x1, y1] = pts[i], [x2, y2] = pts[i + 1], [x3, y3] = pts[i + 2] || pts[i + 1];
      const c1x = x1 + (x2 - x0) / 6, c2x = x2 - (x3 - x1) / 6, cl = y => Math.min(top + ph, Math.max(top, y));
      d += ` C${c1x.toFixed(1)},${cl(y1 + (y2 - y0) / 6).toFixed(1)} ${c2x.toFixed(1)},${cl(y2 - (y3 - y1) / 6).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`; }
    return d; };
  const pc = cur.map((v, i) => [X(i), Y(v)]), pp = prev.map((v, i) => [X(i), Y(v)]);
  const line = smooth(pc), base = top + ph, gid = id + "G";
  let g = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".55"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  g += `<line x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}" stroke="var(--line)"/>`;
  if (pc.length) g += `<path d="${line} L${pc[pc.length - 1][0]},${base} L${pc[0][0]},${base}Z" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  if (pp.length && prev.some(Boolean)) g += `<path d="${smooth(pp)}" fill="none" stroke="var(--hl,var(--muted))" stroke-width="2" stroke-dasharray="0 5" stroke-linecap="round"/>`;
  labels.forEach((l, i) => { if (l) g += `<text x="${X(i)}" y="${H - 5}" text-anchor="middle">${esc(l)}</text>`; });
  g += `<line class="guide" x1="0" x2="0" y1="${top}" y2="${base}"/><circle class="gdot" r="4.5" cx="0" cy="0"/>`;
  const step = (W - 12) / Math.max(1, n - 1);
  for (let i = 0; i < n; i++) g += `<rect class="hit" data-i="${i}" x="${X(i) - step / 2}" y="0" width="${step}" height="${H}"/>`;
  CHARTS[id] = Array.from({ length: n }, (_, i) => ({ v: cur[i] ?? null, extra: prev[i], tip: opts.tip(i), _y: cur[i] != null ? Y(cur[i]) : Y(prev[i] || 0), _H: H, _x: X(i) / W, extraLabel: opts.prevLabel, curLabel: opts.curLabel }));
  return `<div class="chart area" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Grafico")}">${g}</svg></div>`;
}
function chartTap(el, i){
  const vals = CHARTS[el.id]; if (!vals) return;
  document.querySelector(".tip")?.remove();
  const was = el.dataset.on === String(i);
  el.querySelectorAll(".b").forEach(b => b.classList.toggle("on", b.dataset.i === String(i)));
  if (was){ el.classList.remove("focus"); delete el.dataset.on; return; }
  el.classList.add("focus"); el.dataset.on = i;
  const v = vals[i], svg = el.querySelector("svg"), box = svg.getBoundingClientRect(), eb = el.getBoundingClientRect();
  const x = box.left + (v._x != null ? v._x : (i + .5) / vals.length) * box.width;
  const gl = el.querySelector(".guide"), gd = el.querySelector(".gdot");
  if (gl){ const vx = v._x * svg.viewBox.baseVal.width; gl.setAttribute("x1", vx); gl.setAttribute("x2", vx); gd.setAttribute("cx", vx); gd.setAttribute("cy", v._y); gd.style.display = v.v == null ? "none" : ""; }
  const y = box.top + (v._y / v._H) * box.height - 8;
  const tip = document.createElement("div");
  tip.className = "tip"; tip.innerHTML = `${esc(v.tip)}<b class="num">${v.v == null ? "–" : eur(v.v)}</b>${v.extra != null && v.extraLabel ? `<small>${esc(v.extraLabel)}: ${eur(v.extra)}</small>` : ""}`;
  tip.style.left = Math.min(Math.max(x, 64), innerWidth - 64) + "px";
  tip.style.top = Math.max(y, $("header").getBoundingClientRect().bottom + 52) + "px";
  document.body.appendChild(tip);
}
