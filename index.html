  save(); close(); render(); toast("Caricati " + tx.length + " movimenti di esempio");
}

/* ---------- backup automatico su GitHub ----------
   Il file spese.json va in un repository privato dell'utente, con un token che può scrivere solo lì.
   Ogni salvataggio è un commit: GitHub conserva la cronologia di tutte le versioni.
   Il token resta solo su questo telefono e non finisce mai nel backup. */
const GHK = "spese.gh", GH_FILE = "spese.json";
var GH = {}; try { GH = JSON.parse(localStorage.getItem(GHK)) || {}; } catch {}
const ghSave = () => { try { localStorage.setItem(GHK, JSON.stringify(GH)); } catch {} };
var ghReady = false, ghBusy = false, ghAgain = false, ghTimer = null;
const b64e = str => { const b = new TextEncoder().encode(str); let x = ""; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };
const b64d = str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g, "")), c => c.charCodeAt(0)));
function ghFetch(path, opt = {}){
  return fetch("https://api.github.com/repos/" + GH.repo + path, { cache: "no-store", ...opt,
    headers: { Authorization: "Bearer " + GH.token, Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.body ? { "Content-Type": "application/json" } : {}) } });
}
function ghMsg(e){
  if (e instanceof Response){
    if (e.status === 401) return "Il token non è valido o è scaduto";
    if (e.status === 403) return "Il token non ha il permesso di scrivere nel repository";
    if (e.status === 404) return "Repository non trovato: controlla il nome e i permessi del token";
    return "GitHub ha risposto con errore " + e.status;
  }
  return navigator.onLine ? "GitHub non raggiungibile, riprovo più tardi" : "Sei offline: il backup partirà appena torni online";
}
/* legge il backup remoto: { sha, data } oppure null se il file non c'è ancora */
async function ghRead(){
  const r = await ghFetch("/contents/" + GH_FILE + "?t=" + Date.now());
  if (r.status === 404) return null;
  if (!r.ok) throw r;
  const j = await r.json();
  let text = j.content ? b64d(j.content) : "";
  if (!text){ const rr = await ghFetch("/contents/" + GH_FILE + "?t=" + Date.now(), { raw: true }); if (!rr.ok) throw rr; text = await rr.text(); }
  return { sha: j.sha, data: JSON.parse(text) };
}
const snapshot = () => ({ app: "Spese", v: D.v, updated: D.updated || Date.now(), cats: D.cats, tx: D.tx, opt: { ...D.opt, theme: undefined } });
async function backupNow(manual){
  if (!GH.repo || !GH.token) return;
  if (ghBusy){ ghAgain = true; return; }
  clearTimeout(ghTimer); ghBusy = true; ghPaint("Backup in corso…");
  try {
    const snap = snapshot();
    const body = { message: "Backup " + new Date().toLocaleString("it-IT") + " · " + movs(snap.tx.length), content: b64e(JSON.stringify(snap)) };
    if (GH.sha) body.sha = GH.sha;
    let r = await ghFetch("/contents/" + GH_FILE, { method: "PUT", body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422){   // il file è cambiato altrove: prendo lo sha attuale e riprovo
      const cur = await ghFetch("/contents/" + GH_FILE + "?t=" + Date.now());
      if (cur.ok) body.sha = (await cur.json()).sha; else delete body.sha;
      r = await ghFetch("/contents/" + GH_FILE, { method: "PUT", body: JSON.stringify(body) });
    }
    if (!r.ok) throw r;
    GH.sha = (await r.json()).content.sha; GH.last = Date.now(); GH.synced = snap.updated; GH.err = null; ghSave();
    if (manual) toast("Backup salvato su GitHub");
  } catch (e) { GH.err = ghMsg(e); ghSave(); if (manual) toast(GH.err); }
  ghBusy = false; ghPaint();
  if (ghAgain){ ghAgain = false; scheduleBackup(); }
}
function scheduleBackup(){
  if (!GH || !GH.repo || !GH.token || !ghReady) return;
  clearTimeout(ghTimer); ghTimer = setTimeout(backupNow, 4000);
}
/* all'apertura: se nel backup c'è una versione più recente (salvata da un altro dispositivo) la propongo */
async function ghCheck(){
  if (!GH.repo || !GH.token) return;
  try {
    const rem = await ghRead(); GH.err = null;
    if (rem){
      GH.sha = rem.sha;
      const ru = rem.data.updated || 0, lu = D.updated || 0;
      if (ru > lu && ru !== GH.synced && Array.isArray(rem.data.tx)){
        const when = new Date(ru).toLocaleString("it-IT", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
        if (!D.tx.length || confirm(`Nel backup su GitHub c'è una versione più recente (${when}, ${movs(rem.data.tx.length)}).\nVuoi caricarla? I dati di questo telefono verranno sostituiti.`)){
          applyData(rem.data); D.updated = ru; GH.synced = ru; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch {}
          ghSave(); ghReady = true; render(); toast("Dati aggiornati dal backup"); ghPaint(); return;
        }
      }
    }
    ghReady = true; ghSave();
    if (!rem || (D.updated || 0) !== GH.synced) backupNow();
  } catch (e) {
    GH.err = ghMsg(e); ghSave();
    ghReady = !!GH.synced;   // offline: se questo telefono era già sincronizzato, i prossimi salvataggi partiranno comunque
  }
  ghPaint();
}
const ago = t => { if (!t) return "mai"; const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "adesso"; if (m < 60) return m + " min fa";
  const d = new Date(t); return (ymd(d) === today() ? "oggi" : dShort(ymd(d))) + " alle " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function ghBox(){
  if (GH.repo && GH.token) return `<div class="panel">
    <div class="ghstat${GH.err ? " err" : ""}" id="ghStat"><i></i><span>${ghBusy ? "Backup in corso…" : GH.err ? "Backup non riuscito" : "Backup attivo"}<small>${GH.err ? esc(GH.err) : "Ultimo backup: " + ago(GH.last)} · ${esc(GH.repo)}</small></span></div>
    <button class="list-item" data-act="ghNow" style="border-top:1px solid var(--line)"><span>Fai il backup adesso</span>${ICON_CHEV}</button>
    <button class="list-item" data-act="ghRestore"><span>Ripristina dal backup<small>sostituisce i dati di questo telefono</small></span>${ICON_CHEV}</button>
    <a class="list-item" href="https://github.com/${esc(GH.repo)}/commits" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span>Vedi le versioni precedenti<small>la cronologia su GitHub</small></span>${ICON_CHEV}</a>
    <button class="list-item danger" data-act="ghOff"><span>Scollega il backup</span></button></div>`;
  return `<div class="panel"><div class="ghform">
    <input type="text" id="ghRepo" placeholder="utente/repository, es. RxDaneel/spese-backup" value="${esc(GH.repo || "RxDaneel/spese-backup")}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input type="password" id="ghToken" placeholder="Token GitHub (github_pat_…)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" data-act="ghOn">Collega e fai il primo backup</button></div></div>
    <div class="help" style="padding:8px 4px 0">Una volta sola, da Safari:<ol>
      <li>Crea un repository <b>privato</b> chiamato <b>spese-backup</b> su <a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a>.</li>
      <li>Crea un token su <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>: in <i>Repository access</i> scegli <i>Only select repositories</i> → spese-backup; in <i>Permissions</i> → <i>Contents</i> scegli <i>Read and write</i>; come scadenza metti la più lunga possibile.</li>
      <li>Copia il token e incollalo qui sopra.</li></ol>
      Il token resta solo su questo telefono e può scrivere soltanto in quel repository.</div>`;
}
function ghPaint(msg){
  const box = $("#ghBox"); if (!box || !$("#sSet").classList.contains("open")) return;
  box.innerHTML = ghBox();
  if (msg){ const st = $("#ghStat span"); if (st) st.firstChild.textContent = msg; }
}
async function ghConnect(){
  const repo = $("#ghRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$|\/$/g, ""), token = $("#ghToken").value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast("Scrivi il repository come utente/nome"); return; }
  if (!token){ toast("Incolla il token"); $("#ghToken").focus(); return; }
  GH = { repo, token }; toast("Controllo il collegamento…");
  try {
    const r = await ghFetch(""); if (!r.ok) throw r;
    const info = await r.json();
    if (!info.permissions?.push) throw new Response(null, { status: 403 });
    if (!info.private && !confirm("Attenzione: questo repository è pubblico, chiunque potrebbe leggere le tue spese. Continuare lo stesso?")){ GH = {}; return; }
    ghSave(); ghReady = false;
    const rem = await ghRead();
    if (rem && Array.isArray(rem.data.tx) && rem.data.tx.length){
      GH.sha = rem.sha;
      if (confirm(`Nel repository c'è già un backup con ${movs(rem.data.tx.length)}.\nOK = carica quei dati su questo telefono\nAnnulla = sovrascrivilo con i dati di questo telefono`)){
        applyData(rem.data); GH.synced = D.updated; GH.last = Date.now(); ghReady = true; ghSave(); render(); ghPaint(); toast("Dati caricati dal backup"); return;
      }
    }
    ghReady = true; await backupNow(true);
  } catch (e) { const m = ghMsg(e); GH = {}; ghSave(); toast(m); }
  ghPaint();
}
async function ghRestore(){
  try {
    const rem = await ghRead();
    if (!rem){ toast("Nel repository non c'è ancora nessun backup"); return; }
    const when = new Date(rem.data.updated || 0).toLocaleString("it-IT", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    if (!confirm(`Ripristinare il backup del ${when} (${movs(rem.data.tx.length)})? I dati di questo telefono verranno sostituiti.`)) return;
    GH.sha = rem.sha; applyData(rem.data); GH.synced = D.updated; ghSave(); render(); ghPaint(); toast("Backup ripristinato");
  } catch (e) { toast(ghMsg(e)); }
}

let toastT;
function toast(msg, act, fn){
  document.querySelector(".toast")?.remove(); clearTimeout(toastT);
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${esc(msg)}</span>${act ? `<button>${esc(act)}</button>` : ""}`;

    case "csvMonth": return giveFile(`spese-${S.month}.csv`, csv(txIn(S.month)), "text/csv");

/* stessa regolazione dell'altezza di YTG: su iPhone la barra in basso arriva sempre fino al fondo */
function fitApp(){
  const root = document.documentElement, vv = window.visualViewport;
  const portrait = matchMedia("(orientation: portrait)").matches;
  const scr = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const typing = document.activeElement?.matches?.("input,textarea");
  let hgt = Math.max(innerHeight, vv ? Math.round(vv.height) : 0);
  if (standalone && !typing && scr > hgt && scr - hgt < 200) hgt = scr;
  root.style.setProperty("--appH", hgt + "px");
  /* iOS 26 (web app dalla schermata Home): l'area disegnabile finisce prima del fondo dello schermo,
     quindi la zona della barra di sistema è già fuori. In quel caso niente margine extra sotto la barra. */
  const vis = Math.round(Math.max(innerHeight, vv ? vv.height : 0));
  const cut = standalone && portrait && scr - vis > 20 && !typing;
  root.style.setProperty("--bot", cut ? "6px" : "env(safe-area-inset-bottom,0px)");
}
fitApp();
addEventListener("resize", fitApp);

/* aggiornamenti automatici come in YTG: se version.json indica una versione più nuova, ricarico la pagina */
async function checkUpdate(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    const slot = v + ":" + Math.floor(Date.now() / 300000);
    if (v && v !== BUILD && sessionStorage.getItem("spese.upd") !== slot){
      sessionStorage.setItem("spese.upd", slot);   // al massimo un tentativo ogni 5 minuti
      await fetch(location.pathname, { cache: "reload" }).catch(() => {});
      location.replace(location.pathname + "?v=" + v);
    }
  } catch {}
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
