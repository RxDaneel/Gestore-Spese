/* ---------- Home ---------- */
function statsCard(st){
  const m = S.month, dm = daysIn(m), td = today(), cur = m === thisMonth(), pm = addMonth(m, -1), pdm = daysIn(pm);
  const lastDay = cur ? +td.slice(8) : dm;
  // curve cumulative: quanto hai speso dall'inizio del mese fino a quel giorno, contro il mese prima
  const run = (list, n) => { let acc = 0; return Array.from({ length: n }, (_, i) => (acc += sum(list.filter(t => +t.date.slice(8) === i + 1)))); };
  const curV = run(st.out, lastDay), pout = txIn(pm, "out");
  const prevV = run(pout, Math.min(dm, pdm));
  const days = new Set(st.out.map(t => t.date));
  const pills = Array.from({ length: dm }, (_, i) => { const d = `${m}-${pad(i + 1)}`, wd = GIORNI[pdate(d).getDay()].slice(0, 3);
    return `<button class="dpill${d === (S.day || td) ? " on" : ""}${days.has(d) ? " has" : ""}${d > td ? " future" : ""}" data-goday="${d}" aria-label="${esc(dLabel(d))}"><b>${pad(i + 1)}</b><small>${wd}</small><i></i></button>`; }).join("");
  const labels = Array.from({ length: dm }, (_, i) => (i + 1) % 5 === 0 || i === 0 ? String(i + 1) : "");
  return `<div class="card2" style="margin-top:8px"><div class="shead"><h2>Spesa accumulata</h2><span class="help">giorno per giorno</span></div>
    <div class="dstrip" id="dstrip">${pills}</div>
    ${area("chHome", curV, prevV, labels, { h: 150, label: "Spesa accumulata nel mese, confrontata con il mese prima", tip: i => `Fino al ${dShort(`${m}-${pad(i + 1)}`)}`, curLabel: mName(m), prevLabel: `${mName(pm)} allo stesso giorno` })}
    <div class="alegend"><span><i></i>${mName(m)}</span>${prevV.some(Boolean) ? `<span><i class="dot"></i>${mName(pm)}</span>` : ""}</div></div>`;
}
function catCards(st){
  if (!st.cats.length) return "";
  const stack = `<div class="stack" role="img" aria-label="Ripartizione delle spese">${st.cats.map(c => `<i style="flex:${c.amt};background:${cvar(c.cat.color)}" title="${esc(c.cat.name)} ${eur(c.amt)}"></i>`).join("")}</div>`;
  return stack + `<div class="cgrid">${st.cats.map(c => {
    const b = c.cat.budget, over = b && c.amt > b, share = pct(c.amt, st.tot);
    const fill = b ? Math.min(20, Math.round(c.amt / b * 20)) : Math.max(1, Math.round(c.amt / st.tot * 20));
    const col = over ? "var(--danger)" : cvar(c.cat.color);
    const top = c.subs.find(x => x.sub);
    const foot = b ? (over ? `<div class="foot warn">! oltre il budget di ${eur0(c.amt - b)}</div>` : `<div class="foot">${pct(c.amt, b)}% del budget · restano ${eur0(b - c.amt)}</div>`)
      : `<div class="foot">${top ? esc(top.name) + " " + eur0(top.amt) : movs(c.n)}</div>`;
    return `<button class="ccard" data-cat="${c.cat.id}"><div class="top">${cbadge(c.cat, "sm")}<div><b>${esc(c.cat.name)}</b><small>${movs(c.n)}</small></div></div>
      <div class="amt"><b>${eur(c.amt)}</b><span>${share}%</span></div>
      <div class="dots20" aria-hidden="true">${Array.from({ length: 20 }, (_, k) => `<i${k < fill ? ` style="background:${col}"` : ""}></i>`).join("")}</div>${foot}</button>`;
  }).join("")}</div>`;
}
/* in cima ai Movimenti: avvisi e la card con il totale del mese */
function topCard(st){
  const cur = S.month === thisMonth();
  let banner = "";
  const pm = addMonth(thisMonth(), -1);
  if (D.opt.seenReport !== pm && txIn(pm).length)
    banner = `<button class="banner" data-act="openReport" data-m="${pm}"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>
      <div><b>Il report di ${mName(pm)} è pronto</b><small>Dove hai speso, cosa è cambiato, cosa tenere d'occhio</small></div>${ICON_CHEV.replace("chev", "chev\" style=\"stroke:currentColor")}</button>`;
  if (GH.repo && GH.err && (!GH.last || Date.now() - GH.last > 864e5))
    banner = `<button class="banner warn" data-act="settings"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div><b>Backup su GitHub non riuscito</b><small>${esc(GH.err)}</small></div></button>` + banner;
  if (!st.out.length && !st.inc.length) return { banner, hero: "" };
  // confronto: mese in corso contro gli stessi giorni del mese prima
  const prev = addMonth(S.month, -1);
  let cmp, prevTot;
  if (cur){ const dd = +today().slice(8); prevTot = sum(txIn(prev, "out").filter(t => +t.date.slice(8) <= dd)); cmp = `rispetto ai primi ${dd} giorni di ${mName(prev)}`; }
  else { prevTot = sum(txIn(prev, "out")); cmp = `rispetto a ${mName(prev)}`; }
  let delta = "";
  if (prevTot > 0){ const p = pct(st.tot - prevTot, prevTot); delta = `<div class="delta ${p > 0 ? "up" : "down"}"><i>${p > 0 ? "▲" : "▼"}</i>${Math.abs(p)}% ${p > 0 ? "in più" : "in meno"} ${cmp}</div>`; }
  const hero = `<div class="hero"><small>Spese di ${mName(S.month)}${cur ? " (finora)" : ""}</small><b class="num">${eur(st.tot)}</b>
    <div class="sub"><span>Entrate <b class="num">${eur(st.income)}</b></span><span>Saldo <b class="num">${st.income - st.tot >= 0 ? "+" : "−"}${eur(Math.abs(st.income - st.tot))}</b></span></div>${delta}</div>`;
  return { banner, hero };
}

/* ---------- Movimenti ---------- */
/* calendario del mese: per ogni giorno un pallino per categoria (dalla più costosa) e il totale speso */
function calendar(list){
  const m = S.month, dm = daysIn(m), lead = (pdate(m + "-01").getDay() + 6) % 7, td = today();
  const byDay = {}; for (const t of list) (byDay[t.date] ||= []).push(t);
  const outDays = Object.values(byDay).map(a => sum(a.filter(t => t.type === "out"))).filter(Boolean);
  const avg = outDays.length ? outDays.reduce((a, b) => a + b, 0) / outDays.length : 0;
  const short = c => { const e = Math.round(c / 100); return e >= 1000 ? (e / 1000).toFixed(1).replace(".", ",").replace(",0", "") + "k" : e + " €"; };
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span class="cd blank"></span>`;
  for (let d = 1; d <= dm; d++){
    const date = `${m}-${pad(d)}`, txs = byDay[date] || [], out = txs.filter(t => t.type === "out");
    const tot = sum(out), inc = sum(txs.filter(t => t.type === "in")), cats = byCat(out);
    const dots = cats.slice(0, cats.length > 6 ? 5 : 6).map(c => `<i style="background:${cvar(c.cat.color)}"></i>`).join("") + (cats.length > 6 ? "<b>+</b>" : "");
    const amt = tot ? `<span class="amt${tot > avg * 1.5 && outDays.length > 2 ? " hi" : ""}">${short(tot)}</span>` : inc ? `<span class="amt in">+${short(inc)}</span>` : "";
    const cls = ["cd", date === td ? "today" : "", txs.length ? "" : "none", date > td ? "future" : ""].filter(Boolean).join(" ");
    const lab = `${dLabel(date)}: ${tot ? "spesi " + eur(tot) + " in " + cats.map(c => c.cat.name).join(", ") : "nessuna spesa"}`;
    cells += `<button class="${cls}" data-day="${date}" aria-pressed="${S.day === date}" aria-label="${esc(lab)}"><span class="n">${d}</span><span class="dots">${dots}</span>${amt}</button>`;
  }
  const used = byCat(list.filter(t => t.type === "out")).map(c => c.cat);
  const legend = used.length ? `<div class="legend">${used.map(c => `<span><i style="background:${cvar(c.color)}"></i>${esc(c.name)}</span>`).join("")}</div>` : "";
  let detail = "";
  if (S.day){
    const txs = (byDay[S.day] || []).sort((a, b) => b.ts - a.ts), tot = sum(txs.filter(t => t.type === "out"));
    detail = `<div class="dayhead"><b>${dLabel(S.day)}</b><span class="num">${tot ? "−" + eur(tot) : txs.length ? "" : "nessuna spesa"}</span></div>
      ${txs.map(txRow).join("")}
      <div class="row-btns" style="margin-top:10px"><button class="btn ghost" data-act="addOn" data-day="${S.day}">+ Aggiungi in questo giorno</button></div>`;

    sc: items.reduce((s, x) => s + (x.p > 0 ? x.sc || 0 : 0), 0), nsc: items.filter(x => x.p > 0 && x.sc > 0).length };

const prodMonths = () => { const n = PPER[S.pper || "m"][1]; return Array.from({ length: n }, (_, i) => addMonth(S.month, i - n + 1)); };
const pct1 = (a, b) => b ? (a / b * 100).toFixed(1).replace(".", ",").replace(",0", "") : "0";

const receiptTx = months => { const set = new Set(months); return D.tx.filter(t => t.type === "out" && (t.items?.length || t.sc > 0) && set.has(t.date.slice(0, 7))); };
const scOf = list => list.reduce((s, t) => s + (t.sc || 0), 0);
/* quanto ti fanno risparmiare gli sconti: usa il totale e gli sconti che scrivi tu, non quelli letti dallo scontrino */
function saveCard(rtx, prtx, n){

        ${x.r && normRaw(x.r) !== normRaw(x.n) ? `<code class="rawc">${esc(x.r)}</code>` : ""}<div class="s">${x.cnt} ${x.cnt === 1 ? "volta" : "volte"} · ${eur(x.amt / x.cnt)} in media</div></div><div class="a">${eur(x.amt)}</div>${ICON_CHEV}</button>`).join("")}</div>`
      : `<p class="help">Nessun prodotto in questa categoria nel periodo.</p>`}

/* sposta un prodotto in un'altra categoria: in tutti gli scontrini, e da ora in poi */
function movePc(k, c){
  D.learn ||= {}; D.names ||= {}; let n = 0;
  for (const t of D.tx) if (t.items) for (const x of t.items) if (normName(x.n) === k){
    x.c = c; n++;
    for (const key of [normName(x.n), normName(x.r)]) if (key) D.learn[key] = c;
    const rk = normRaw(x.r); if (rk && D.names[rk]) D.names[rk].c = c;
  }
  D.learn[k] = c; save(); render();
  toast(`Spostato in ${pcat(c).e} ${pcat(c).n}${n > 1 ? ` (${n} acquisti)` : ""}`);
}

/* scheda di un prodotto: quante volte, quando, a che prezzo */
function openProd(k){ S.prod = k; drawProd(); open("#sProd"); }
function closeProd(){ $("#sProd").classList.remove("open"); }
function drawProd(){
  const k = S.prod, list = [];
  for (const t of D.tx) if (t.items) for (const x of t.items) if (x.p > 0 && normName(x.n) === k) list.push({ ...x, date: t.date, shop: t.note || "", tx: t.id });

  const first = list[list.length - 1], last = list[0], ch = list.length > 1 ? pct(last.p - first.p, first.p) : 0;
  const months = Array.from({ length: 6 }, (_, i) => addMonth(thisMonth(), i - 5));
  const vals = months.map(m => { const t = list.filter(x => x.date.startsWith(m)).reduce((s, x) => s + x.p, 0); return { v: t, lab: mShort(m), tip: mLabel(m), top: t ? eur0(t) : "", color: pc.col }; });

      ${list.length > 1 && Math.abs(ch) >= 3 ? `<span>dalla prima volta <b>${ch > 0 ? "▲ +" : "▼ −"}${Math.abs(ch)}%</b></span>` : ""}</div>
    <div class="section"><div class="shead"><h2>Spesa negli ultimi 6 mesi</h2></div><div class="panel">${bars("chProd", vals, { h: 130, maxW: 34, label: "Spesa per questo prodotto" })}</div>
      <div class="shead"><h2>Acquisti</h2></div><div class="panel">${list.slice(0, 40).map(x => `<div class="prow" style="cursor:default"><span class="em" style="font-size:13px;font-weight:600">${pdate(x.date).getDate()}</span><div class="mid"><div class="t">${dLabel(x.date)}</div><div class="s">${esc(x.shop || x.r || "")}</div></div><div class="a">${eur(x.p)}</div></div>`).join("")}</div></div>`;

/* ---------- Report annuale ---------- */
function renderYear(){
  const v = $("#vReport"), Y = S.month.slice(0, 4), PY = String(+Y - 1), cur = Y === thisMonth().slice(0, 4);
  const st = monthStats(Y), pst = monthStats(PY);
  if (!st.out.length && !st.inc.length){
    v.innerHTML = rToggle() + `<div class="empty"><h2>Nessun movimento nel ${Y}</h2><p>Con le frecce in alto puoi passare a un altro anno.</p></div>`; return;
  }
  const months = Array.from({ length: 12 }, (_, i) => `${Y}-${pad(i + 1)}`);
  const ms = months.map(m => { const o = sum(txIn(m, "out")), n = sum(txIn(m, "in")); return { m, out: o, inc: n }; });
  const lastIdx = cur ? +thisMonth().slice(5) - 1 : 11;
  const firstIdx = Math.max(0, ms.findIndex(x => x.out || x.inc));
  const span = Math.max(1, lastIdx - firstIdx + 1);
  const avg = st.tot / span, saved = st.income - st.tot;
  const live = ms.slice(firstIdx, cur ? lastIdx : lastIdx + 1).filter(x => x.out);   // il mese in corso non conta: è incompleto
  const hi = live.reduce((a, b) => b.out > (a?.out ?? -1) ? b : a, null), lo = live.reduce((a, b) => b.out < (a?.out ?? Infinity) ? b : a, null);

  // in breve
  const ins = [];
  if (pst.tot){
    // per un anno in corso confronto gli stessi mesi dell'anno prima
    const prevSame = cur ? sum(D.tx.filter(t => t.type === "out" && t.date.startsWith(PY) && +t.date.slice(5, 7) <= lastIdx + 1)) : pst.tot;
    if (prevSame){ const p = pct(st.tot - prevSame, prevSame); ins.push([p > 0 ? "📈" : "📉", p === 0 ? `Come ${cur ? "negli stessi mesi del" : "nel"} ${PY}` : `<b>${Math.abs(p)}% ${p > 0 ? "in più" : "in meno"}</b> rispetto ${cur ? "agli stessi mesi del" : "al"} ${PY} (${eur0(prevSame)})`]); }
  }
  if (cur && lastIdx < 11 && span >= 2) ins.push(["🔮", `A questo ritmo chiudi l'anno intorno a <b>${eur0(st.tot + avg * (11 - lastIdx))}</b>`]);
  if (hi && lo && hi !== lo) ins.push(["📅", `Mese più caro <b>${mName(hi.m)}</b> (${eur0(hi.out)}), più leggero ${mName(lo.m)} (${eur0(lo.out)})`]);
  if (st.cats[0]) ins.push(["🏷️", `La voce più grande è <b>${esc(st.cats[0].cat.name)}</b>: ${pct(st.cats[0].amt, st.tot)}%, circa ${eur0(st.cats[0].amt / span)} al mese`]);
  const big = st.out.length ? st.out.reduce((a, b) => b.amt > a.amt ? b : a) : null;
  if (big) ins.push(["🧾", `La spesa più alta: ${esc(big.note || catLabel(big))}, <b>${eur(big.amt)}</b> il ${dShort(big.date)}`]);

  // andamento di ogni categoria mese per mese
  const perCat = new Map(st.cats.map(c => [c.cat.id, Array(12).fill(0)]));
  st.out.forEach(t => { const a = perCat.get(cat(t.cat).id); if (a) a[+t.date.slice(5, 7) - 1] += t.amt; });
  const prevMap = new Map(pst.cats.map(c => [c.cat.id, c.amt]));
  const mvals = ms.map((x, i) => ({ v: x.out, lab: mShort(x.m), tip: mLabel(x.m), color: i > lastIdx ? "var(--line)" : "var(--accent)" }));

  v.innerHTML = rToggle() + `<div class="hero"><small>Spese del ${Y}${cur ? ` <span class="pill-status">in corso</span>` : ""}</small><b class="num">${eur0(st.tot)}</b>
      <div class="sub"><span>Entrate <b class="num">${eur0(st.income)}</b></span><span>Saldo <b class="num">${saved >= 0 ? "+" : "−"}${eur0(Math.abs(saved))}</b></span><span>Al mese <b class="num">${eur0(avg)}</b></span></div></div>
  <div class="section">
    ${ins.length ? `<div class="shead"><h2>In breve</h2></div>${insights(ins)}` : ""}

    <div class="shead"><h2>Mese per mese</h2><span class="help">tocca una barra</span></div>
    <div class="panel">${bars("chYear", mvals, { h: 150, maxW: 20, avg, label: "Spese di ogni mese dell'anno" })}</div>

    ${st.cats.length ? `<div class="shead"><h2>Dove hai speso</h2><span class="help">tocca per il dettaglio</span></div>
    <div class="panel">${st.cats.map(c => {
      const arr = perCat.get(c.cat.id), mx = Math.max(1, ...arr), p = prevMap.get(c.cat.id) || 0, d = c.amt - p;
      const dtxt = !pst.tot || cur ? "" : !p ? "nuova" : `${d >= 0 ? "▲ +" : "▼ −"}${eur0(Math.abs(d))} vs ${PY}`;
      return `<button class="crow" data-cat="${c.cat.id}">${cbadge(c.cat)}<div class="mid">
        <div class="nm"><span>${esc(c.cat.name)}</span><span class="num">${eur(c.amt)}</span></div>
        <div class="meta"><span>${pct(c.amt, st.tot)}% · ${eur0(c.amt / span)} al mese</span><span class="num">${dtxt}</span></div>
        <div class="spark" aria-label="Andamento mensile di ${esc(c.cat.name)}">${arr.map((x, i) => `<i class="${x ? "" : "z"}" title="${mName(months[i])}: ${eur(x)}" style="height:${x ? Math.max(8, x / mx * 100) : 0}%;background:${cvar(c.cat.color)}${i > lastIdx ? ";opacity:.3" : ""}"></i>`).join("")}</div>
      </div>${ICON_CHEV}</button>`;
    }).join("")}</div>` : ""}

    <div class="shead"><h2>Tabella dei mesi</h2><span class="help">tocca un mese</span></div>
    <div class="panel"><table class="mtab"><thead><tr><th>Mese</th><th>Spese</th><th>Entrate</th><th>Saldo</th></tr></thead><tbody>
      ${ms.map((x, i) => { const sd = x.inc - x.out, empty = !x.out && !x.inc; return `<tr${empty ? ' class="off"' : ` data-mrep="${x.m}"`}><td>${mName(x.m)}</td><td>${x.out ? eur0(x.out) : "–"}</td><td>${x.inc ? eur0(x.inc) : "–"}</td><td class="${empty ? "" : sd >= 0 ? "pos" : "neg"}">${empty ? "–" : (sd >= 0 ? "+" : "−") + eur0(Math.abs(sd))}</td></tr>`; }).join("")}
    </tbody><tfoot><tr><td>Totale</td><td>${eur0(st.tot)}</td><td>${eur0(st.income)}</td><td class="${saved >= 0 ? "pos" : "neg"}">${(saved >= 0 ? "+" : "−") + eur0(Math.abs(saved))}</td></tr></tfoot></table></div>

    <div class="row-btns noprint"><button class="btn ghost" data-act="print">Salva in PDF</button><button class="btn ghost" data-act="csvYear">Esporta CSV</button></div>
  </div>`;
}

function drawTx(){

      <p class="help" style="margin:6px 2px 0">Il totale degli sconti scritto in fondo allo scontrino («Totale sconti», «Hai risparmiato»). Serve per il report del risparmio.</p></div>` : ""}` : ""}
    ${e.id ? `<div class="field"><button class="btn danger wide" data-act="delTx">Elimina movimento</button></div>` : ""}

      k === "del" ? `<button data-k="del" aria-label="Cancella"><svg viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m12 9 5 6M17 9l-5 6"/></svg></button>`
      : k === "ok" ? `<button class="ok" data-k="ok">OK</button>` : `<button data-k="${k}"${k === "0" ? ' class="zero"' : ""}>${k}</button>`).join("")}</div>`;

/* tastierino: aggiorna l'importo scritto (al massimo 7 cifre intere e 2 decimali) */
function kpPress(k){
  let r = S.edit.raw || "";
  if (k === "del") r = r.slice(0, -1);
  else if (k === ","){ if (!r.includes(",")) r = (r || "0") + ","; }
  else {
    const [int, dec] = r.split(",");
    if (dec !== undefined){ if (dec.length >= 2) return; r += k; }
    else { if (int.length >= 7) return; r = (int === "0" ? "" : int) + k; }
  }
  S.edit.raw = r; sizeAmt();
}
function showKp(on){
  S.kp = on;
  if (on) document.activeElement?.blur?.();
  $("#kp")?.toggleAttribute("hidden", !on);
  document.querySelector("#sTx .caret")?.toggleAttribute("hidden", !on);
  $("#sTx").classList.toggle("kpon", on);
}
function newSubTx(){
  readTx(); const c = cat(S.edit.cat);
  const n = (prompt(`Nuova sottocategoria di ${c.name}`) || "").trim().slice(0, 40); if (!n) return;
  c.subs ||= [];
  let x = c.subs.find(y => y.name.toLowerCase() === n.toLowerCase());
  if (!x){ x = { id: uid(), name: n }; c.subs.push(x); save(); toast(`Sottocategoria "${n}" aggiunta a ${c.name}`); }
  S.edit.sub = x.id; drawTx(); sizeAmt();
}
function readTx(){
  readItems();
  const e = S.edit; e.amt = parseAmt(e.raw || ""); e.date = $("#txDate").value || today(); e.note = $("#txNote").value.trim();
  const sci = $("#txSc"); if (sci){ const v = parseAmt(sci.value); e.sc = v > 0 ? v : 0; }
}
function saveTx(){
  readTx(); const e = S.edit;
  if (!(e.amt > 0)){ toast("Scrivi un importo"); showKp(true); $("#sTx").scrollTop = 0; return; }
  if (!e.cat){ toast("Scegli una categoria"); return; }
  if (e.items){ e.items = e.items.filter(x => x.n && isFinite(x.p) && x.p !== 0); if (!e.items.length || e.type !== "out") delete e.items; else { learnItems(e.items); rememberNames(e.items); } }
  S.rc = null; delete e.rcTotal; if (!(e.sc > 0) || e.type !== "out") delete e.sc;
  if (e.id){ const i = D.tx.findIndex(t => t.id === e.id); D.tx[i] = { ...D.tx[i], ...e }; }
  else D.tx.push({ ...e, id: uid(), ts: Date.now() });
  save(); close();
  if (!e.id && e.date.slice(0, 7) !== S.month) S.month = e.date.slice(0, 7);
  toast(e.id ? "Movimento aggiornato" : `${e.type === "out" ? "Spesa" : "Entrata"} di ${eur(e.amt)} salvata`);
  render();
}
function delTx(){ const id = S.edit.id; close(); removeTx(id); }
function removeTx(id){
  const i = D.tx.findIndex(t => t.id === id); if (i < 0) return;
  const [gone] = D.tx.splice(i, 1); save();
  const refresh = () => { render(); if ($("#sCat").classList.contains("open") && S.cat?.id){ readCat(); drawCat(); } };
  refresh();
  toast(`Eliminato: ${gone.note || catLabel(gone)}`, "Annulla", () => { D.tx.push(gone); save(); refresh(); });
}
/* gesto: trascina a sinistra per scoprire Elimina; trascinando oltre metà riga elimina subito */
const OPEN_W = 96;
function setSwipe(tx, x, anim = true){ tx.parentElement?.classList.toggle("sw", !!x); tx.style.transition = anim ? "" : "none"; tx.style.transform = x ? `translateX(${x}px)` : ""; tx._x = x; }
function closeSwipes(except){ document.querySelectorAll(".swipe > .tx").forEach(t => { if (t !== except && t._x) setSwipe(t, 0); }); }
function swipeDelete(row){
  const tx = row.querySelector(".tx"), id = tx.dataset.tx;
  setSwipe(tx, -row.offsetWidth);
  row.style.height = row.offsetHeight + "px";
  requestAnimationFrame(() => { row.style.height = "0px"; row.style.opacity = "0"; });
  setTimeout(() => removeTx(id), 220);
}
let SW = null;
document.addEventListener("touchstart", e => {
  const tx = e.target.closest(".swipe > .tx");
  closeSwipes(tx || e.target.closest(".swipe")?.querySelector(".tx"));   // toccando "Elimina" la riga resta aperta
  if (!tx || e.touches.length > 1) { SW = null; return; }
  SW = { tx, row: tx.parentElement, x0: e.touches[0].clientX, y0: e.touches[0].clientY, base: tx._x || 0, x: tx._x || 0, mode: null };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!SW) return;
  const dx = e.touches[0].clientX - SW.x0, dy = e.touches[0].clientY - SW.y0;
  if (!SW.mode){ if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) SW.mode = "h"; else if (Math.abs(dy) > 8) { SW = null; return; } else return; }
  e.preventDefault();
  let x = Math.min(0, SW.base + dx);
  if (x > -OPEN_W) x = x; else x = -OPEN_W + (x + OPEN_W) * 0.9;   // un filo di resistenza oltre il pulsante
  SW.x = x; setSwipe(SW.tx, x, false);
}, { passive: false });
document.addEventListener("touchend", () => {
  if (!SW) return;
  const { tx, row, x, mode } = SW; SW = null;
  if (mode !== "h") return;
  tx._sw = Date.now();
  if (x < -row.offsetWidth * 0.55) swipeDelete(row);
  else setSwipe(tx, x < -OPEN_W / 2 ? -OPEN_W : 0);
});
document.addEventListener("touchcancel", () => { if (SW){ setSwipe(SW.tx, 0); SW = null; } });

/* ---------- riepilogo categoria (solo lettura) ---------- */
function openSum(id){ S.sum = id; drawSum(); open("#sSum"); }
function drawSum(){
  const c = D.cats.find(x => x.id === S.sum);
  if (!c){ $("#sSum").classList.remove("open"); return; }
  const tx = txIn(S.month).filter(t => t.cat === c.id).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const tot = sum(tx), all = sum(txIn(S.month, c.type)), pm = addMonth(S.month, -1);
  // per il mese in corso confronto con gli stessi giorni del mese prima
  const upTo = S.month === thisMonth() ? +today().slice(8) : 31;
  const prev = sum(txIn(pm).filter(t => t.cat === c.id && +t.date.slice(8) <= upTo));
  const word = c.type === "out" ? "Spese" : "Entrate";
  let delta = "";
  if (prev){ const d = tot - prev; delta = Math.abs(d) < 100 ? `<span>come a ${mName(pm)}</span>` : `<span><b>${d > 0 ? "▲ +" : "▼ −"}${eur0(Math.abs(d))}</b> rispetto a${upTo < 31 ? ` ${upTo} giorni di` : ""} ${mName(pm)}</span>`; }
  const b = c.budget, over = b && tot > b;
  const budget = b ? `<div class="sumbudget"><div class="meta" style="display:flex;justify-content:space-between;font-size:13px">
      <span>${over ? `<span class="warn">Budget superato di ${eur0(tot - b)}</span>` : `Restano <b>${eur0(b - tot)}</b> del budget`}</span><span class="num">${pct(tot, b)}% di ${eur0(b)}</span></div>
      <div class="bar budget${over ? " over" : ""}"><i style="width:${Math.min(100, pct(tot, b))}%"></i></div></div>` : "";

  const vals = months.map(m => { const t = sum(txIn(m).filter(x => x.cat === c.id)); return { v: t, lab: mShort(m), tip: mLabel(m), top: t ? eur0(t) : "", color: m === S.month ? cvar(c.color) : `color-mix(in srgb,${cvar(c.color)} 45%,transparent)` }; });
  const big = tx.length ? tx.reduce((a, x) => x.amt > a.amt ? x : a) : null;
  $("#sSum").innerHTML = `<div class="pbar"><button class="icon-btn" data-act="close" aria-label="Chiudi">${ICON_X}</button><h3>${esc(c.name)}</h3>
      <button class="icon-btn" data-act="editCat" data-id="${c.id}" aria-label="Modifica categoria"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button></div>
    <div class="sumhead">${cbadge(c, "lg")}<div><small>${word} di ${mLabel(S.month)}</small><b>${eur(tot)}</b></div></div>
    <div class="sumfacts"><span><b>${all ? pct(tot, all) : 0}%</b> delle ${word.toLowerCase()} del mese</span><span>${movs(tx.length)}</span>${tx.length ? `<span>media <b>${eur(tot / tx.length)}</b></span>` : ""}${delta}${big ? `<span>la più alta <b>${eur(big.amt)}</b></span>` : ""}</div>
    ${budget}

      <div class="shead"><h2>Ultimi 6 mesi</h2></div><div class="panel">${bars("chSum", vals, { h: 140, maxW: 34, label: "Andamento della categoria", ref: b ? { v: b, label: "budget " + eur0(b) } : null })}</div>

}

function readCat(){
  const c = S.cat; c.name = $("#catName").value.trim();
  document.querySelectorAll("[data-subname]").forEach(i => { const x = c.subs[+i.dataset.subname]; if (x) x.name = i.value.trim(); });
  const b = $("#catBudget"); c.budget = b && b.value.trim() ? parseAmt(b.value) : null; if (!(c.budget > 0)) c.budget = null;
}
function addSub(){
  readCat(); const inp = $("#newSub"), n = inp.value.trim();
  if (!n){ inp.focus(); return; }
  if (S.cat.subs.some(x => x.name.toLowerCase() === n.toLowerCase())){ toast("Questa sottocategoria esiste già"); return; }
  S.cat.subs.push({ id: uid(), name: n }); drawCat(); $("#newSub").focus();
}
function delSub(i){
  readCat(); const x = S.cat.subs[i]; if (!x) return;
  const n = S.cat.id ? D.tx.filter(t => t.cat === S.cat.id && t.sub === x.id).length : 0;
  if (n && !confirm(`Eliminare "${x.name}"?\nI suoi ${n} movimenti resteranno in ${S.cat.name} senza sottocategoria.`)) return;
  S.cat.subs.splice(i, 1); drawCat();
}
function saveCat(){
  readCat(); const c = S.cat;
  const pend = $("#newSub")?.value.trim();
  if (pend && !c.subs.some(x => x.name.toLowerCase() === pend.toLowerCase())) c.subs.push({ id: uid(), name: pend });
  if (!c.name){ toast("Dai un nome alla categoria"); $("#catName").focus(); return; }
  if (D.cats.some(x => x.id !== c.id && x.type === c.type && x.name.toLowerCase() === c.name.toLowerCase())){ toast("Esiste già una categoria con questo nome"); return; }
  const { from, ...clean } = c;
  clean.subs = c.subs.filter(x => x.name);
  if (c.id){ const i = D.cats.findIndex(x => x.id === c.id); D.cats[i] = { ...D.cats[i], ...clean }; }
  else { clean.id = uid(); const fb = D.cats.findIndex(x => x.fallback && x.type === c.type); D.cats.splice(fb < 0 ? D.cats.length : fb, 0, clean); }
  const keep = new Set(clean.subs.map(x => x.id));
  D.tx.forEach(t => { if (t.cat === clean.id && t.sub && !keep.has(t.sub)) t.sub = null; });
  save(); $("#sCat").classList.remove("open");
  if (from && S.edit){ readTxSafe(); S.edit.type = clean.type; S.edit.cat = clean.id; S.edit.sub = null; drawTx(); sizeAmt(); }
  toast(c.id ? "Categoria aggiornata" : "Categoria creata"); render();
}
function readTxSafe(){ if ($("#amt")) readTx(); }
function delCat(){
  const c = S.cat, n = D.tx.filter(t => t.cat === c.id).length, fb = D.cats.find(x => x.fallback && x.type === c.type);
  if (!confirm(`Eliminare "${c.name}"?${n ? `\nI suoi ${n} movimenti passeranno in "${fb.name}".` : ""}`)) return;
  D.tx.forEach(t => { if (t.cat === c.id){ t.cat = fb.id; t.sub = null; } });
  D.cats = D.cats.filter(x => x.id !== c.id); save(); close(); toast("Categoria eliminata"); render();
}

async function giveFile(name, text, type){
  const blob = new Blob([text], { type });
  try {
    const f = new File([blob], name, { type });
    if (navigator.canShare?.({ files: [f] })){ await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv(list){
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  return "﻿Data;Tipo;Categoria;Sottocategoria;Importo;Nota\n" + [...list].sort((a, b) => a.date.localeCompare(b.date))
    .map(t => [t.date, t.type === "out" ? "Spesa" : "Entrata", q(cat(t.cat).name), q(sub(t)?.name || ""), fmtInput(t.type === "out" ? -t.amt : t.amt), q(t.note || "")].join(";")).join("\n");
}
function applyData(d){ D = migrate({ v: d.v || 1, cats: d.cats, tx: d.tx, opt: { ...(d.opt || {}), theme: D.opt.theme } }); save(); }
function restore(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.cats) || !Array.isArray(d.tx)) throw 0;
      if (!confirm(`Ripristinare ${d.tx.length} movimenti e ${d.cats.length} categorie? I dati attuali verranno sostituiti.`)) return;
      applyData(d); close(); render(); toast("Backup ripristinato");
    } catch { toast("Questo file non è un backup valido"); }
  };
  r.readAsText(file);
}

function guessPc(name, raw, aiCat){
  D.learn ||= {};
  for (const k of [normName(name), normName(raw)]) if (k && D.learn[k]) return D.learn[k];
  if (aiCat && PCATS.some(x => x.id === aiCat)) return aiCat;
  const up = (raw + " " + name).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  for (const [id, re] of PC_RULES) if (re.test(up)) return id;

}
/* le righe di sconto (prezzo negativo) si sommano all'articolo sopra: resta solo quanto hai pagato davvero */
function mergeDiscounts(items){
  const out = [];
  for (const x of items){
    const isDisc = x.p < 0 || /^\s*(sconto|promo|ribasso)/i.test(x.n) && x.p <= 0;
    if (isDisc && out.length){ const prev = out[out.length - 1]; prev.p += x.p; prev.sc = (prev.sc || 0) - x.p; }
    else if (x.p > 0) out.push({ sc: 0, ...x });
  }
  return out.filter(x => x.p > 0);
}
/* memoria delle righe dello scontrino: "GRANCER M.BIANCO" → nome e categoria che hai confermato tu.
   Il testo stampato da un supermercato resta sempre uguale, quindi la volta dopo il prodotto è già riconosciuto. */
const normRaw = r => String(r || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\b\d+([.,]\d+)?\s*(G|GR|KG|ML|L|CL|PZ|X\d+)\b/g, " ").replace(/[^A-Z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const looksCryptic = r => /\./.test(r) || String(r).toUpperCase().split(/\s+/).some(w => /^[A-Z]{1,3}$/.test(w) && !["DI", "DA", "IN", "CON", "AL", "E", "LA", "IL", "BIO", "UHT", "DOP", "IGP", "MIX"].includes(w));
function applyKnown(items){
  D.names ||= {};
  for (const x of items){
    const k = normRaw(x.r), m = k && D.names[k];
    if (m){ x.n = m.n; x.c = m.c; x.ask = false; }
    else x.ask = x.ok === false;
    delete x.ok;
  }
  return items;
}
function rememberNames(items){
  D.names ||= {};
  for (const x of items){ const k = normRaw(x.r); if (k && x.n && !x.ask) D.names[k] = { n: x.n, c: x.c }; delete x.ask; delete x.guess; delete x.pcManual; }   // le domande senza risposta non si ricordano
  const keys = Object.keys(D.names); if (keys.length > 3000) keys.slice(0, keys.length - 3000).forEach(k => delete D.names[k]);
}
/* testo incollato (es. "Copia tutto" di Testo dal vivo) -> righe articolo/prezzo */
function parseReceiptText(txt){
  const SKIP = /TOTALE|SUBTOT|CONTANT|RESTO|\bIVA\b|CARTA|\bCARD\b|MASTERCARD|\bVISA\b|MAESTRO|AMEX|SATISPAY|PAGATO|BANCOMAT|PAGAMENT|DOCUMENTO|SCONTRINO|ARTICOLI|P\.? ?IVA|TEL\.?|CASSA|OPERATORE|GRAZIE|ARRIVEDERCI|PUNTI|SALDO|RESTO|IMPORTO|DI CUI|ELETTRON|COMMERCIALE|NUMERO|^\s*N\.? ?\d/i;
  const items = []; let total = null;
  for (let line of String(txt).split(/\r?\n/)){
    line = line.trim(); if (!line) continue;
    const m = line.match(/^(.*?)[\s€]+(-?\s?\d{1,4}[.,]\d{2})\s*(?:€|EUR)?\s*[A-Z%]{0,3}\s*$/i);
    if (/TOTALE/i.test(line) && m && total == null){ total = parseAmt(m[2].replace(/\s/g, "")); continue; }
    if (!m || SKIP.test(line)) continue;
    let name = m[1].replace(/\s+\d+([.,]\d+)?\s*%?\s*$/, "").replace(/[*#]+/g, " ").trim();
    let price = parseAmt(m[2].replace(/\s/g, ""));
    if (!name || !isFinite(price)) continue;
    if (price > 0 && /SCONTO|PROMO|RIBASSO/i.test(name)) price = -price;
    const raw = name, nice = name.toLowerCase().replace(/\b\w/, c => c.toUpperCase());
    const prev = items[items.length - 1];
    items.push({ n: nice, r: raw, p: price, c: price < 0 && prev ? prev.c : guessPc(nice, raw), ok: !looksCryptic(raw) });
  }
  return { items: applyKnown(mergeDiscounts(items)), total };
}

/* foto → strisce ad alta risoluzione dello scontrino:
   1) ritaglio sulla carta bianca (lo sfondo non serve), 2) taglio in strisce tra una riga e l'altra,
   così ogni striscia resta sotto i limiti dell'IA (2576 px per lato, ~3,6 MP) senza rimpicciolire il testo */
async function receiptTiles(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const W = img.naturalWidth, H = img.naturalHeight;
    // analisi su una copia piccola
    const sw = 300, sh = Math.max(1, Math.round(H * sw / W));
    const a = document.createElement("canvas"); a.width = sw; a.height = sh;
    const ag = a.getContext("2d", { willReadFrequently: true }); ag.drawImage(img, 0, 0, sw, sh);
    const px = ag.getImageData(0, 0, sw, sh).data;
    const white = new Uint8Array(sw * sh), ink = new Uint8Array(sw * sh);
    for (let k = 0; k < sw * sh; k++){
      const r = px[k * 4], g = px[k * 4 + 1], b = px[k * 4 + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (r + g + b) / 3;
      white[k] = l > 165 && mx - mn < 45 ? 1 : 0; ink[k] = l < 110 ? 1 : 0;
    }
    // colonne della carta: la fascia più ampia con molta "carta bianca"
    const col = Array.from({ length: sw }, (_, x) => { let c = 0; for (let y = 0; y < sh; y++) c += white[y * sw + x]; return c / sh; });
    let best = [0, sw - 1], bestSum = -1, st = -1, sum = 0;
    for (let x = 0; x <= sw; x++){
      if (x < sw && col[x] > 0.3){ if (st < 0){ st = x; sum = 0; } sum += col[x]; }
      else if (st >= 0){ if (sum > bestSum){ bestSum = sum; best = [st, x - 1]; } st = -1; }
    }
    let [x0, x1] = best;
    if (x1 - x0 < sw * 0.12){ x0 = 0; x1 = sw - 1; }
    const padX = Math.round((x1 - x0) * 0.04); x0 = Math.max(0, x0 - padX); x1 = Math.min(sw - 1, x1 + padX);
    // righe della carta dentro quelle colonne
    const rowW = y => { let c = 0; for (let x = x0; x <= x1; x++) c += white[y * sw + x]; return c / (x1 - x0 + 1); };
    let y0 = 0, y1 = sh - 1;
    while (y0 < sh - 1 && rowW(y0) < 0.25) y0++;
    while (y1 > y0 && rowW(y1) < 0.25) y1--;
    if (y1 - y0 < sh * 0.2){ y0 = 0; y1 = sh - 1; }
    y0 = Math.max(0, y0 - 3); y1 = Math.min(sh - 1, y1 + 3);
    const inkRow = y => { let c = 0; for (let x = x0; x <= x1; x++) c += ink[y * sw + x]; return c; };
    // ritaglio in coordinate della foto originale
    const f = W / sw, cx = Math.round(x0 * f), cw = Math.round((x1 - x0 + 1) * f), cy = Math.round(y0 * f), ch = Math.round((y1 - y0 + 1) * f);
    const MAXL = 2576, MAXP = 3.5e6;
    const kOf = (w, h) => Math.min(1, MAXL / Math.max(w, h), Math.sqrt(MAXP / (w * h)));
    // un'immagine sola se il testo resta abbastanza grande; altrimenti strisce (al massimo 4)
    let n = 1; while (n < 4 && kOf(cw, ch / n) < 0.6) n++;
    const ov = n > 1 ? Math.round(ch * 0.025) : 0;            // piccola sovrapposizione: nessuna riga va persa al taglio
    const cuts = [cy];
    for (let t = 1; t < n; t++){
      const target = (cy + ch * t / n) / f, span = Math.max(3, Math.round(ch / n / f * 0.12));
      let by = Math.round(target), bi = Infinity;
      for (let y = Math.round(target - span); y <= target + span; y++) if (y > y0 && y < y1){ const v = inkRow(y); if (v < bi){ bi = v; by = y; } }
      cuts.push(Math.round(by * f));
    }
    cuts.push(cy + ch);
    const out = [];
    for (let t = 0; t < n; t++){
      const ty = Math.max(cy, cuts[t] - (t ? ov : 0)), th = Math.min(cy + ch, cuts[t + 1] + (t < n - 1 ? ov : 0)) - ty;
      const k = Math.min(1, MAXL / Math.max(cw, th), Math.sqrt(MAXP / (cw * th)));
      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(cw * k)); c.height = Math.max(1, Math.round(th * k));
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, cx, ty, cw, th, 0, 0, c.width, c.height);
      out.push(c.toDataURL("image/jpeg", 0.9).split(",")[1]);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
function aiMsg(status, m){
  m = String(m || "");
  if (status === 401) return "La chiave API non è valida";
  if (/credit|balance|billing/i.test(m)) return "Credito API esaurito: ricarica nella Console di Anthropic";
  if (status === 429) return "Troppe richieste: riprova tra un minuto";
  if (status === 529 || status === 503) return "Il servizio è molto carico: riprova tra poco";
  if (status === 413) return "Foto troppo grande";
  return "Errore " + status + (m ? ": " + m : "");
}

  // immagini (stringhe base64 JPEG) oppure PDF (scontrino digitale scaricato dall'app del supermercato)

  content.push({ type: "text", text: (text ? "Testo dello scontrino:\n" + text + "\n\n" : "") + prompt });
  const tool = { name: "scontrino", description: "Registra il contenuto dello scontrino", input_schema: { type: "object", properties: {
    negozio: { type: "string" }, data: { type: "string", description: "data dello scontrino AAAA-MM-GG, vuota se non leggibile" }, totale: { type: "number" },
    articoli: { type: "array", items: { type: "object", properties: { nome: { type: "string" }, testo: { type: "string" }, prezzo: { type: "number", description: "importo pagato, già scontato" }, sconto: { type: "number" }, chiaro: { type: "boolean" }, categoria: { type: "string", enum: PCATS.map(x => x.id) } }, required: ["nome", "testo", "prezzo", "categoria", "chiaro"] } } }, required: ["articoli"] } };
  const j = await aiCall(content, { tools: [tool], model });
  const out = j.content?.find(c => c.type === "tool_use")?.input;
  if (!out || !Array.isArray(out.articoli)) throw new Error("Non sono riuscito a leggere lo scontrino");
  return {
    shop: out.negozio || "", date: /^\d{4}-\d{2}-\d{2}$/.test(out.data || "") ? out.data : "",
    total: isFinite(out.totale) ? Math.round(out.totale * 100) : null,
    items: applyKnown(mergeDiscounts(out.articoli.filter(a => a && a.nome && isFinite(a.prezzo)).map(a => ({ n: String(a.nome).trim(), r: String(a.testo || "").trim(), p: Math.round(a.prezzo * 100), sc: a.sconto > 0 ? Math.round(a.sconto * 100) : 0, ok: a.chiaro !== false, c: guessPc(a.nome, a.testo || "", a.categoria) }))))
  };
}

function applyReceipt(res, how){

async function readReceiptPhotos(files){
  if (!files.length) return;
  if (!AI.key){ toast("Per leggere le foto serve la chiave API: ⚙️ → Lettura scontrini. Intanto puoi incollare il testo."); return; }
  readTx(); S.rc = "wait"; drawTx();
  try {
    const imgs = [];
    for (const f of [...files].slice(0, 4)){
      if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)){
        if (f.size > 8e6) throw new Error("PDF troppo grande");
        const b64 = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = ko; r.readAsDataURL(f); });
        imgs.push({ pdf: b64 });
      } else imgs.push(...await receiptTiles(f));
    }
    applyReceipt(await aiReceiptSmart(imgs.slice(0, 10)), "con l'IA");
  } catch (err) { S.rc = null; S.rcMsg = null; drawTx(); toast(err.message || "Errore nella lettura"); }
}

}

/* incolla lo scontrino: prima provo a leggere gli appunti (iOS mostra "Incolla"), altrimenti apro lo spazio dove tenere premuto */
async function pasteReceipt(){
  readTx();
  try {
    if (!navigator.clipboard?.read) throw 0;
    const items = await navigator.clipboard.read(), files = [], types = [];
    for (const it of items){
      types.push(...it.types);
      const t = it.types.find(t => t === "application/pdf" || t.startsWith("image/"));
      if (t){ const b = await it.getType(t); files.push(new File([b], t === "application/pdf" ? "scontrino.pdf" : "scontrino." + t.split("/")[1], { type: t })); continue; }
      if (it.types.includes("text/plain")){ const txt = await (await it.getType("text/plain")).text(); if (txt.trim()) return readReceiptText(txt); }
    }
    if (files.length) return readReceiptPhotos(files);
    if (types.length){ S.rcTypes = types.join(", "); }
    throw 0;
  } catch {
    S.rc = "paste"; S.kp = false; drawTx(); setTimeout(() => { const z = $("#rcZone"); z?.focus(); z?.scrollIntoView({ block: "center" }); }, 60);
  }
}
document.addEventListener("paste", e => {
  if (!e.target.closest?.("#rcZone")) return;
  e.preventDefault();
  const dt = e.clipboardData, files = [...(dt?.files || [])];
  if (!files.length) for (const it of dt?.items || []) if (it.kind === "file"){ const f = it.getAsFile(); if (f) files.push(f); }
  const ok = files.filter(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name) || f.type.startsWith("image/"));
  if (ok.length) return readReceiptPhotos(ok);
  const txt = dt?.getData("text/plain") || "";
  if (txt.trim()) return readReceiptText(txt);
  const types = [...(dt?.types || [])].join(", ");
  toast(types ? `Negli appunti c'è qualcosa che non so leggere (${types}). Salva il PDF in File e usa "Foto o PDF".` : "Gli appunti sono vuoti: copia prima lo scontrino nell'app Coop");
});

function askSuggest(it){
  const toks = normRaw(it.r).toLowerCase().split(" ").filter(w => w.length >= 3 && !/^\d+$/.test(w));
  const names = new Set(); for (const v of Object.values(D.names || {})) names.add(v.n);
  for (const t of D.tx) if (t.items) for (const x of t.items) if (x.n && x.p > 0) names.add(x.n);
  const out = [];
  for (const n of names){ const ws = normName(n).split(" "); const sc = toks.filter(t => ws.some(w => w.startsWith(t))).length; if (sc) out.push([sc, n]); }
  return out.sort((a, b) => b[0] - a[0] || a[1].length - b[1].length).map(x => x[1]).filter(n => normName(n) !== normName(it.guess || it.n)).slice(0, 4);
}

/* ---------- backup automatico su GitHub ----------
   Il file spese.json va in un repository privato dell'utente, con un token che può scrivere solo lì.
   Ogni salvataggio è un commit: GitHub conserva la cronologia di tutte le versioni.
   Il token resta solo su questo telefono e non finisce mai nel backup. */
const GHK = "spese.gh", GH_FILE = "spese.json";
var GH = {}; try { GH = JSON.parse(localStorage.getItem(GHK)) || {}; } catch {}
const ghSave = () => { try { localStorage.setItem(GHK, JSON.stringify(GH)); } catch {} };
var ghReady = false, ghBusy = false, ghAgain = false, ghTimer = null;
const b64e = str => { const b = new TextEncoder().encode(str); let x = ""; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };
const b64d = str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g, "")), c => c.charCodeAt(0)));
function ghFetch(path, opt = {}){
  return fetch("https://api.github.com/repos/" + GH.repo + path, { cache: "no-store", ...opt,
    headers: { Authorization: "Bearer " + GH.token, Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.body ? { "Content-Type": "application/json" } : {}) } });
}
function ghMsg(e){
  if (e instanceof Response){
    if (e.status === 401) return "Il token non è valido o è scaduto";
    if (e.status === 403) return "Il token non ha il permesso di scrivere nel repository";
    if (e.status === 404) return "Repository non trovato: controlla il nome e i permessi del token";
    return "GitHub ha risposto con errore " + e.status;
  }
  return navigator.onLine ? "GitHub non raggiungibile, riprovo più tardi" : "Sei offline: il backup partirà appena torni online";
}
/* legge il backup remoto: { sha, data } oppure null se il file non c'è ancora */
async function ghRead(){
  const r = await ghFetch("/contents/" + GH_FILE + "?t=" + Date.now());
  if (r.status === 404) return null;
  if (!r.ok) throw r;
  const j = await r.json();
  let text = j.content ? b64d(j.content) : "";
  if (!text){ const rr = await ghFetch("/contents/" + GH_FILE + "?t=" + Date.now(), { raw: true }); if (!rr.ok) throw rr; text = await rr.text(); }
  return { sha: j.sha, data: JSON.parse(text) };
}
const snapshot = () => ({ app: "Spese", v: D.v, updated: D.updated || Date.now(), cats: D.cats, tx: D.tx, opt: { ...D.opt, theme: undefined } });
async function backupNow(manual){
  if (!GH.repo || !GH.token) return;
  if (ghBusy){ ghAgain = true; return; }
  clearTimeout(ghTimer); ghBusy = true; ghPaint("Backup in corso…");
  try {
    const snap = snapshot();
    const body = { message: "Backup " + new Date().toLocaleString("it-IT") + " · " + movs(snap.tx.length), content: b64e(JSON.stringify(snap)) };
    if (GH.sha) body.sha = GH.sha;
    let r = await ghFetch("/contents/" + GH_FILE, { method: "PUT", body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422){   // il file è cambiato altrove: prendo lo sha attuale e riprovo
      const cur = await ghFetch("/contents/" + GH_FILE + "?t=" + Date.now());
      if (cur.ok) body.sha = (await cur.json()).sha; else delete body.sha;
      r = await ghFetch("/contents/" + GH_FILE, { method: "PUT", body: JSON.stringify(body) });
    }
    if (!r.ok) throw r;
    GH.sha = (await r.json()).content.sha; GH.last = Date.now(); GH.synced = snap.updated; GH.err = null; ghSave();
    if (manual) toast("Backup salvato su GitHub");
  } catch (e) { GH.err = ghMsg(e); ghSave(); if (manual) toast(GH.err); }
  ghBusy = false; ghPaint();
  if (ghAgain){ ghAgain = false; scheduleBackup(); }
}
function scheduleBackup(){
  if (!GH || !GH.repo || !GH.token || !ghReady) return;
  clearTimeout(ghTimer); ghTimer = setTimeout(backupNow, 4000);
}
/* all'apertura: se nel backup c'è una versione più recente (salvata da un altro dispositivo) la propongo */
async function ghCheck(){
  if (!GH.repo || !GH.token) return;
  try {
    const rem = await ghRead(); GH.err = null;
    if (rem){
      GH.sha = rem.sha;
      const ru = rem.data.updated || 0, lu = D.updated || 0;
      if (ru > lu && ru !== GH.synced && Array.isArray(rem.data.tx)){
        const when = new Date(ru).toLocaleString("it-IT", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
        if (!D.tx.length || confirm(`Nel backup su GitHub c'è una versione più recente (${when}, ${movs(rem.data.tx.length)}).\nVuoi caricarla? I dati di questo telefono verranno sostituiti.`)){
          applyData(rem.data); D.updated = ru; GH.synced = ru; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch {}
          ghSave(); ghReady = true; render(); toast("Dati aggiornati dal backup"); ghPaint(); return;
        }
      }
    }
    ghReady = true; ghSave();
    if (!rem || (D.updated || 0) !== GH.synced) backupNow();
  } catch (e) {
    GH.err = ghMsg(e); ghSave();
    ghReady = !!GH.synced;   // offline: se questo telefono era già sincronizzato, i prossimi salvataggi partiranno comunque
  }
  ghPaint();
}
const ago = t => { if (!t) return "mai"; const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "adesso"; if (m < 60) return m + " min fa";
  const d = new Date(t); return (ymd(d) === today() ? "oggi" : dShort(ymd(d))) + " alle " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function ghBox(){
  if (GH.repo && GH.token) return `<div class="panel">
    <div class="ghstat${GH.err ? " err" : ""}" id="ghStat"><i></i><span>${ghBusy ? "Backup in corso…" : GH.err ? "Backup non riuscito" : "Backup attivo"}<small>${GH.err ? esc(GH.err) : "Ultimo backup: " + ago(GH.last)} · ${esc(GH.repo)}</small></span></div>
    <button class="list-item" data-act="ghNow" style="border-top:1px solid var(--line)"><span>Fai il backup adesso</span>${ICON_CHEV}</button>
    <button class="list-item" data-act="ghRestore"><span>Ripristina dal backup<small>sostituisce i dati di questo telefono</small></span>${ICON_CHEV}</button>

    <button class="list-item danger" data-act="ghOff"><span>Scollega il backup</span></button></div>`;
  return `<div class="panel"><div class="ghform">
    <input type="text" id="ghRepo" placeholder="utente/repository, es. RxDaneel/spese-backup" value="${esc(GH.repo || "RxDaneel/spese-backup")}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input type="password" id="ghToken" placeholder="Token GitHub (github_pat_…)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" data-act="ghOn">Collega e fai il primo backup</button></div></div>
    <div class="help" style="padding:8px 4px 0">Una volta sola, da Safari:<ol>
      <li>Crea un repository <b>privato</b> chiamato <b>spese-backup</b> su <a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a>.</li>
      <li>Crea un token su <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>: in <i>Repository access</i> scegli <i>Only select repositories</i> → spese-backup; in <i>Permissions</i> → <i>Contents</i> scegli <i>Read and write</i>; come scadenza metti la più lunga possibile.</li>
      <li>Copia il token e incollalo qui sopra.</li></ol>
      Il token resta solo su questo telefono e può scrivere soltanto in quel repository.</div>`;
}
function ghPaint(msg){
  const box = $("#ghBox"); if (!box || !$("#sSet").classList.contains("open")) return;
  box.innerHTML = ghBox();
  if (msg){ const st = $("#ghStat span"); if (st) st.firstChild.textContent = msg; }

async function ghConnect(){
  const repo = $("#ghRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$|\/$/g, ""), token = $("#ghToken").value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast("Scrivi il repository come utente/nome"); return; }
  if (!token){ toast("Incolla il token"); $("#ghToken").focus(); return; }
  GH = { repo, token }; toast("Controllo il collegamento…");
  try {
    const r = await ghFetch(""); if (!r.ok) throw r;
    const info = await r.json();
    if (!info.permissions?.push) throw new Response(null, { status: 403 });
    if (!info.private && !confirm("Attenzione: questo repository è pubblico, chiunque potrebbe leggere le tue spese. Continuare lo stesso?")){ GH = {}; return; }
    ghSave(); ghReady = false;
    const rem = await ghRead();
    if (rem && Array.isArray(rem.data.tx) && rem.data.tx.length){
      GH.sha = rem.sha;
      if (confirm(`Nel repository c'è già un backup con ${movs(rem.data.tx.length)}.\nOK = carica quei dati su questo telefono\nAnnulla = sovrascrivilo con i dati di questo telefono`)){
        applyData(rem.data); GH.synced = D.updated; GH.last = Date.now(); ghReady = true; ghSave(); render(); ghPaint(); toast("Dati caricati dal backup"); return;
      }
    }
    ghReady = true; await backupNow(true);
  } catch (e) { const m = ghMsg(e); GH = {}; ghSave(); toast(m); }
  ghPaint();
}
async function ghRestore(){
  try {
    const rem = await ghRead();
    if (!rem){ toast("Nel repository non c'è ancora nessun backup"); return; }
    const when = new Date(rem.data.updated || 0).toLocaleString("it-IT", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    if (!confirm(`Ripristinare il backup del ${when} (${movs(rem.data.tx.length)})? I dati di questo telefono verranno sostituiti.`)) return;
    GH.sha = rem.sha; applyData(rem.data); GH.synced = D.updated; ghSave(); render(); ghPaint(); toast("Backup ripristinato");
  } catch (e) { toast(ghMsg(e)); }
}

    case "saveTx": return saveTx();
    case "delTx": return delTx();
    case "newCat": if (S.edit) readTxSafe(); return openCat(null, d.type);
    case "saveCat": return saveCat();
    case "addSub": return addSub();
    case "newSubTx": return newSubTx();
    case "delCat": return delCat();
    case "openReport": S.month = d.m; S.rview = "month"; return go("vReport");
    case "print": return window.print();
    case "csvYear": return giveFile(`spese-${S.month.slice(0, 4)}.csv`, csv(txIn(S.month.slice(0, 4))), "text/csv");
    case "csvMonth": return giveFile(`spese-${S.month}.csv`, csv(txIn(S.month)), "text/csv");
    case "csvAll": return giveFile(`spese-tutto.csv`, csv(D.tx), "text/csv");
    case "backup": return giveFile(`spese-backup-${today()}.json`, JSON.stringify(D), "application/json");
    case "restore": return $("#fileIn").click();
    case "demo": return demo();
    case "wipe":
      if (!confirm("Cancellare tutti i movimenti? Le categorie restano. Non si può annullare.")) return;
      D.tx = []; save(); close(); render(); return toast("Movimenti cancellati");
  }
});
document.addEventListener("pointerdown", e => {
  const s = e.target.closest(".donut .dseg");
  const dn = $("#donut"); if (!dn) return;
  if (!s){ if (!e.target.closest(".donut")) return; }
  dn.classList.toggle("focus", !!s);
  dn.querySelectorAll(".dseg").forEach(x => x.classList.toggle("on", x === s));
  if (s){
    const st = monthStats(S.month), r = foldRows(st.cats, st.tot).find(x => x.id === s.dataset.seg);
    $("#dLbl").textContent = r.label.length > 20 ? r.label.slice(0, 19) + "…" : r.label; $("#dVal").textContent = eur0(r.amt) + " · " + pct(r.amt, st.tot) + "%";
    $("#dVal").style.fontSize = "17px";
  } else { $("#dLbl").textContent = "Totale spese"; $("#dVal").textContent = eur0(monthStats(S.month).tot); $("#dVal").style.fontSize = ""; }
});
function sizeAmt(){ const a = $("#amt"); if (!a || !S.edit) return; const r = S.edit.raw || ""; a.textContent = r || "0,00"; a.classList.toggle("ph", !r); a.classList.toggle("long", r.length > 8); }
document.addEventListener("input", e => {
  if (e.target.id === "catName"){ const b = $("#catPrev b"); if (b) b.textContent = e.target.value.trim() || "Nuova categoria"; const x = $("#catPrev .cb"); if (x && !ICONS[S.cat.icon]){ S.cat.name = e.target.value; x.outerHTML = cbadge(S.cat, "lg"); } }
  if (e.target.id === "amt") sizeAmt();
  if (e.target.id === "q"){ S.q = e.target.value; const pos = e.target.selectionStart; renderTx(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.closest("#sTx") && e.target.matches("input")){ e.preventDefault(); saveTx(); }
  if (e.key === "Enter" && e.target.id === "newSub"){ e.preventDefault(); addSub(); return; }
  if (e.key === "Enter" && e.target.closest("#sCat") && e.target.matches("input")){ e.preventDefault(); saveCat(); }
  if (e.key === "Escape") close();
  // da tastiera fisica, quando il tastierino è aperto
  if (S.kp && $("#sTx").classList.contains("open") && !e.target.matches("input,textarea")){
    const k = e.key === "." ? "," : e.key;
    if (/^[0-9,]$/.test(k)){ e.preventDefault(); kpPress(k); }
    else if (k === "Backspace"){ e.preventDefault(); kpPress("del"); }
    else if (k === "Enter"){ e.preventDefault(); showKp(false); }
  }
});
const dropTip = () => { document.querySelector(".tip")?.remove(); document.querySelectorAll(".chart.focus").forEach(c => { c.classList.remove("focus"); delete c.dataset.on; }); };
$("#main").addEventListener("scroll", dropTip, { passive: true });
document.addEventListener("scroll", dropTip, { capture: true, passive: true });
document.addEventListener("change", e => { if (e.target.id === "rcFile"){ readReceiptPhotos(e.target.files); return; } if (e.target.id === "ownColor"){ readCat(); S.cat.color = e.target.value.toLowerCase(); drawCat(); } });
$("#fileIn").addEventListener("change", e => { if (e.target.files[0]) restore(e.target.files[0]); e.target.value = ""; });
const yStep = () => S.tab === "vReport" && S.rview === "year" ? 12 : 1;
$("#btnPrev").onclick = () => { S.month = addMonth(S.month, -yStep()); render(); };
$("#btnNext").onclick = () => { if (S.month < thisMonth()){ const m = addMonth(S.month, yStep()); S.month = m > thisMonth() ? thisMonth() : m; render(); } };
/* toccando il mese in alto si apre il calendario di quel mese */
$("#hMonth").onclick = () => { S.view = "cal"; D.opt.txView = "cal"; save(); if (!S.day || !S.day.startsWith(S.month)) S.day = S.month === thisMonth() ? today() : null; S.rview = "month"; go("vTx"); };
$("#btnGear").onclick = openSettings;

/* stessa regolazione dell'altezza di YTG: su iPhone la barra in basso arriva sempre fino al fondo */
function fitApp(){
  const root = document.documentElement, vv = window.visualViewport;
  const portrait = matchMedia("(orientation: portrait)").matches;
  const scr = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const typing = document.activeElement?.matches?.("input,textarea");
  let hgt = Math.max(innerHeight, vv ? Math.round(vv.height) : 0);
  if (standalone && !typing && scr > hgt && scr - hgt < 200) hgt = scr;
  root.style.setProperty("--appH", hgt + "px");
  /* iOS 26 (web app dalla schermata Home): l'area disegnabile finisce prima del fondo dello schermo,
     quindi la zona della barra di sistema è già fuori. In quel caso niente margine extra sotto la barra. */
  const vis = Math.round(Math.max(innerHeight, vv ? vv.height : 0));
  // il difetto c'è solo se la pagina parte sotto la barra di stato trasparente (margine in alto > 0) ma è alta come se non lo facesse
  const probe = document.getElementById("sai") || Object.assign(document.body.appendChild(document.createElement("div")), { id: "sai" });
  probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none";
  const topInset = probe.offsetHeight;
  const cut = standalone && portrait && topInset > 0 && scr - vis > 20 && !typing;
  root.style.setProperty("--bot", cut ? "6px" : "env(safe-area-inset-bottom,0px)");
}
fitApp();
addEventListener("resize", fitApp);
addEventListener("orientationchange", () => setTimeout(fitApp, 300));
window.visualViewport?.addEventListener("resize", fitApp);
document.addEventListener("focusin", e => { if (S.kp && e.target.closest?.("#sTx") && e.target.matches("input")) showKp(false); setTimeout(fitApp, 300); });
document.addEventListener("focusout", () => setTimeout(fitApp, 300));
/* se l'app resta aperta a cavallo di mezzanotte o del cambio mese */
document.addEventListener("visibilitychange", () => { if (!document.hidden){ setTimeout(fitApp, 100); render(); } });

if (!THEMES[D.opt.theme]) D.opt.theme = "verde";   // i temi tolti passano al nuovo tema verde
applyTheme(D.opt.theme);
delete D.opt.look; applyLook();
render();

/* aggiornamenti automatici come in YTG: se version.json indica una versione più nuova, ricarico la pagina */
async function checkUpdate(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    const slot = v + ":" + Math.floor(Date.now() / 300000);
    if (v && v !== BUILD && sessionStorage.getItem("spese.upd") !== slot){
      sessionStorage.setItem("spese.upd", slot);   // al massimo un tentativo ogni 5 minuti
      await fetch(location.pathname, { cache: "reload" }).catch(() => {});
      location.replace(location.pathname + "?v=" + v);
    }
  } catch {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
ghCheck();
