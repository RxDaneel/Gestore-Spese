<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spese</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="theme-color" content="#1a1a19">
<script>try{var t=localStorage.getItem("spese.theme");document.documentElement.dataset.theme=t||"viola";}catch(e){document.documentElement.dataset.theme="viola";}</script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=1">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Stessa base di YTG: barra in alto, contenuto che scorre, tab bar al fondo. Stessi temi, stesso font. */
:root{
  --bg:#f3f1ea; --surface:#e9e6dc; --raised:#dfdbcf; --line:#d6d1c4;
  --fg:#141413; --muted:#65635c; --accent:#3b3b38; --on-accent:#f5f4ef; --danger:#c43c3c; --good:#2f7d32;
  --font:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --nav-h:58px;
  /* colori delle categorie (palette verificata per daltonismo, nell'ordine fisso) */
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--cx:#9c9a92;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1a19; --surface:#242422; --raised:#2e2e2b; --line:#353532;
  --fg:#f5f4ef; --muted:#9c9a92; --accent:#d9d7d1; --on-accent:#1a1a19; --danger:#e06060; --good:#5cb860;
  color-scheme:dark;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--cx:#6f6d66;
}}
:root[data-theme="viola"]{--bg:#0b0b0f;--surface:#17161d;--raised:#24222d;--line:#2a2833;--fg:#f5f3fa;--muted:#8e8a9c;--accent:#a78bfa;--on-accent:#150f26;
  --danger:#f87171;--good:#4ade80;--hl:#facc15;--sel:#e9ddff;--on-sel:#1b1230;
  --grad:linear-gradient(135deg,#6d28d9 0%,#a855f7 42%,#e879f9 70%,#fb923c 100%);
  --font:"Plus Jakarta Sans",Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark;
  --c1:#60a5fa;--c2:#fb923c;--c3:#34d399;--c4:#facc15;--c5:#f472b6;--c6:#4ade80;--c7:#a78bfa;--c8:#f87171;--cx:#7c7889}
:root[data-theme="viola"] .panel,:root[data-theme="viola"] .tile,:root[data-theme="viola"] .card2{border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
:root[data-theme="viola"] header,:root[data-theme="viola"] nav{border-color:transparent}
:root[data-theme="viola"] .logo{color:var(--accent)}
:root[data-theme="viola"] .seg{background:none}
:root[data-theme="viola"] .seg button{background:var(--surface);color:var(--muted)}
:root[data-theme="viola"] .seg button[aria-pressed="true"],:root[data-theme="viola"] .chip[aria-pressed="true"],:root[data-theme="viola"] .catgrid.subs .chip[aria-pressed="true"],
:root[data-theme="viola"] .chips.sub .chip[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
:root[data-theme="viola"] .chip{background:var(--surface)}
:root[data-theme="viola"] .btn{border-radius:14px}
:root[data-theme="viola"] .btn:not(.ghost):not(.danger){background:var(--accent);color:var(--on-accent)}
:root[data-theme="viola"] .cd.today .n{background:var(--sel);color:var(--on-sel)}
:root[data-theme="viola"] .cd[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
:root[data-theme="viola"] nav button[aria-current="true"]{color:var(--fg)}
:root[data-theme="viola"] nav button[aria-current="true"] svg{stroke:#d8c8ff;background:rgba(167,139,250,.2);border-radius:999px;padding:3px 14px;box-sizing:content-box;margin:-3px 0}
:root[data-theme="viola"] nav .plus svg{background:var(--grad);border-radius:50%;stroke:#fff;padding:5px;width:30px;height:30px;stroke-width:1.8}
:root[data-theme="viola"] nav .plus svg circle{stroke:none}
:root[data-theme="viola"] .hero{margin:14px 16px 4px;padding:20px 20px 18px;border-radius:26px;background:var(--grad);color:#fff;position:relative;overflow:hidden}
:root[data-theme="viola"] .hero::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
:root[data-theme="viola"] .hero small,:root[data-theme="viola"] .hero .sub,:root[data-theme="viola"] .hero .delta{color:rgba(255,255,255,.82)}
:root[data-theme="viola"] .hero .sub span b{color:#fff}
:root[data-theme="viola"] .hero .delta i{color:#fff}
:root[data-theme="viola"] .hero .pill-status{background:rgba(255,255,255,.22);color:#fff}
:root[data-theme="viola"] .banner{border-radius:20px;background:var(--raised);color:var(--fg)}
:root[data-theme="viola"] .banner svg{stroke:var(--accent)}
:root[data-theme="viola"] .banner.warn{background:var(--danger);color:#fff}
:root[data-theme="viola"] .banner.warn svg{stroke:#fff}
:root[data-theme="viola"] .kp .ok{background:var(--grad);color:#fff}
:root[data-theme="grafite"]{--bg:#1a1a19;--surface:#242422;--raised:#2e2e2b;--line:#353532;--fg:#f5f4ef;--muted:#9c9a92;--accent:#d9d7d1;--on-accent:#1a1a19;--danger:#e06060;--good:#5cb860;color-scheme:dark}
:root[data-theme="carta"]{--bg:#f3f1ea;--surface:#e9e6dc;--raised:#dfdbcf;--line:#d6d1c4;--fg:#141413;--muted:#65635c;--accent:#3b3b38;--on-accent:#f5f4ef;--danger:#c43c3c;--good:#2f7d32;color-scheme:light;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--cx:#9c9a92}
:root[data-theme="oled"]{--bg:#000000;--surface:#0e0e0e;--raised:#1a1a1a;--line:#232323;--fg:#f2f2f2;--muted:#8c8c8c;--accent:#e6e6e6;--on-accent:#000000;--danger:#e06060;--good:#5cb860;color-scheme:dark}
:root[data-theme="neon"]{--bg:#12062a;--surface:#1e0c42;--raised:#2b1260;--line:#3e1a85;--fg:#fdf0ff;--muted:#b896e0;--accent:#ff2bd6;--on-accent:#12062a;--danger:#ffcc00;--good:#00f0ff;color-scheme:dark}
:root[data-theme="neon"] body{background:radial-gradient(130% 70% at 50% -10%,#4a1490 0%,#12062a 55%) fixed,#12062a}
:root[data-theme="neon"] main,:root[data-theme="neon"] header,:root[data-theme="neon"] nav{background:transparent}
:root[data-theme="neon"] h2,:root[data-theme="neon"] .hero b{text-shadow:0 0 10px rgba(255,43,214,.45)}
:root[data-theme="neon"] .btn:not(.ghost),:root[data-theme="neon"] .seg button[aria-pressed="true"]{box-shadow:0 0 14px rgba(255,43,214,.7),0 0 2px #fff inset}
:root[data-theme="neon"] nav [aria-current="true"]{color:#00f0ff;filter:drop-shadow(0 0 6px #00f0ff)}
:root[data-theme="term"]{--bg:#020a03;--surface:#061408;--raised:#0b2210;--line:#124a1c;--fg:#41ff74;--muted:#22a845;--accent:#41ff74;--on-accent:#020a03;--danger:#ffb000;--good:#41ff74;--font:"SF Mono",ui-monospace,Menlo,"Courier New",monospace;color-scheme:dark}
:root[data-theme="term"] body{text-shadow:0 0 6px rgba(65,255,116,.45)}
:root[data-theme="term"] main::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
:root[data-theme="term"] .panel,:root[data-theme="term"] .btn,:root[data-theme="term"] .tile{border-radius:0 !important}
/* nei temi scuri scelti a mano i grafici usano i colori per lo sfondo scuro */
:root[data-theme="grafite"],:root[data-theme="oled"],:root[data-theme="neon"],:root[data-theme="term"]{
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--cx:#6f6d66}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font)}
body{display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;height:auto}
/* iOS 26: nelle web app sulla schermata Home l'altezza "100%" si ferma prima del fondo; 100dvh invece copre tutto lo schermo */
@supports (height:100dvh){html{height:100dvh}body{bottom:auto;height:100dvh}}
button,input,select,textarea{font:inherit;color:inherit}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{position:relative;flex:none;z-index:20;background:var(--bg);padding:calc(var(--top) + 6px) 8px 6px 16px;
  display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
header h1{font:700 22px/1.2 var(--font);margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.logo{border:0;background:none;padding:4px 6px 4px 0;color:var(--muted);flex:none;display:flex;align-items:center}
.logo svg{width:42px;height:26px;display:block}
.logo:active{opacity:.6}
#hMonth{border:0;background:none;padding:6px 0;font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-transform:capitalize}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);flex:none}
.icon-btn:active{background:var(--raised)}
.icon-btn:disabled{opacity:.3}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 0 24px}
.view{max-width:760px;margin:0 auto}

nav{position:relative;flex:none;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--bot)}
nav button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--fg);font-weight:600}
nav button[aria-current="true"] svg{stroke:var(--fg);stroke-width:2.3}
nav .plus svg{width:38px;height:38px;stroke-width:1.4}
nav .plus:active svg{opacity:.6}

.section{padding:8px 16px}
.section>h2,.group{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;font-weight:600}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 10px}
.shead h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.shead button{border:0;background:none;color:var(--fg);font-size:13px;font-weight:600;padding:2px 0}
.panel{background:var(--surface);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.help{color:var(--muted);font-size:13px;line-height:1.55}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font:700 21px/1.25 var(--font);margin:0 0 8px}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--accent);color:var(--on-accent);font-weight:600;display:inline-block;text-align:center}
.btn.ghost{background:var(--raised);color:var(--fg)}
.btn.wide{display:block;width:100%}
.btn.danger{background:none;color:var(--danger)}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}

/* cifra principale del mese */
.hero{padding:18px 16px 4px}
.hero small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.hero b{display:block;font:700 38px/1.15 var(--font);letter-spacing:-.01em;margin:2px 0 6px}
.hero .sub{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.hero .sub span b,.sub b{display:inline;font:600 13px var(--font);color:var(--fg);margin:0;letter-spacing:0}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--muted);margin-top:8px}
.delta i{font-style:normal;font-size:11px}
.delta.up i{color:var(--danger)} .delta.down i{color:var(--good)}

.banner{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 14px;border-radius:14px;background:var(--fg);color:var(--bg);border:0;width:calc(100% - 32px);text-align:left}
.banner svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner div{flex:1;min-width:0}
.banner small{display:block;opacity:.75;font-size:12.5px}

/* ciambella + elenco categorie */
.donut{display:flex;justify-content:center;padding:16px 0 4px}
.donut svg{width:210px;height:210px;overflow:visible}
.donut .dseg{cursor:pointer;transition:opacity .2s}
.donut.focus .dseg{opacity:.3}.donut.focus .dseg.on{opacity:1}
.crow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.crow:first-child{border-top:0}
.crow:active{background:var(--raised)}
.dot{width:12px;height:12px;border-radius:50%;flex:none!important}
/* cerchio colorato con l'icona della categoria */
.cb{width:34px;height:34px;border-radius:50%;flex:none!important;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;line-height:1}
.cb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cb.lg{width:36px;height:36px}.cb.lg svg{width:20px;height:20px}
.cb.sm{width:28px;height:28px;font-size:12px}.cb.sm svg{width:16px;height:16px}
.chip .ci{width:16px;height:16px;flex:none;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"] .ci{stroke:currentColor!important}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.icons button{aspect-ratio:1;border:0;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;padding:0}
.icons button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icons button[aria-pressed="true"]{color:#fff}
.catprev{display:flex;align-items:center;gap:12px;padding:4px 16px 14px}
.catprev b{font-size:17px;font-weight:600}
.crow .mid{flex:1;min-width:0}
.crow .nm{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:500}
.crow .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:6px;border-radius:0 4px 4px 0;background:var(--raised);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.bar.budget i{background:var(--fg)}
.bar.budget.over i{background:var(--danger)}
.warn{color:var(--danger);font-weight:600}
.crow .subs{color:var(--muted);font-size:12px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .subs b{color:var(--fg);font-weight:500}
.nest{padding:0 14px 6px 38px}
.srow{padding:9px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.nest .srow{padding:6px 0;border-top:0}
.srow>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.nest .srow>div:first-child{font-size:13.5px;font-weight:400}
.srow small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.srow .bar{height:4px;margin-top:6px}
.leaf{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.leaf:first-child{border-top:0}
.leaf .mid{flex:1;min-width:0}
.chev{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* movimenti */
.searchbar{display:flex;gap:8px;padding:12px 16px 4px}
.searchbar input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.searchbar input:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--raised);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .dot{width:9px;height:9px}
.chips.sub{padding-top:0}
.chips.sub .chip{background:none;box-shadow:inset 0 0 0 1px var(--line);padding:5px 11px;font-size:12.5px}
.chips.sub .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.catgrid.subs .chip{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.catgrid.subs .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
/* calendario */
.viewseg{padding:12px 16px 0}
.cal{padding:8px 12px 0}
.cal .wd,.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:2px 0 4px}
.cd{border:0;background:var(--surface);border-radius:10px;min-height:66px;padding:5px 1px 5px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);min-width:0}
.cd.blank{background:none;pointer-events:none}
.cd.none{background:none}
.cd.future{opacity:.35}
.cd .n{font-size:13px;font-weight:500;line-height:20px;min-width:22px;padding:0 4px;border-radius:999px;font-variant-numeric:tabular-nums}
.cd.today .n{background:var(--fg);color:var(--bg);font-weight:700}
.cd[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.cd .dots{display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:3px;width:27px;height:15px}
.cd .dots i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.cd .dots b{font-size:9px;line-height:6px;width:6px;text-align:center;color:var(--muted);font-weight:700}
.cd .amt{margin-top:auto;font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden}
.cd .amt.hi{color:var(--fg);font-weight:700}
.cd .amt.in{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 16px 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:18px 16px 6px}
.dayhead b{font-size:16px;font-weight:600;display:block}
.dayhead b::first-letter{text-transform:uppercase}
.dayhead span{color:var(--muted);font-size:13px}
.day{display:flex;justify-content:space-between;padding:16px 16px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tx{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;border:0;background:var(--bg);text-align:left;touch-action:pan-y;transition:transform .22s ease}
.tx:active{background:var(--surface)}
/* scorrendo un movimento verso sinistra compare "Elimina" */
.swipe{position:relative;overflow:hidden;transition:height .2s ease,opacity .2s ease}
.sdel{position:absolute;inset:0;border:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 22px;font-weight:600;font-size:14px}
.sdel svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tx .ic{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;font-size:14.5px;white-space:nowrap}
.tx .a.in{color:var(--good)}
.panel .tx{padding:10px 14px;background:var(--surface)}
.panel .tx:active{background:var(--raised)}
.panel .swipe+.swipe{border-top:1px solid var(--line)}

/* grafici a barre */
.chart{position:relative;padding:14px 10px 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--font);fill:var(--muted)}
.chart .lbl{font-weight:600;fill:var(--fg)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .b{transition:opacity .15s}
.chart.focus .b{opacity:.35}.chart.focus .b.on{opacity:1}
.tip{position:fixed;z-index:70;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;font-size:13px}

/* report */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.tile b{display:block;font:700 20px/1.25 var(--font);margin-top:2px}
.tile span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.story{font-size:15px;line-height:1.6}
.story p{margin:0 0 10px}.story p:last-child{margin:0}
.story b{font-weight:600}
.pill-status{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--raised);color:var(--fg)}
.wk{display:grid;grid-template-columns:34px 1fr 64px;gap:10px;align-items:center;padding:6px 14px;font-size:13px}
.wk .bar{margin:0;height:8px}
.wk .bar i{background:var(--accent)}
.wk em{text-align:right;font-style:normal;color:var(--muted);font-size:12px}

/* fogli a tutto schermo (come il player di YTG) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding-top:var(--top);padding-bottom:calc(var(--bot) + 24px);transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg)}
.pbar h3{flex:1;margin:0;font:700 19px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .btn{padding:8px 16px}
.seg{display:flex;gap:6px;padding:6px 16px 0}
.seg button{flex:1;border:0;border-radius:999px;padding:9px 12px;background:var(--raised);font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.amount{display:flex;align-items:center;justify-content:center;gap:6px;padding:22px 16px 16px;width:100%;border:0;background:none;color:var(--fg)}
.amount #amt{font:700 44px/1.1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.amount #amt.ph{color:var(--muted)}
.amount #amt.long{font-size:34px}
.amount .cur{font:700 32px var(--font);color:var(--muted)}
.amount .caret{width:2px;height:36px;background:var(--fg);margin:0 2px 0 -4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* tastierino dell'app: l'importo resta sempre visibile e c'è il tasto OK */
.kp{position:fixed;left:0;right:0;bottom:0;z-index:45;max-width:760px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 8px calc(var(--bot) + 8px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.kp button{height:52px;border:0;border-radius:12px;background:var(--raised);font:500 24px var(--font);color:var(--fg);display:grid;place-items:center;-webkit-user-select:none;user-select:none}
.kp button:active{background:var(--line)}
.kp .ok{grid-row:span 2;height:auto;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:20px}
.kp .ok:active{opacity:.8;background:var(--accent)}
.kp .zero{grid-column:span 3}
.kp svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet.kpon{padding-bottom:calc(var(--bot) + 290px)}
.field{padding:0 16px 14px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.field input[type=text],.field input[type=date],.field input[inputmode]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
.field input:focus{border-color:var(--accent)}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.catgrid .chip{padding:9px 13px}
.field .subed{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 14px;border-top:1px solid var(--line)}
.field .subed:first-child{border-top:0}
.field .subed input[type=text]{flex:1;min-width:0;width:auto;border:0;background:none;padding:10px 0;min-height:0;border-radius:0}
.field .subed .icon-btn{color:var(--muted)}
.field .subed .icon-btn svg{width:18px;height:18px}
.subadd{display:flex;gap:8px;margin-top:10px}
.field .subadd input[type=text]{flex:1;min-width:0;width:auto}
.subadd .btn{flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatches button{width:33px;height:33px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px transparent;padding:0}
.swatches button[aria-pressed="true"],.swatches label[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.swatches label{position:relative;width:33px;height:33px;border-radius:50%;border:3px solid var(--bg);display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:conic-gradient(#e34948,#eda100,#d4d000,#1baf7a,#2a78d6,#6250d6,#e87ba4,#e34948)}
.swatches label.set{background:var(--sw)}
.swatches label svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.6))}
.swatches label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.swlab{display:block;font-size:12px;color:var(--muted);margin:12px 0 8px}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;font-size:15px}
.list-item:first-child{border-top:0}
.list-item:active{background:var(--raised)}
.list-item span{flex:1;min-width:0}
.list-item small.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:1px 0 2px}
.list-item small{display:block;color:var(--muted);font-size:12px}
.list-item.danger{color:var(--danger)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.themes button{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px 8px;background:var(--surface);color:var(--fg);font:500 12.5px var(--font);display:flex;flex-direction:column;align-items:center;gap:7px}
.themes button[aria-pressed="true"]{border-color:var(--fg)}
.themes .sw{width:44px;height:44px;border-radius:50%;border:1px solid rgba(128,128,128,.35);position:relative;overflow:hidden}
.themes .sw i{position:absolute;right:0;bottom:0;width:50%;height:50%}

.ghform{padding:12px 14px 14px;display:grid;gap:10px}
.ghform input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;min-height:46px}
.ghform input:focus{border-color:var(--accent)}
.ghstat{display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:14px}
.ghstat i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--good)}
.ghstat.err i{background:var(--danger)}
.ghstat.off i{background:var(--muted)}
.ghstat small{display:block;color:var(--muted);font-size:12px}
.ghstat.err small{color:var(--danger)}
.help ol{padding-left:20px;margin:6px 0 0}
.help li{margin:3px 0}
.help a{color:var(--fg);font-weight:600}
.banner.warn{background:var(--danger);color:#fff}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:8px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:1px;display:block}
.spark i.z{background:var(--line)!important;height:1px!important}
.mtab{width:100%;border-collapse:collapse;font-size:13.5px}
.mtab th{text-align:right;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 6px}
.mtab th:first-child,.mtab td:first-child{text-align:left}
.mtab td{text-align:right;padding:9px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mtab tr[data-mrep]{cursor:pointer}
.mtab tr[data-mrep]:active td{background:var(--raised)}
.mtab td:first-child{text-transform:capitalize;font-weight:500}
.mtab td.pos{color:var(--good)}
.mtab td.neg{color:var(--danger)}
.mtab tr.off td{color:var(--muted)}
.mtab tfoot td{font-weight:700;border-top:2px solid var(--line)}
/* card "Statistiche": striscia dei giorni + grafico ad area */
.card2{background:var(--surface);border-radius:14px;padding:14px 0 6px}
.card2 .shead{margin:0 14px 10px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.dstrip::-webkit-scrollbar{display:none}
.dpill{flex:none;width:44px;border:0;border-radius:14px;background:var(--raised);color:var(--fg);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:center}
.dpill b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.dpill small{font-size:10.5px;color:var(--muted);text-transform:capitalize}
.dpill i{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px;opacity:0}
.dpill.has i{opacity:1}
.dpill.on{background:var(--sel,var(--fg));color:var(--on-sel,var(--bg))}
.dpill.on small{color:inherit;opacity:.7}
.dpill.future{opacity:.4}
.area .guide{stroke:var(--muted);stroke-width:1;opacity:0}
.area .gdot{fill:var(--accent);stroke:var(--surface);stroke-width:2;opacity:0}
.area.focus .guide,.area.focus .gdot{opacity:1}
.alegend{display:flex;gap:16px;padding:2px 14px 6px;font-size:12px;color:var(--muted)}
.alegend span{display:inline-flex;align-items:center;gap:6px}
.alegend i{display:block;width:14px;height:8px;border-radius:3px;background:var(--accent)}
.alegend i.dot{height:0;border-radius:0;background:none;border-top:2px dotted var(--hl,var(--muted))}
.tip small{display:block;opacity:.75;font-size:11.5px}
/* barra proporzionale delle categorie + card con i pallini */
.stack{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;margin:0 0 12px}
.stack i{display:block;min-width:3px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ccard{border:0;background:var(--surface);color:var(--fg);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:9px;min-width:0}
.ccard:active{background:var(--raised)}
.ccard .top{display:flex;align-items:center;gap:9px;min-width:0}
.ccard .top div{min-width:0}
.ccard .top b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .top small{display:block;font-size:11.5px;color:var(--muted)}
.ccard .amt{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.ccard .amt b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ccard .amt span{font-size:12px;color:var(--muted);font-weight:600}
.dots20{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dots20 i{display:block;aspect-ratio:1;border-radius:50%;background:var(--raised)}
.ccard .foot{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .foot.warn{color:var(--danger);font-weight:600}
:root[data-theme="viola"] .ccard{border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.hgrid{display:flex;flex-direction:column}
.hgrid .hside{display:contents}
.hgrid .hside>.hero{order:0}.hgrid .hmain{order:1}.hgrid .hside>.section{order:2}
/* PC: barra laterale come una dashboard, contenuto su due colonne */
@media (min-width:900px){
  nav{position:fixed;left:0;top:0;bottom:0;width:88px;flex-direction:column;justify-content:center;gap:6px;border-top:0;border-right:1px solid var(--line);padding:0}
  nav button{flex:none;height:64px}
  header{padding-left:104px}
  main{padding-left:88px}
  #vHome{max-width:1180px}
  .toast{bottom:24px}
  .kp{left:88px}
  .hgrid .hside{display:block}
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:8px 20px;align-items:start;padding:0 8px}
  .hgrid .hside{grid-column:2;grid-row:1/span 2}
  .hgrid .hmain{grid-column:1;grid-row:1}
  .hgrid .hside .hero{margin:16px 0 4px}
  .cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{left:auto;width:min(520px,100%);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--nav-h) + 14px);background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;padding:2px 4px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

/* stampa / PDF del report: solo il contenuto */
@media print{
  html,body{height:auto;overflow:visible;position:static;background:#fff;color:#000}
  body{display:block}
  header,nav,.sheet,.toast,.noprint{display:none!important}
  main{overflow:visible}
  .panel,.tile{background:#f4f2ec;break-inside:avoid}
}
</style>

<body>

<header>
  <h1><button id="hMonth" aria-label="Apri il calendario del mese"></button></h1>
  <button class="icon-btn" id="btnPrev" aria-label="Mese precedente"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="icon-btn" id="btnNext" aria-label="Mese successivo"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  <button class="icon-btn" id="btnGear" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<main id="main">
  <div class="view" id="vHome"></div>
  <div class="view" id="vTx" hidden></div>
  <div class="view" id="vReport" hidden></div>
  <div class="view" id="vCats" hidden></div>
</main>

<nav id="nav">
  <button data-tab="vHome"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="vTx"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Movimenti</button>
  <button class="plus" data-act="add" aria-label="Aggiungi movimento"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button data-tab="vReport"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>Report</button>
  <button data-tab="vCats"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Categorie</button>
</nav>

<section class="sheet" id="sTx" aria-label="Movimento"></section>
<section class="sheet" id="sCat" aria-label="Categoria"></section>
<section class="sheet" id="sSet" aria-label="Impostazioni"></section>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEY = "spese.data";
const BUILD = "20261013123812";
/* icone delle categorie (24×24, tratto) */
const ICONS = {
  casa: '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',

  caffe: '<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5V6M12 3.5V6"/>',
  cocktail: '<path d="M5 4h14l-7 8z"/><path d="M12 12v8M8 20h8"/>',
  borsa: '<path d="M5 8h14l-1 12H6z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/>',
  maglia: '<path d="M8.5 4 4 6.5l1.5 4 2-1V20h9V9.5l2 1 1.5-4L15.5 4a3.5 3.5 0 0 1-7 0z"/>',
  regalo: '<rect x="4" y="9" width="16" height="4" rx="1"/><path d="M5.5 13v7h13v-7M12 9v11M12 9c-1.5-3-5-3.5-5-1.2C7 9 9 9 12 9zM12 9c1.5-3 5-3.5 5-1.2 0 1.2-2 1.2-5 1.2z"/>',
  fulmine: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',
  fiamma: '<path d="M12 21a6 6 0 0 0 6-6c0-3.5-2.5-5.5-3.5-8.5-1 2-2 3-3.5 3.5C11 8 10.5 6 10.5 4 7.5 6.5 6 10.5 6 15a6 6 0 0 0 6 6z"/>',
  goccia: '<path d="M12 3.5s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.3" r=".6"/>',

    i0: ["Stipendio", "stip"], i1: ["Altre entrate", "entrate"] };
  const cats = structuredClone(DEFAULT_CATS), map = {};

    const o = old[c.id];

      const n = cats.find(x => x.id === o[1]); map[c.id] = [n.id, o[2] || null];
      if (c.budget) n.budget = (n.budget || 0) + c.budget;

}

function donut(rows, total){

  const R = 80, C = 2 * Math.PI * R, gap = rows.length > 1 ? 3 : 0;

    const len = total ? r.amt / total * C : 0;
    const vis = Math.max(len - gap, 1.5);
    const s = `<circle class="dseg" data-seg="${esc(r.id)}" cx="100" cy="100" r="${R}" fill="none" stroke="${r.color}" stroke-width="24"
      stroke-dasharray="${vis} ${C - vis}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(r.label)}: ${eur(r.amt)}</title></circle>`;
    off += len; return s;
  }).join("");
  return `<div class="donut" id="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Ripartizione delle spese per categoria">
    <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--raised)" stroke-width="24"/>${segs}

}

/* barre verticali con estremità arrotondate (4px) appoggiate alla base, tocco = etichetta */
function bars(id, vals, opts = {}){
  const W = 340, H = opts.h || 130, top = 18, bottom = 20, n = vals.length;
  const max = Math.max(1, ...vals.map(v => v.v), opts.ref?.v || 0);
  const step = W / n, bw = Math.max(3, Math.min(opts.maxW || 26, step - 2));
  const ph = H - top - bottom;
  const path = (x, y, w, h) => { const r = Math.min(4, w / 2, h); return h <= 0 ? "" : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
  let g = `<line x1="0" x2="${W}" y1="${top + ph + .5}" y2="${top + ph + .5}" stroke="var(--line)"/>`;
  vals.forEach((v, i) => {
    const h = v.v / max * ph, x = i * step + (step - bw) / 2, y = top + ph - h;
    v._y = y; v._H = H;
    g += `<path class="b" data-i="${i}" d="${path(x, y, bw, h)}" fill="${v.color || "var(--accent)"}"/>`;
    if (v.lab) g += `<text x="${i * step + step / 2}" y="${H - 5}" text-anchor="middle">${esc(v.lab)}</text>`;
    if (v.top) g += `<text class="lbl num" x="${i * step + step / 2}" y="${y - 5}" text-anchor="middle">${esc(v.top)}</text>`;
  });
  if (opts.ref && opts.ref.v > 0){
    const y = Math.max(top, top + ph - opts.ref.v / max * ph);
    g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--danger)" stroke-dasharray="3 4" stroke-width="1"/>
      <text x="0" y="${y - 4}">${esc(opts.ref.label)}</text>`;
  }
  if (opts.avg){
    const y = top + ph - opts.avg / max * ph;
    g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
      <text x="${W}" y="${y - 4}" text-anchor="end">media ${eur0(opts.avg)}</text>`;
  }
  vals.forEach((v, i) => g += `<rect class="hit" data-i="${i}" x="${i * step}" y="0" width="${step}" height="${H}"/>`);
  CHARTS[id] = vals;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Grafico")}">${g}</svg></div>`;
}
const CHARTS = {};
/* grafico ad area morbido (mese corrente) con linea a puntini (mese prima) */
function area(id, cur, prev, labels, opts = {}){
  const W = innerWidth >= 900 ? 640 : 340, H = (opts.h || 150) * (innerWidth >= 900 ? 1.3 : 1), top = 12, bottom = 22, n = Math.max(cur.length, prev.length), ph = H - top - bottom;
  const max = Math.max(1, ...cur, ...prev);
  const X = i => n === 1 ? W / 2 : 6 + i * (W - 12) / (n - 1), Y = v => top + ph - v / max * ph;
  const smooth = pts => { if (!pts.length) return ""; let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++){ const [x0, y0] = pts[i - 1] || pts[i], [x1, y1] = pts[i], [x2, y2] = pts[i + 1], [x3, y3] = pts[i + 2] || pts[i + 1];
      const c1x = x1 + (x2 - x0) / 6, c2x = x2 - (x3 - x1) / 6, cl = y => Math.min(top + ph, Math.max(top, y));
      d += ` C${c1x.toFixed(1)},${cl(y1 + (y2 - y0) / 6).toFixed(1)} ${c2x.toFixed(1)},${cl(y2 - (y3 - y1) / 6).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`; }
    return d; };
  const pc = cur.map((v, i) => [X(i), Y(v)]), pp = prev.map((v, i) => [X(i), Y(v)]);
  const line = smooth(pc), base = top + ph, gid = id + "G";
  let g = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".55"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  g += `<line x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}" stroke="var(--line)"/>`;
  if (pc.length) g += `<path d="${line} L${pc[pc.length - 1][0]},${base} L${pc[0][0]},${base}Z" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  if (pp.length && prev.some(Boolean)) g += `<path d="${smooth(pp)}" fill="none" stroke="var(--hl,var(--muted))" stroke-width="2" stroke-dasharray="0 5" stroke-linecap="round"/>`;
  labels.forEach((l, i) => { if (l) g += `<text x="${X(i)}" y="${H - 5}" text-anchor="middle">${esc(l)}</text>`; });
  g += `<line class="guide" x1="0" x2="0" y1="${top}" y2="${base}"/><circle class="gdot" r="4.5" cx="0" cy="0"/>`;
  const step = (W - 12) / Math.max(1, n - 1);
  for (let i = 0; i < n; i++) g += `<rect class="hit" data-i="${i}" x="${X(i) - step / 2}" y="0" width="${step}" height="${H}"/>`;
  CHARTS[id] = Array.from({ length: n }, (_, i) => ({ v: cur[i] ?? null, extra: prev[i], tip: opts.tip(i), _y: cur[i] != null ? Y(cur[i]) : Y(prev[i] || 0), _H: H, _x: X(i) / W, extraLabel: opts.prevLabel, curLabel: opts.curLabel }));
  return `<div class="chart area" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Grafico")}">${g}</svg></div>`;
}
function chartTap(el, i){
  const vals = CHARTS[el.id]; if (!vals) return;
  document.querySelector(".tip")?.remove();
  const was = el.dataset.on === String(i);
  el.querySelectorAll(".b").forEach(b => b.classList.toggle("on", b.dataset.i === String(i)));
  if (was){ el.classList.remove("focus"); delete el.dataset.on; return; }
  el.classList.add("focus"); el.dataset.on = i;
  const v = vals[i], svg = el.querySelector("svg"), box = svg.getBoundingClientRect(), eb = el.getBoundingClientRect();
  const x = box.left + (v._x != null ? v._x : (i + .5) / vals.length) * box.width;
  const gl = el.querySelector(".guide"), gd = el.querySelector(".gdot");
  if (gl){ const vx = v._x * svg.viewBox.baseVal.width; gl.setAttribute("x1", vx); gl.setAttribute("x2", vx); gd.setAttribute("cx", vx); gd.setAttribute("cy", v._y); gd.style.display = v.v == null ? "none" : ""; }
  const y = box.top + (v._y / v._H) * box.height - 8;
  const tip = document.createElement("div");
  tip.className = "tip"; tip.innerHTML = `${esc(v.tip)}<b class="num">${v.v == null ? "–" : eur(v.v)}</b>${v.extra != null && v.extraLabel ? `<small>${esc(v.extraLabel)}: ${eur(v.extra)}</small>` : ""}`;
  tip.style.left = Math.min(Math.max(x, 64), innerWidth - 64) + "px";
  tip.style.top = Math.max(y, $("header").getBoundingClientRect().bottom + 52) + "px";
  document.body.appendChild(tip);
}

/* ---------- Home ---------- */
function statsCard(st){
  const m = S.month, dm = daysIn(m), td = today(), cur = m === thisMonth(), pm = addMonth(m, -1), pdm = daysIn(pm);
  const lastDay = cur ? +td.slice(8) : dm;
  // curve cumulative: quanto hai speso dall'inizio del mese fino a quel giorno, contro il mese prima
  const run = (list, n) => { let acc = 0; return Array.from({ length: n }, (_, i) => (acc += sum(list.filter(t => +t.date.slice(8) === i + 1)))); };
  const curV = run(st.out, lastDay), pout = txIn(pm, "out");
  const prevV = run(pout, Math.min(dm, pdm));
  const days = new Set(st.out.map(t => t.date));
  const pills = Array.from({ length: dm }, (_, i) => { const d = `${m}-${pad(i + 1)}`, wd = GIORNI[pdate(d).getDay()].slice(0, 3);
    return `<button class="dpill${d === (S.day || td) ? " on" : ""}${days.has(d) ? " has" : ""}${d > td ? " future" : ""}" data-goday="${d}" aria-label="${esc(dLabel(d))}"><b>${pad(i + 1)}</b><small>${wd}</small><i></i></button>`; }).join("");
  const labels = Array.from({ length: dm }, (_, i) => (i + 1) % 5 === 0 || i === 0 ? String(i + 1) : "");
  return `<div class="card2"><div class="shead"><h2>Statistiche</h2><span class="help">spesa accumulata</span></div>
    <div class="dstrip" id="dstrip">${pills}</div>
    ${area("chHome", curV, prevV, labels, { h: 150, label: "Spesa accumulata nel mese, confrontata con il mese prima", tip: i => `Fino al ${dShort(`${m}-${pad(i + 1)}`)}`, curLabel: mName(m), prevLabel: `${mName(pm)} allo stesso giorno` })}
    <div class="alegend"><span><i></i>${mName(m)}</span>${prevV.some(Boolean) ? `<span><i class="dot"></i>${mName(pm)}</span>` : ""}</div></div>`;
}
function catCards(st){
  if (!st.cats.length) return "";
  const stack = `<div class="stack" role="img" aria-label="Ripartizione delle spese">${st.cats.map(c => `<i style="flex:${c.amt};background:${cvar(c.cat.color)}" title="${esc(c.cat.name)} ${eur(c.amt)}"></i>`).join("")}</div>`;
  return stack + `<div class="cgrid">${st.cats.map(c => {
    const b = c.cat.budget, over = b && c.amt > b, share = pct(c.amt, st.tot);
    const fill = b ? Math.min(20, Math.round(c.amt / b * 20)) : Math.max(1, Math.round(c.amt / st.tot * 20));
    const col = over ? "var(--danger)" : cvar(c.cat.color);
    const top = c.subs.find(x => x.sub);
    const foot = b ? (over ? `<div class="foot warn">! oltre il budget di ${eur0(c.amt - b)}</div>` : `<div class="foot">${pct(c.amt, b)}% del budget · restano ${eur0(b - c.amt)}</div>`)
      : `<div class="foot">${top ? esc(top.name) + " " + eur0(top.amt) : movs(c.n)}</div>`;
    return `<button class="ccard" data-cat="${c.cat.id}"><div class="top">${cbadge(c.cat, "sm")}<div><b>${esc(c.cat.name)}</b><small>${movs(c.n)}</small></div></div>
      <div class="amt"><b>${eur(c.amt)}</b><span>${share}%</span></div>
      <div class="dots20" aria-hidden="true">${Array.from({ length: 20 }, (_, k) => `<i${k < fill ? ` style="background:${col}"` : ""}></i>`).join("")}</div>${foot}</button>`;
  }).join("")}</div>`;
}
function renderHome(){

    banner = `<button class="banner" data-act="openReport" data-m="${pm}"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>

  v.innerHTML = banner + `<div class="hgrid">

  const strip = $("#dstrip"), on = strip?.querySelector(".dpill.on");
  if (strip && on) strip.scrollLeft = on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2;

/* ---------- Movimenti ---------- */
/* calendario del mese: per ogni giorno un pallino per categoria (dalla più costosa) e il totale speso */
function calendar(list){
  const m = S.month, dm = daysIn(m), lead = (pdate(m + "-01").getDay() + 6) % 7, td = today();
  const byDay = {}; for (const t of list) (byDay[t.date] ||= []).push(t);
  const outDays = Object.values(byDay).map(a => sum(a.filter(t => t.type === "out"))).filter(Boolean);
  const avg = outDays.length ? outDays.reduce((a, b) => a + b, 0) / outDays.length : 0;
  const short = c => { const e = Math.round(c / 100); return e >= 1000 ? (e / 1000).toFixed(1).replace(".", ",").replace(",0", "") + "k" : e + " €"; };
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span class="cd blank"></span>`;
  for (let d = 1; d <= dm; d++){
    const date = `${m}-${pad(d)}`, txs = byDay[date] || [], out = txs.filter(t => t.type === "out");
    const tot = sum(out), inc = sum(txs.filter(t => t.type === "in")), cats = byCat(out);
    const dots = cats.slice(0, cats.length > 6 ? 5 : 6).map(c => `<i style="background:${cvar(c.cat.color)}"></i>`).join("") + (cats.length > 6 ? "<b>+</b>" : "");
    const amt = tot ? `<span class="amt${tot > avg * 1.5 && outDays.length > 2 ? " hi" : ""}">${short(tot)}</span>` : inc ? `<span class="amt in">+${short(inc)}</span>` : "";
    const cls = ["cd", date === td ? "today" : "", txs.length ? "" : "none", date > td ? "future" : ""].filter(Boolean).join(" ");
    const lab = `${dLabel(date)}: ${tot ? "spesi " + eur(tot) + " in " + cats.map(c => c.cat.name).join(", ") : "nessuna spesa"}`;
    cells += `<button class="${cls}" data-day="${date}" aria-pressed="${S.day === date}" aria-label="${esc(lab)}"><span class="n">${d}</span><span class="dots">${dots}</span>${amt}</button>`;
  }
  const used = byCat(list.filter(t => t.type === "out")).map(c => c.cat);
  const legend = used.length ? `<div class="legend">${used.map(c => `<span><i style="background:${cvar(c.color)}"></i>${esc(c.name)}</span>`).join("")}</div>` : "";
  let detail = "";
  if (S.day){
    const txs = (byDay[S.day] || []).sort((a, b) => b.ts - a.ts), tot = sum(txs.filter(t => t.type === "out"));
    detail = `<div class="dayhead"><b>${dLabel(S.day)}</b><span class="num">${tot ? "−" + eur(tot) : txs.length ? "" : "nessuna spesa"}</span></div>
      ${txs.map(txRow).join("")}
      <div class="row-btns" style="margin-top:10px"><button class="btn ghost" data-act="addOn" data-day="${S.day}">+ Aggiungi in questo giorno</button></div>`;
  } else detail = `<p class="help" style="padding:14px 16px 0;text-align:center">Tocca un giorno per vedere cosa hai speso.</p>`;
  return `<div class="cal"><div class="wd">${["lun", "mar", "mer", "gio", "ven", "sab", "dom"].map(x => `<span>${x}</span>`).join("")}</div><div class="grid">${cells}</div></div>${legend}${detail}`;
}
function renderTx(){
  const v = $("#vTx"), all = txIn(S.month);
  if (!all.length){ v.innerHTML = emptyMonth(); return; }
  const usedCats = byCat(all.filter(t => t.type === "out")).map(c => c.cat);
  const q = S.q.trim().toLowerCase();
  const macro = S.filter.startsWith("c:") ? S.filter.slice(2) : null;
  const list = all.filter(t => {
    if (S.filter === "out" && t.type !== "out") return false;
    if (S.filter === "in" && t.type !== "in") return false;
    if (macro && t.cat !== macro) return false;
    if (macro && S.sf !== null && (sub(t)?.id || "-") !== S.sf) return false;
    if (q && !(`${t.note} ${catLabel(t)} ${fmtInput(t.amt)}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const chip = (k, label, c) => `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${c ? cmark(c) : ""}${esc(label)}</button>`;
  if (S.day && !S.day.startsWith(S.month)) S.day = null;
  if (!S.day && S.month === thisMonth()) S.day = today();
  let html = `<div class="seg viewseg"><button data-view="list" aria-pressed="${S.view === "list"}">Lista</button><button data-view="cal" aria-pressed="${S.view === "cal"}">Calendario</button></div>
    <div class="searchbar"><input type="search" id="q" placeholder="Cerca per nota, categoria o importo" value="${esc(S.q)}" enterkeyhint="search"></div>
    <div class="chips">${chip("all", "Tutti")}${chip("out", "Spese")}${chip("in", "Entrate")}${usedCats.map(c => chip("c:" + c.id, c.name, c)).join("")}</div>`;
  if (macro){
    const subs = bySub(all.filter(t => t.cat === macro));
    const schip = (k, label) => `<button class="chip" data-sfilter="${k ?? ""}" aria-pressed="${S.sf === k}">${esc(label)}</button>`;
    if (subs.some(x => x.sub)) html += `<div class="chips sub">${schip(null, "Tutte")}${subs.map(x => schip(x.key, x.name)).join("")}</div>`;
  }
  const tot = sum(list.filter(t => t.type === "out")), inc = sum(list.filter(t => t.type === "in"));
  if (S.view === "cal"){ v.innerHTML = html + calendar(list); return; }
  html += `<div class="day" style="padding-top:10px"><span>${list.length} moviment${list.length === 1 ? "o" : "i"}</span><span class="num">${tot ? "−" + eur(tot) : ""}${tot && inc ? " · " : ""}${inc ? "+" + eur(inc) : ""}</span></div>`;
  let day = "";
  for (const t of list){
    if (t.date !== day){
      day = t.date;
      const dt = sum(list.filter(x => x.date === day && x.type === "out"));
      html += `<div class="day"><span>${dLabel(day)}</span><span class="num">${dt ? "−" + eur(dt) : ""}</span></div>`;
    }
    html += txRow(t);
  }
  if (!list.length) html += `<div class="empty"><p>Nessun movimento corrisponde alla ricerca.</p></div>`;
  v.innerHTML = html;
}

/* ---------- Report ---------- */
function reportStory(st, pst){
  const M = mName(st.m), P = mName(pst.m), cur = st.m === thisMonth(), ps = [];
  const n = st.out.length;
  let p1 = `A ${M} hai speso <b>${eur(st.tot)}</b> in ${n} moviment${n === 1 ? "o" : "i"}`;
  if (pst.tot){ const p = pct(st.tot - pst.tot, pst.tot); p1 += p === 0 ? `, praticamente come a ${P}` : `, <b>il ${Math.abs(p)}% ${p > 0 ? "in più" : "in meno"}</b> rispetto a ${P} (${eur(pst.tot)})`; }
  p1 += ".";
  if (cur){
    const dd = +today().slice(8), dm = daysIn(st.m), left = dm - dd;
    if (left > 0 && dd >= 3) p1 += ` Il mese è ancora in corso (mancano ${left} giorni): a questo ritmo chiuderesti intorno a <b>${eur0(st.tot / dd * dm)}</b>.`;
  }
  ps.push(p1);
  if (st.cats.length){
    const [a, b, c] = st.cats;
    let p2 = `La voce più pesante è <b>${esc(a.cat.name)}</b> con ${eur(a.amt)}, cioè il ${pct(a.amt, st.tot)}% del totale.`;
    if (b) p2 += ` Seguono ${esc(b.cat.name)} (${eur0(b.amt)})${c ? ` e ${esc(c.cat.name)} (${eur0(c.amt)})` : ""}.`;
    const top3 = st.cats.slice(0, 3).reduce((s, x) => s + x.amt, 0);
    if (st.cats.length > 3) p2 += ` Queste tre categorie da sole fanno il ${pct(top3, st.tot)}% delle tue spese.`;
    ps.push(p2);
    const lv = leaves(st);
    if (lv.length){
      const [x, y] = lv;
      let p3 = `Scendendo nel dettaglio, la voce che pesa di più è <b>${esc(x.s.name)}</b> (${esc(x.c.name)}) con ${eur(x.s.amt)} in ${movs(x.s.n)}`;
      p3 += y ? `, seguita da ${esc(y.s.name)} (${eur0(y.s.amt)}).` : ".";
      const freq = [...lv].sort((a, b) => b.s.n - a.s.n)[0];
      if (freq.s.n >= 5 && freq !== x) p3 += ` La più frequente è ${esc(freq.s.name)}: ${freq.s.n} volte, in media ${eur(freq.s.amt / freq.s.n)} ciascuna.`;
      ps.push(p3);
    }
  }
  if (pst.tot){
    const prevMap = new Map(pst.cats.map(c => [c.cat.id, c.amt]));
    const ids = new Set([...st.cats.map(c => c.cat.id), ...pst.cats.map(c => c.cat.id)]);
    const ch = [...ids].map(id => ({ cat: cat(id), d: (st.cats.find(c => c.cat.id === id)?.amt || 0) - (prevMap.get(id) || 0) }));
    const up = ch.filter(x => x.d >= 500).sort((a, b) => b.d - a.d)[0], dn = ch.filter(x => x.d <= -500).sort((a, b) => a.d - b.d)[0];
    const bits = [];
    if (up) bits.push(`la categoria cresciuta di più è <b>${esc(up.cat.name)}</b> (+${eur0(up.d)})`);
    if (dn) bits.push(`hai tagliato di più su <b>${esc(dn.cat.name)}</b> (−${eur0(-dn.d)})`);
    if (bits.length) ps.push(`Rispetto a ${P}, ${bits.join(", mentre ")}.`);
  }
  const withB = st.cats.filter(c => c.cat.budget);
  const anyB = D.cats.some(c => c.type === "out" && c.budget);
  if (anyB){
    const over = withB.filter(c => c.amt > c.cat.budget);
    ps.push(over.length ? `Budget superato in: ${over.map(c => `<b>${esc(c.cat.name)}</b> (+${eur0(c.amt - c.cat.budget)})`).join(", ")}.` : `Hai rispettato tutti i budget che hai impostato.`);
  }
  if (st.income){
    const r = st.income - st.tot;
    ps.push(r >= 0 ? `Sono entrati ${eur(st.income)}: ti restano <b>${eur(r)}</b>, il ${pct(r, st.income)}% delle entrate.`
      : `Sono entrati ${eur(st.income)}, quindi hai speso <b>${eur(-r)} più di quanto è entrato</b>.`);
  }
  if (st.out.length){
    const big = st.out.reduce((a, b) => b.amt > a.amt ? b : a);
    const wd = Array(7).fill(0); st.out.forEach(t => wd[pdate(t.date).getDay()] += t.amt);
    const wmax = wd.indexOf(Math.max(...wd));
    ps.push(`La spesa singola più alta è stata ${esc(big.note || catLabel(big))} da <b>${eur(big.amt)}</b> (${dShort(big.date)}). Il giorno della settimana in cui spendi di più è il <b>${GIORNI[wmax]}</b>.`);
  }
  return ps.map(p => `<p>${p}</p>`).join("");
}
const rToggle = () => `<div class="seg viewseg noprint"><button data-rview="month" aria-pressed="${S.rview === "month"}">Mese</button><button data-rview="year" aria-pressed="${S.rview === "year"}">Anno</button></div>`;

/* ---------- Report annuale ---------- */
function renderYear(){
  const v = $("#vReport"), Y = S.month.slice(0, 4), PY = String(+Y - 1), cur = Y === thisMonth().slice(0, 4);
  const st = monthStats(Y), pst = monthStats(PY);
  if (!st.out.length && !st.inc.length){
    v.innerHTML = rToggle() + `<div class="empty"><h2>Nessun movimento nel ${Y}</h2><p>Con le frecce in alto puoi passare a un altro anno.</p></div>`; return;
  }
  const months = Array.from({ length: 12 }, (_, i) => `${Y}-${pad(i + 1)}`);
  const ms = months.map(m => { const o = sum(txIn(m, "out")), n = sum(txIn(m, "in")); return { m, out: o, inc: n }; });
  const lastIdx = cur ? +thisMonth().slice(5) - 1 : 11;
  const firstIdx = Math.max(0, ms.findIndex(x => x.out || x.inc));
  const span = Math.max(1, lastIdx - firstIdx + 1);
  const avg = st.tot / span, saved = st.income - st.tot;
  const live = ms.slice(firstIdx, cur ? lastIdx : lastIdx + 1).filter(x => x.out);   // il mese in corso non conta: è incompleto
  const hi = live.reduce((a, b) => b.out > (a?.out ?? -1) ? b : a, null), lo = live.reduce((a, b) => b.out < (a?.out ?? Infinity) ? b : a, null);

  // racconto dell'anno
  const ps = [];
  let p1 = `Nel ${Y}${cur ? " (finora)" : ""} hai speso <b>${eur(st.tot)}</b> in ${movs(st.out.length)}, in media <b>${eur(avg)}</b> al mese.`;
  if (pst.tot){
    // per un anno in corso confronto gli stessi mesi dell'anno prima
    const prevSame = cur ? sum(D.tx.filter(t => t.type === "out" && t.date.startsWith(PY) && +t.date.slice(5, 7) <= lastIdx + 1)) : pst.tot;
    if (prevSame){ const p = pct(st.tot - prevSame, prevSame); p1 += ` Rispetto ${cur ? "agli stessi mesi del" : "al"} ${PY} (${eur0(prevSame)}) è ${p === 0 ? "praticamente uguale" : `<b>il ${Math.abs(p)}% ${p > 0 ? "in più" : "in meno"}</b>`}.`; }
  }
  if (cur && lastIdx < 11 && span >= 2) p1 += ` A questo ritmo chiuderesti l'anno intorno a <b>${eur0(st.tot + avg * (11 - lastIdx))}</b>.`;
  ps.push(p1);
  if (hi && lo && hi !== lo) ps.push(`Il mese più caro è stato <b>${mName(hi.m)}</b> (${eur0(hi.out)}), il più leggero ${mName(lo.m)} (${eur0(lo.out)}).`);
  if (st.cats.length){
    const [a, b, c] = st.cats;
    let p3 = `La voce più pesante dell'anno è <b>${esc(a.cat.name)}</b>: ${eur0(a.amt)}, il ${pct(a.amt, st.tot)}% del totale, circa ${eur0(a.amt / span)} al mese.`;
    if (b) p3 += ` Seguono ${esc(b.cat.name)} (${pct(b.amt, st.tot)}%)${c ? ` e ${esc(c.cat.name)} (${pct(c.amt, st.tot)}%)` : ""}.`;
    const lv = leaves(st);
    if (lv.length) p3 += ` Nel dettaglio, la sottocategoria che pesa di più è ${esc(lv[0].s.name)} (${esc(lv[0].c.name)}) con ${eur0(lv[0].s.amt)}.`;

  }

    const pm = new Map(pst.cats.map(c => [c.cat.id, c.amt]));
    const ch = st.cats.map(c => ({ c: c.cat, d: c.amt - (pm.get(c.cat.id) || 0) })).sort((a, b) => b.d - a.d);
    if (ch[0].d >= 5000) ps.push(`Rispetto al ${PY} è cresciuta soprattutto <b>${esc(ch[0].c.name)}</b> (+${eur0(ch[0].d)}).`);
  }
  if (st.income) ps.push(saved >= 0 ? `Sono entrati ${eur(st.income)}: hai messo da parte <b>${eur(saved)}</b>, il ${pct(saved, st.income)}% delle entrate.`
    : `Sono entrati ${eur(st.income)}: hai speso <b>${eur(-saved)} più di quanto è entrato</b>.`);
  const big = st.out.length ? st.out.reduce((a, b) => b.amt > a.amt ? b : a) : null;
  if (big) ps.push(`La spesa singola più alta dell'anno: ${esc(big.note || catLabel(big))}, <b>${eur(big.amt)}</b> il ${dShort(big.date)}.`);

  // andamento di ogni categoria mese per mese
  const perCat = new Map(st.cats.map(c => [c.cat.id, Array(12).fill(0)]));
  st.out.forEach(t => { const a = perCat.get(cat(t.cat).id); if (a) a[+t.date.slice(5, 7) - 1] += t.amt; });
  const prevMap = new Map(pst.cats.map(c => [c.cat.id, c.amt]));
  const mvals = ms.map((x, i) => ({ v: x.out, lab: mShort(x.m), tip: mLabel(x.m), color: i > lastIdx ? "var(--line)" : "var(--accent)" }));

  v.innerHTML = rToggle() + `<div class="hero"><small>Report del ${Y}${cur ? ` <span class="pill-status">in corso</span>` : ""}</small></div>
  <div class="section" style="padding-top:0">
    <div class="panel pad story">${ps.map(x => `<p>${x}</p>`).join("")}</div>
    <div class="tiles" style="margin-top:10px">
      <div class="tile"><small>Spese</small><b class="num">${eur0(st.tot)}</b><span>${movs(st.out.length)}</span></div>
      <div class="tile"><small>Entrate</small><b class="num">${eur0(st.income)}</b><span>${movs(st.inc.length)}</span></div>
      <div class="tile"><small>${saved >= 0 ? "Risparmio" : "Disavanzo"}</small><b class="num">${eur0(Math.abs(saved))}</b><span>${st.income ? pct(Math.abs(saved), st.income) + "% delle entrate" : "nessuna entrata"}</span></div>
      <div class="tile"><small>Media al mese</small><b class="num">${eur0(avg)}</b><span>su ${span} ${span === 1 ? "mese" : "mesi"}</span></div>
    </div>

    <div class="shead"><h2>Spese mese per mese</h2><span class="help">tocca una barra</span></div>
    <div class="panel">${bars("chYear", mvals, { h: 150, maxW: 20, avg, label: "Spese di ogni mese dell'anno" })}</div>

    ${st.cats.length ? `<div class="shead"><h2>Dove hai speso nell'anno</h2></div>
    <div class="panel">${st.cats.map(c => {
      const arr = perCat.get(c.cat.id), mx = Math.max(1, ...arr), p = prevMap.get(c.cat.id) || 0, d = c.amt - p;
      const dtxt = !pst.tot || cur ? "" : !p ? "nuova" : `${d >= 0 ? "▲ +" : "▼ −"}${eur0(Math.abs(d))} vs ${PY}`;
      return `<button class="crow" data-cat="${c.cat.id}">${cbadge(c.cat)}<div class="mid">
        <div class="nm"><span>${esc(c.cat.name)}</span><span class="num">${eur(c.amt)}</span></div>
        <div class="meta"><span>${pct(c.amt, st.tot)}% · ${eur0(c.amt / span)} al mese</span><span class="num">${dtxt}</span></div>
        <div class="spark" aria-label="Andamento mensile di ${esc(c.cat.name)}">${arr.map((x, i) => `<i class="${x ? "" : "z"}" title="${mName(months[i])}: ${eur(x)}" style="height:${x ? Math.max(8, x / mx * 100) : 0}%;background:${cvar(c.cat.color)}${i > lastIdx ? ";opacity:.3" : ""}"></i>`).join("")}</div>
      </div></button>${hasSubs(c) ? `<div class="nest">${c.subs.slice(0, 5).map(x => `<div class="srow"><div><span>${esc(x.name)}</span><span class="num">${eur(x.amt)}</span></div><small>${movs(x.n)} · ${pct(x.amt, c.amt)}% di ${esc(c.cat.name)}</small></div>`).join("")}${c.subs.length > 5 ? `<div class="srow"><small>e altre ${c.subs.length - 5} sottocategorie</small></div>` : ""}</div>` : ""}`;
    }).join("")}</div>` : ""}

    <div class="shead"><h2>Riepilogo dei mesi</h2><span class="help">tocca un mese</span></div>
    <div class="panel"><table class="mtab"><thead><tr><th>Mese</th><th>Spese</th><th>Entrate</th><th>Saldo</th></tr></thead><tbody>
      ${ms.map((x, i) => { const sd = x.inc - x.out, empty = !x.out && !x.inc; return `<tr${empty ? ' class="off"' : ` data-mrep="${x.m}"`}><td>${mName(x.m)}</td><td>${x.out ? eur0(x.out) : "–"}</td><td>${x.inc ? eur0(x.inc) : "–"}</td><td class="${empty ? "" : sd >= 0 ? "pos" : "neg"}">${empty ? "–" : (sd >= 0 ? "+" : "−") + eur0(Math.abs(sd))}</td></tr>`; }).join("")}
    </tbody><tfoot><tr><td>Totale</td><td>${eur0(st.tot)}</td><td>${eur0(st.income)}</td><td class="${saved >= 0 ? "pos" : "neg"}">${(saved >= 0 ? "+" : "−") + eur0(Math.abs(saved))}</td></tr></tfoot></table></div>

    <div class="row-btns noprint"><button class="btn" data-act="print">Salva in PDF</button><button class="btn ghost" data-act="csvYear">Esporta CSV dell'anno</button></div>
  </div>`;
}

/* ---------- foglio movimento ---------- */
function openTx(id, day){
  const t = id ? D.tx.find(x => x.id === id) : null;
  const last = D.tx.length ? [...D.tx].sort((a, b) => b.ts - a.ts)[0] : null;
  const lastOut = last && last.type === "out";
  S.kp = !t;
  S.edit = t ? { ...t, sub: t.sub || null, raw: fmtInput(t.amt) } : { id: null, type: "out", amt: 0, raw: "", cat: lastOut ? last.cat : D.cats.find(c => c.type === "out")?.id, sub: lastOut ? last.sub || null : null, date: day || (S.month === thisMonth() ? today() : S.month + "-01"), note: "" };
  drawTx();
  open("#sTx");
}
function drawTx(){
  const e = S.edit, cats = D.cats.filter(c => c.type === e.type);
  if (!cats.some(c => c.id === e.cat)){ e.cat = cats[0]?.id; e.sub = null; }
  const mc = cat(e.cat), subs = mc.subs || [];
  if (e.sub && !subs.some(x => x.id === e.sub)) e.sub = null;
  $("#sTx").innerHTML = `<div class="pbar"><button class="icon-btn" data-act="close" aria-label="Chiudi">${ICON_X}</button>
    <h3>${e.id ? "Modifica movimento" : e.type === "out" ? "Nuova spesa" : "Nuova entrata"}</h3><button class="btn" data-act="saveTx">Salva</button></div>
    <div class="seg"><button data-type="out" aria-pressed="${e.type === "out"}">Spesa</button><button data-type="in" aria-pressed="${e.type === "in"}">Entrata</button></div>
    <button class="amount" data-act="kp" aria-label="Importo"><span id="amt"></span><i class="caret"${S.kp ? "" : " hidden"}></i><span class="cur">€</span></button>
    <div class="field"><label>Categoria</label><div class="catgrid">${cats.map(c => `<button class="chip" data-pick="${c.id}" aria-pressed="${c.id === e.cat}">${cmark(c)}${esc(c.name)}</button>`).join("")}
      <button class="chip" data-act="newCat" data-type="${e.type}">+ Nuova</button></div></div>
    ${e.cat ? `<div class="field"><label>Sottocategoria di ${esc(mc.name)}</label><div class="catgrid subs">
      <button class="chip" data-psub="" aria-pressed="${!e.sub}">Nessuna</button>${subs.map(x => `<button class="chip" data-psub="${x.id}" aria-pressed="${x.id === e.sub}">${esc(x.name)}</button>`).join("")}
      <button class="chip" data-act="newSubTx">+ Nuova</button></div></div>` : ""}
    <div class="field"><label for="txDate">Data</label><input type="date" id="txDate" value="${e.date}"></div>
    <div class="field"><label for="txNote">Nota</label><input type="text" id="txNote" placeholder="${e.type === "out" ? "es. Esselunga, cena con amici" : "es. stipendio di ottobre"}" value="${esc(e.note)}" autocomplete="off"></div>
    ${e.id ? `<div class="field"><button class="btn danger wide" data-act="delTx">Elimina movimento</button></div>` : ""}
    <div class="kp" id="kp"${S.kp ? "" : " hidden"}>${["1", "2", "3", "del", "4", "5", "6", ",", "7", "8", "9", "ok", "0"].map(k =>
      k === "del" ? `<button data-k="del" aria-label="Cancella"><svg viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m12 9 5 6M17 9l-5 6"/></svg></button>`
      : k === "ok" ? `<button class="ok" data-k="ok">OK</button>` : `<button data-k="${k}"${k === "0" ? ' class="zero"' : ""}>${k}</button>`).join("")}</div>`;
  $("#sTx").classList.toggle("kpon", !!S.kp);
  sizeAmt();
}
/* tastierino: aggiorna l'importo scritto (al massimo 7 cifre intere e 2 decimali) */
function kpPress(k){
  let r = S.edit.raw || "";
  if (k === "del") r = r.slice(0, -1);
  else if (k === ","){ if (!r.includes(",")) r = (r || "0") + ","; }
  else {
    const [int, dec] = r.split(",");
    if (dec !== undefined){ if (dec.length >= 2) return; r += k; }
    else { if (int.length >= 7) return; r = (int === "0" ? "" : int) + k; }
  }
  S.edit.raw = r; sizeAmt();
}
function showKp(on){
  S.kp = on;
  if (on) document.activeElement?.blur?.();
  $("#kp")?.toggleAttribute("hidden", !on);
  document.querySelector("#sTx .caret")?.toggleAttribute("hidden", !on);
  $("#sTx").classList.toggle("kpon", on);
}
function newSubTx(){
  readTx(); const c = cat(S.edit.cat);
  const n = (prompt(`Nuova sottocategoria di ${c.name}`) || "").trim().slice(0, 40); if (!n) return;
  c.subs ||= [];
  let x = c.subs.find(y => y.name.toLowerCase() === n.toLowerCase());
  if (!x){ x = { id: uid(), name: n }; c.subs.push(x); save(); toast(`Sottocategoria "${n}" aggiunta a ${c.name}`); }
  S.edit.sub = x.id; drawTx(); sizeAmt();
}
function readTx(){

/* gesto: trascina a sinistra per scoprire Elimina; trascinando oltre metà riga elimina subito */
const OPEN_W = 96;
function setSwipe(tx, x, anim = true){ tx.style.transition = anim ? "" : "none"; tx.style.transform = x ? `translateX(${x}px)` : ""; tx._x = x; }
function closeSwipes(except){ document.querySelectorAll(".swipe > .tx").forEach(t => { if (t !== except && t._x) setSwipe(t, 0); }); }
function swipeDelete(row){
  const tx = row.querySelector(".tx"), id = tx.dataset.tx;
  setSwipe(tx, -row.offsetWidth);
  row.style.height = row.offsetHeight + "px";
  requestAnimationFrame(() => { row.style.height = "0px"; row.style.opacity = "0"; });
  setTimeout(() => removeTx(id), 220);
}
let SW = null;
document.addEventListener("touchstart", e => {
  const tx = e.target.closest(".swipe > .tx");
  closeSwipes(tx);
  if (!tx || e.touches.length > 1) { SW = null; return; }
  SW = { tx, row: tx.parentElement, x0: e.touches[0].clientX, y0: e.touches[0].clientY, base: tx._x || 0, x: tx._x || 0, mode: null };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!SW) return;
  const dx = e.touches[0].clientX - SW.x0, dy = e.touches[0].clientY - SW.y0;
  if (!SW.mode){ if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) SW.mode = "h"; else if (Math.abs(dy) > 8) { SW = null; return; } else return; }
  e.preventDefault();
  let x = Math.min(0, SW.base + dx);
  if (x > -OPEN_W) x = x; else x = -OPEN_W + (x + OPEN_W) * 0.9;   // un filo di resistenza oltre il pulsante
  SW.x = x; setSwipe(SW.tx, x, false);
}, { passive: false });
document.addEventListener("touchend", () => {
  if (!SW) return;
  const { tx, row, x, mode } = SW; SW = null;
  if (mode !== "h") return;
  tx._sw = Date.now();
  if (x < -row.offsetWidth * 0.55) swipeDelete(row);
  else setSwipe(tx, x < -OPEN_W / 2 ? -OPEN_W : 0);
});
document.addEventListener("touchcancel", () => { if (SW){ setSwipe(SW.tx, 0); SW = null; } });

  clean.subs = c.subs.filter(x => x.name);
  if (c.id){ const i = D.cats.findIndex(x => x.id === c.id); D.cats[i] = { ...D.cats[i], ...clean }; }
  else { clean.id = uid(); const fb = D.cats.findIndex(x => x.fallback && x.type === c.type); D.cats.splice(fb < 0 ? D.cats.length : fb, 0, clean); }

function delCat(){

}

async function giveFile(name, text, type){
  const blob = new Blob([text], { type });
  try {
    const f = new File([blob], name, { type });
    if (navigator.canShare?.({ files: [f] })){ await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv(list){
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  return "﻿Data;Tipo;Categoria;Sottocategoria;Importo;Nota\n" + [...list].sort((a, b) => a.date.localeCompare(b.date))
    .map(t => [t.date, t.type === "out" ? "Spesa" : "Entrata", q(cat(t.cat).name), q(sub(t)?.name || ""), fmtInput(t.type === "out" ? -t.amt : t.amt), q(t.note || "")].join(";")).join("\n");
}
function applyData(d){ D = migrate({ v: d.v || 1, cats: d.cats, tx: d.tx, opt: { ...(d.opt || {}), theme: D.opt.theme } }); save(); }
function restore(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.cats) || !Array.isArray(d.tx)) throw 0;
      if (!confirm(`Ripristinare ${d.tx.length} movimenti e ${d.cats.length} categorie? I dati attuali verranno sostituiti.`)) return;
      applyData(d); close(); render(); toast("Backup ripristinato");
    } catch { toast("Questo file non è un backup valido"); }
  };
  r.readAsText(file);
}

function demo(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // [macro, indice sottocategoria, volte al mese, min €, max €, giorni fissi, note]
  const plan = [
    ["casa", 0, 1, 650, 650, [1], "Affitto"], ["casa", 1, .4, 80, 120, [5], "Rata condominio"],
    ["cibo", 0, 4, 45, 95, null, ["Esselunga", "Coop", "Lidl"]], ["cibo", 1, 3, 25, 60, null, ["Pizzeria", "Sushi", "Trattoria"]],
    ["cibo", 2, 3, 8, 15, null, ["Pranzo in ufficio", "Panino"]], ["cibo", 3, 8, 1.2, 4, null, ["Caffè", "Colazione al bar"]],
    ["cibo", 4, 2, 5, 20, null, ["Snack", "Gelato", "Pasticceria"]], ["cibo", 5, 1.5, 15, 30, null, ["Glovo", "Deliveroo"]],
    ["bollette", 0, 1, 40, 80, [8], "Luce"], ["bollette", 1, 1, 30, 90, [12], "Gas"], ["bollette", 3, 1, 29.9, 29.9, [20], "Fibra"],
    ["trasporti", 0, 3, 40, 65, null, "Benzina"], ["trasporti", 2, 2, 2, 8, null, ["Parcheggio", "Autostrada"]],
    ["svago", 0, 2, 15, 45, null, ["Cinema", "Concerto", "Aperitivo"]], ["svago", 1, 1, 12.99, 12.99, [15], "Netflix"], ["svago", 2, .7, 20, 60, null, "Steam"],
    ["shopping", 0, 1, 30, 90, null, ["Zara", "Scarpe"]], ["shopping", 1, .5, 20, 150, null, "Amazon"],
    ["salute", 0, 1, 8, 30, null, "Farmacia"], ["salute", 2, 1, 45, 45, [3], "Palestra"]
  ].filter(([c]) => D.cats.some(x => x.id === c));
  const m0 = addMonth(thisMonth(), -3), tx = [];
  for (let k = 0; k < 4; k++){
    const m = addMonth(m0, k), last = m === thisMonth() ? +today().slice(8) : daysIn(m);
    for (const [c, si, per, lo, hi, days, notes] of plan){
      const sid = cat(c).subs?.[si]?.id || null;
      const n = Math.max(1, Math.round(per * (0.8 + rnd() * 0.6) * last / daysIn(m)));
      if (per < 1 && rnd() > per) continue;
      for (let j = 0; j < n; j++){
        const d = days ? days[j % days.length] : 1 + Math.floor(rnd() * last); if (d > last) continue;
        tx.push({ id: uid() + j + c + si + k, type: "out", cat: c, sub: sid, amt: Math.round((lo + rnd() * (hi - lo)) * 100), date: `${m}-${pad(d)}`, note: Array.isArray(notes) ? notes[Math.floor(rnd() * notes.length)] : notes, ts: Date.now() - 1e6 + tx.length });

  }
  D.tx = D.tx.concat(tx);
